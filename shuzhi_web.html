<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>述职题库</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #1f2329; }
  .wrap { max-width: 860px; margin: 40px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .meta { display: flex; justify-content: space-between; color: #8f959e; font-size: 14px; }
  .tag { background: #e8f0fe; color: #3370ff; padding: 2px 10px; border-radius: 12px; }
  h2 { font-size: 22px; line-height: 1.6; margin: 18px 0 24px; }
  .section-title { font-weight: 600; margin: 20px 0 8px; }
  .answer { line-height: 1.8; white-space: pre-wrap; }
  .points { display: flex; flex-wrap: wrap; gap: 8px; }
  .point { border: 1px solid #dee0e3; border-radius: 6px; padding: 4px 10px; font-size: 14px; }
  .point small { color: #8f959e; }
  .hidden { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  button { font-size: 15px; padding: 8px 20px; border-radius: 6px; border: 1px solid #dee0e3; background: #fff; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3370ff; color: #3370ff; }
  button:disabled { color: #bbbfc4; cursor: not-allowed; }
  button.primary { background: #3370ff; color: #fff; border-color: #3370ff; }
  button.primary:hover { background: #4e83fd; color: #fff; }
  .hint { color: #8f959e; font-size: 13px; text-align: center; margin-top: 12px; }
  .loader { text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loader" class="card loader">
    <p id="loadMsg">正在加载 shuzhi_questions.json …</p>
    <p id="pick" class="hidden">无法自动读取题库（直接双击打开 html 时浏览器会拦截），请手动选择文件：<br><br>
      <input type="file" id="fileInput" accept=".json"></p>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <div class="meta"><span class="tag" id="category"></span><span id="progress"></span></div>
      <h2 id="question"></h2>
      <button class="primary" id="toggle">显示参考答案</button>
      <div id="detail" class="hidden">
        <div class="section-title">参考答案</div>
        <div class="answer" id="answer"></div>
        <div class="section-title">要点</div>
        <div class="points" id="points"></div>
      </div>
    </div>
    <div class="bar">
      <button id="prev">上一题</button>
      <button id="shuffle">打乱顺序</button>
      <button id="next">下一题</button>
    </div>
    <div class="hint">快捷键：← 上一题，→ 下一题，空格 显示/隐藏答案</div>
  </div>
</div>

<script>
let bank = [], order = [], idx = 0;
const $ = id => document.getElementById(id);

function start(data) {
  bank = data;
  order = bank.map((_, i) => i);
  $('loader').classList.add('hidden');
  $('main').classList.remove('hidden');
  render();
}

function render() {
  const q = bank[order[idx]];
  $('category').textContent = q.category;
  $('progress').textContent = `${idx + 1} / ${order.length}`;
  $('question').textContent = q.question;
  $('answer').textContent = q.answer;
  $('points').innerHTML = '';
  q.points.forEach(p => {
    const el = document.createElement('span');
    el.className = 'point';
    el.textContent = p.name + ' ';
    const kw = document.createElement('small');
    kw.textContent = '（' + p.keywords.join(' / ') + '）';
    el.appendChild(kw);
    $('points').appendChild(el);
  });
  $('detail').classList.add('hidden');
  $('toggle').textContent = '显示参考答案';
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === order.length - 1;
}

function go(step) {
  const n = idx + step;
  if (n >= 0 && n < order.length) { idx = n; render(); }
}

function toggle() {
  const hidden = $('detail').classList.toggle('hidden');
  $('toggle').textContent = hidden ? '显示参考答案' : '隐藏参考答案';
}

$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('toggle').onclick = toggle;
$('shuffle').onclick = () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  render();
};
document.addEventListener('keydown', e => {
  if ($('main').classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
});

$('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => start(JSON.parse(t))).catch(err => { $('loadMsg').textContent = '解析失败：' + err.message; });
};

fetch('shuzhi_questions.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(start)
  .catch(() => { $('loadMsg').textContent = '未能自动加载题库。'; $('pick').classList.remove('hidden'); });
</script>
</body>
</html>
