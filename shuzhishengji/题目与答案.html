。\n  3. 都没有就绪时：有 default 就执行 default（实现非阻塞的读写）；没有 default 就阻塞，把当前 G 同时挂到所有相关 channel 的等待队列上，任意一个就绪后被唤醒，再把它从其他 channel 的等待队列中移除。\n- 常见用法：\n  - 超时控制：`case <-time.After(d)`，或者 `case <-ctx.Done()`。\n  - 非阻塞发送和接收：带上 default。\n  - 多路复用：同时等待多个 channel。\n  - 空的 select（`select {}`）会永久阻塞。\n- 注意：在循环中使用 time.After，每次都会创建新的定时器（Go 1.23 之前，没有触发的定时器在到期之前无法被回收），频繁的循环中应该复用 time.Timer。"}, {"no": 7, "title": "【高频】sync.Mutex 的正常模式和饥饿模式是什么？", "section": "并发", "answer": "- 正常模式：\n  - 等待锁的 G 按 FIFO 的顺序排队，但被唤醒的 G 要和新到达的 G 竞争。\n  - 新到达的 G 正在 CPU 上运行，而且可能有很多个，更容易抢到锁，被唤醒的 G 经常竞争失败。\n  - 这种方式吞吐量高（减少了上下文切换），但可能导致排队的 G 长时间获取不到锁。\n  - 加锁前还会先自旋几次（多核，并且有其他正在运行的 P 时），试图避免挂起。\n- 饥饿模式（Go 1.9 引入）：\n  - 当一个 G 等待锁超过 1ms 时，锁切换到饥饿模式。\n  - 解锁时，锁直接交给等待队列中排在最前面的 G；新到达的 G 不再竞争，也不自旋，直接排到队尾。\n  - 当获得锁的 G 是队列中最后一个，或者它的等待时间小于 1ms 时，切换回正常模式。\n- 目的：在吞吐量和公平性之间取得平衡，防止尾部延迟过高。\n- 使用注意：Mutex 不可重入（同一个 G 重复加锁会死锁）；不能复制已经使用过的 Mutex（用 go vet 检查）；用 defer Unlock，保证释放。"}, {"no": 8, "title": "RWMutex 适合什么场景？有什么坑？", "section": "并发", "answer": "- 适合：读远多于写的场景（如本地缓存、配置），多个读操作可以并发执行，写操作是独占的。\n- 原理：写锁获取后会阻止新的读锁；已经持有读锁的读操作完成后，写操作才能进行（写优先，防止写操作饿死）。\n- 坑：\n  - 读写比例不高，或者临界区很短时，RWMutex 的开销比 Mutex 更大，性能反而更差。\n  - 不可重入，并且存在递归加读锁导致的死锁：一个 G 持有读锁，这时另一个 G 请求写锁（于是阻止了新的读锁），这个 G 再次申请读锁，就会和写锁互相等待，形成死锁。\n  - 不能在持有读锁的情况下升级为写锁（会死锁），必须先释放读锁，再获取写锁，并且获取后要重新检查条件。\n  - 在多核下读锁本身也有竞争（读操作要修改计数器），读操作极其频繁时，可以考虑用 atomic.Value、sync.Map 或分片锁。"}, {"no": 9, "title": "【高频】sync.WaitGroup、errgroup 怎么用？errgroup 怎么限制并发数？", "section": "并发", "answer": "- WaitGroup：等待一组 goroutine 结束。\n  - Add(n) 必须在启动 goroutine 之前调用，不能放在 goroutine 内部（否则 Wait 可能先执行完）。\n  - 每个 goroutine 结束时调用 Done（用 defer）。\n  - Wait 阻塞直到计数归零。\n  - 不能传递 WaitGroup 的副本（要传指针）。\n  - Go 1.25 新增了 `wg.Go(func())`，可以简化写法。\n- errgroup（golang.org/x/sync/errgroup）：在 WaitGroup 的基础上增加了错误传播和取消。\n  - `g, ctx := errgroup.WithContext(ctx)`。\n  - `g.Go(func() error {...})` 启动任务。\n  - `g.Wait()` 返回第一个非 nil 的错误；只要有一个任务返回错误，ctx 就会被取消，其他使用这个 ctx 的任务可以尽早退出。\n- 限制并发数：`g.SetLimit(n)`，达到上限时 g.Go 会阻塞，直到有任务完成；或者使用 `g.TryGo`，达到上限时不阻塞，直接返回 false。\n- 注意：任务内部的 panic 不会被 errgroup 捕获，需要自己 recover。"}, {"no": 10, "title": "sync.Once、sync.Pool 的原理和使用场景是什么？", "section": "并发", "answer": "- sync.Once：保证某个函数只执行一次（并发安全），用于单例、延迟初始化、只关闭一次 channel。\n  - 原理：用原子操作检查 done 标志，没有执行过时加锁，二次检查后执行函数，执行完再设置 done。\n  - 注意：如果函数 panic，也视为已经执行过，之后不会再执行；在 Once 的函数里再次调用同一个 Once 会死锁。\n  - Go 1.21 新增了 OnceFunc、OnceValue、OnceValues，用起来更方便。\n- sync.Pool：临时对象池，复用对象以减少内存分配和 GC 压力，适合频繁创建、生命周期短的对象（如 bytes.Buffer、序列化缓冲区）。\n  - 原理：每个 P 有一个本地池（无锁访问），取不到时从其他 P 偷取，再取不到就调用 New 创建。\n  - 池中的对象在 GC 时会被清理（Go 1.13 之后有 victim cache，对象可以多存活一轮 GC）。\n  - 注意：\n    - 不能用来存放必须保留的对象（如连接池），因为对象随时可能被回收。\n    - 取出的对象要先重置状态。\n    - 放回池中的大对象（如很大的 buffer）会一直占用内存，可以设置大小上限，超过就不放回。"}, {"no": 11, "title": "【高频】sync.Map 适合什么场景？和 map + 锁相比怎么选？", "section": "并发", "answer": "- 适合的场景（官方说明）：\n  - 一个 key 只写入一次、之后读取很多次（如只增长的缓存）。\n  - 多个 goroutine 读写的 key 集合互不相交。\n  - 在这两种场景下，sync.Map 的锁竞争比 map 加 Mutex 少得多。\n- 原理：分为 read（只读的 map，通过原子操作访问，不需要加锁）和 dirty（需要加锁访问）两部分。读操作先查 read，查不到再加锁查 dirty；未命中 read 的次数达到 dirty 的长度时，把 dirty 提升为新的 read。\n- 不适合：频繁写入和更新、key 经常变化的场景，性能不如 map 加锁；没有 Len 方法；值是 any 类型，需要做类型断言（Go 1.24 之后的实现改为了并发哈希前缀树，性能有所改进）。\n- 选择：\n  - 一般情况下用 map 加 Mutex 或 RWMutex，代码清晰、有类型安全。\n  - 读多写少、有大量并发读的场景，可以考虑 sync.Map。\n  - 高并发读写时，可以使用分片 map（按 key 的哈希值分成多个 map，每个 map 有自己的锁）。"}, {"no": 12, "title": "atomic 包能做什么？CAS 是什么？", "section": "并发", "answer": "- atomic 包：对整数、指针、bool 等类型提供原子操作（Add、Load、Store、Swap、CompareAndSwap），不需要加锁就能实现并发安全的计数器和标志位；atomic.Value 可以原子地存储和读取任意类型的值（常用于配置的热更新：用 Store 替换整个配置对象，读取时用 Load）。\n- Go 1.19 新增了类型化的原子类型：atomic.Int64、atomic.Bool、atomic.Pointer[T]，使用更安全。\n- CAS（Compare-And-Swap）：如果当前值等于期望的旧值，就把它更新为新值，并返回成功；否则不修改，返回失败。由 CPU 指令（如 x86 的 LOCK CMPXCHG）保证原子性，是实现无锁数据结构和乐观锁的基础。\n- 典型用法：在循环中执行 CAS，失败就重新读取、重新计算、再次尝试。\n- 注意：\n  - ABA 问题：值从 A 变为 B 又变回 A，CAS 无法察觉（Go 中较少遇到，必要时加版本号）。\n  - 竞争激烈时，CAS 反复失败，CPU 空转。\n  - 原子操作只保证单个变量的原子性，涉及多个变量的一致性仍然需要加锁。"}, {"no": 13, "title": "【高频】goroutine 泄漏有哪些常见原因？怎么排查？", "section": "并发", "answer": "- 常见原因（goroutine 永远阻塞，无法退出）：\n  - 向没有接收者的 channel 发送数据，或者从没有发送者、也不会被关闭的 channel 接收数据。典型例子：超时返回后，后台的 goroutine 仍然往一个无缓冲的结果 channel 发送数据，但已经没有人接收了。解决方法是使用有缓冲的 channel，或者通过 select 配合 ctx.Done()。\n  - 没有使用 context 取消，下游调用没有设置超时，一直阻塞在网络 IO 上。\n  - 死锁，或者锁一直没有释放。\n  - 在 for-select 循环中没有退出的条件。\n  - time.Ticker 没有调用 Stop，配合它的 goroutine 一直运行。\n  - HTTP 响应体（resp.Body）没有关闭，导致连接和读取它的 goroutine 无法释放。\n- 排查：\n  - 监控 goroutine 的数量（runtime.NumGoroutine），持续增长就说明有泄漏。\n  - pprof：`/debug/pprof/goroutine?debug=1` 按调用栈聚合，查看哪个位置的 goroutine 数量异常多；`debug=2` 可以看到每个 goroutine 阻塞的状态和已经阻塞的时长。\n  - 单元测试中可以使用 go.uber.org/goleak 检测泄漏。\n- 预防：每启动一个 goroutine，都要想清楚它怎么退出；统一传递 ctx；设置超时；channel 由发送方负责关闭。"}, {"no": 14, "title": "【高频】context 的作用是什么？WithCancel、WithTimeout、WithValue 怎么用？", "section": "并发", "answer": "- 作用：在调用链中传递取消信号、截止时间和请求范围内的值；控制 goroutine 的生命周期，防止资源泄漏。\n- 用法：\n  - `context.Background()` 和 `context.TODO()`：根 context。\n  - `WithCancel(parent)`：返回 ctx 和 cancel 函数；调用 cancel 后，这个 ctx 和它所有的子 ctx 都被取消（Done 通道被关闭）。\n  - `WithTimeout(parent, d)` 和 `WithDeadline`：到时间后自动取消；必须 `defer cancel()`，以便提前释放定时器。\n  - `WithValue(parent, key, val)`：传递请求范围内的数据（trace_id、用户 ID）。key 要使用自定义的未导出类型，防止和其他包冲突；不要用它来传递业务参数（可选参数应该显式地作为函数参数传递）。\n  - Go 1.20 及以后：`WithCancelCause` 可以携带取消的原因；Go 1.21 新增 `WithoutCancel`（继承值但不继承取消，用于在请求结束后还要继续执行的异步任务）和 `AfterFunc`。\n- 约定：ctx 作为函数的第一个参数；不要把 ctx 存储在结构体中；不要传 nil 的 ctx。\n- 在下游调用中，要真正使用 ctx：`http.NewRequestWithContext`、数据库的 `QueryContext`，以及在 select 中监听 `ctx.Done()`。"}, {"no": 15, "title": "【专家】context 取消信号是怎么在父子之间传播的？", "section": "并发", "answer": "- 结构：cancelCtx 内部有一把锁 mu、一个懒加载创建的 done channel、一个 children 集合（记录可以被取消的子 ctx）、一个 err 字段（取消的原因）。\n- 建立父子关系（propagateCancel）：\n  - 创建子 ctx 时，向上找到最近的一个可以取消的父 ctx（cancelCtx 类型）：\n    - 如果找到了，并且父 ctx 还没被取消，就把子 ctx 加入父 ctx 的 children 集合。\n    - 如果父 ctx 已经被取消，就立即取消子 ctx。\n    - 如果父 ctx 是自定义的、无法识别的类型，就启动一个 goroutine 监听父 ctx 的 Done 通道，父 ctx 取消时再取消子 ctx。\n- 取消（cancel）：\n  1. 加锁，设置 err。\n  2. 关闭 done channel（所有在 `<-ctx.Done()` 上等待的 goroutine 都会被唤醒，因为 channel 被关闭时会广播给所有接收者）。\n  3. 遍历 children，递归地取消每个子 ctx。\n  4. 清空 children，并把自己从父 ctx 的 children 中移除。\n- 特点：取消信号只能从父向子单向传播，子 ctx 取消不会影响父 ctx；timerCtx 在 cancelCtx 的基础上增加了一个定时器，到期时自动调用 cancel。\n- 如果忘记调用 cancel，子 ctx 会一直留在父 ctx 的 children 集合中，直到父 ctx 被取消，造成内存泄漏。"}, {"no": 16, "title": "【高频】如何控制 goroutine 的最大并发数？", "section": "并发", "answer": "- 带缓冲的 channel 作为信号量：\n```go\nsem := make(chan struct{}, 10)\nfor _, t := range tasks {\n    sem <- struct{}{} // 满了就阻塞\n    go func(t Task) { defer func() { <-sem }(); handle(t) }(t)\n}\n```\n- errgroup.SetLimit(n)：同时提供并发限制、错误传播和取消，是最推荐的方式。\n- golang.org/x/sync/semaphore：支持带权重的信号量（一个任务可以占用多个份额），支持 ctx 取消。\n- Worker 池：启动固定数量的 worker goroutine，从任务 channel 中取任务处理，适合任务量很大、需要持续处理的场景（如 ants 库）。\n- 选择并发数的依据：下游的承受能力（数据库连接池的大小、接口的限流）、CPU 核数（CPU 密集型任务）、内存。\n- 注意：Go 1.22 之前，在循环中启动 goroutine 时要注意循环变量的捕获问题（1.22 起，每次迭代都是新的变量）。"}, {"no": 17, "title": "【专家】实现一个带超时、取消、并发限制的批量任务执行器。", "section": "并发", "answer": "```go\ntype Result[T any] struct {\n    Val T\n    Err error\n}\n\n// RunBatch 并发执行 fns，最多 limit 个同时运行，整体超时 timeout；\n// 每个任务的结果按下标写回，单个任务失败不影响其他任务。\nfunc RunBatch[T any](ctx context.Context, limit int, timeout time.Duration,\n    fns []func(context.Context) (T, error)) []Result[T] {\n    ctx, cancel := context.WithTimeout(ctx, timeout)\n    defer cancel()\n    res := make([]Result[T], len(fns))\n    sem := make(chan struct{}, limit)\n    var wg sync.WaitGroup\n    for i, fn := range fns {\n        select {\n        case sem <- struct{}{}:\n        case <-ctx.Done(): // 超时或被取消：剩余任务直接标记失败\n            for j := i; j < len(fns); j++ { res[j].Err = ctx.Err() }\n            wg.Wait()\n            return res\n        }\n        wg.Add(1)\n        go func(i int, fn func(context.Context) (T, error)) {\n            defer wg.Done()\n            defer func() { <-sem }()\n            defer func() {\n                if r := recover(); r != nil { res[i].Err = fmt.Errorf(\"panic: %v\", r) }\n            }()\n            res[i].Val, res[i].Err = fn(ctx)\n        }(i, fn)\n    }\n    wg.Wait()\n    return res\n}\n```\n- 要点：\n  - 用信号量限制并发数。\n  - 用 ctx 控制整体超时和外部的取消，任务函数内部必须使用这个 ctx，取消才能生效。\n  - 结果按下标写入各自的位置，不需要加锁。\n  - 每个任务都有 recover，单个任务 panic 不会导致进程崩溃。\n  - 获取信号量时同时监听 ctx，超时后不再启动新的任务。\n- 需要\"任何一个失败就全部取消\"时，直接用 errgroup.WithContext 加 SetLimit 实现。"}, {"no": 18, "title": "数据竞争（data race）怎么检测？", "section": "并发", "answer": "- 数据竞争：多个 goroutine 同时访问同一个变量，并且至少有一个是写操作，而这些访问之间没有同步（锁、channel、原子操作）。结果不确定，还可能导致程序崩溃（例如并发读写 map 会触发 fatal error，这个错误无法被 recover）。\n- 检测：\n  - 使用 `-race` 参数运行：`go test -race ./...`、`go run -race`、`go build -race`。它基于 ThreadSanitizer，运行时检测到竞争会打印出发生竞争的两处代码的调用栈。\n  - 开销：内存占用增加 5 到 10 倍，运行速度变慢 2 到 20 倍，所以一般在测试和 CI 中开启，不在生产环境中使用。\n  - 只能检测到实际执行过的代码路径，所以测试要覆盖并发场景。\n- 修复：加锁、改用 channel 传递数据、使用原子操作、避免共享（每个 goroutine 写入自己的变量，或者切片的不同下标）。\n- 常见的竞争：在循环中启动的闭包捕获了共享变量；并发 append 同一个切片；读写共享的 map；结构体字段被一个 goroutine 写入、另一个 goroutine 读取。"}, {"no": 19, "title": "【高频】Go 的内存分配机制（mcache、mcentral、mheap）是什么？", "section": "内存与 GC", "answer": "- 设计参考了 TCMalloc，采用多级缓存，减少锁竞争。\n- 对象按大小分类：\n  - 微对象（小于 16 字节，并且不包含指针）：用 tiny 分配器，多个微对象合并到一个 16 字节的块中。\n  - 小对象（16 字节到 32KB）：按约 68 种规格（size class）分配。\n  - 大对象（大于 32KB）：直接从 mheap 分配。\n- 三级结构：\n  - mcache：每个 P 独有，缓存每种规格的 mspan。分配时不需要加锁，速度最快。\n  - mcentral：每种规格一个，管理这种规格所有的 mspan。mcache 中某个规格用完时，从 mcentral 获取新的 mspan（需要加锁，但锁的粒度是按规格划分的）。\n  - mheap：全局唯一，管理从操作系统申请的大块内存（按页管理）。mcentral 不够用时从 mheap 获取，mheap 不够时再向操作系统申请（mmap）。\n- mspan：由连续的若干页组成，被切分成固定大小的对象槽，用位图记录哪些槽已经被使用。\n- 栈内存由单独的栈分配器管理。"}, {"no": 20, "title": "【高频】逃逸分析是什么？哪些情况会导致变量逃逸到堆上？", "section": "内存与 GC", "answer": "- 逃逸分析：编译器在编译期分析变量的作用域，判断它能否分配在栈上。分配在栈上的变量随着函数返回自动回收，没有 GC 的开销，速度快；无法确定生命周期的变量就逃逸到堆上，由 GC 负责回收。\n- 查看方法：`go build -gcflags=\"-m\"`（使用 `-m -m` 可以看到更详细的原因）。\n- 常见的逃逸情况：\n  - 返回局部变量的指针。\n  - 变量被闭包捕获，并且闭包的生命周期比函数更长。\n  - 赋值给 interface 类型（如传给 fmt.Println(x)、作为 any 参数），编译器在编译期无法确定具体类型时。\n  - 发送指针或包含指针的值到 channel。\n  - 存入全局变量，或者存入已经在堆上的对象中。\n  - 切片或 map 的大小在编译期无法确定（make([]T, n)，n 是变量），或者对象太大（超过栈的限制）。\n  - slice append 后的扩容。\n- 优化：在热点路径上减少不必要的指针传递和 interface 转换；预先分配足够大的容量；使用值类型；用 sync.Pool 复用对象。但不要为了避免逃逸而牺牲代码的可读性，要以 pprof 的数据为依据。"}, {"no": 21, "title": "【高频】Go 的 GC 用的是什么算法？三色标记法和写屏障是什么？", "section": "内存与 GC", "answer": "- 算法：并发的、非分代的、不移动对象的标记-清除（mark-sweep）算法，以三色标记为基础，配合混合写屏障，大部分时间和用户代码并发执行，STW 的时间通常在毫秒级以下。\n- 三色标记：\n  - 白色：还没有被访问到（标记结束后仍然是白色的对象就是垃圾）。\n  - 灰色：已经被访问到，但它引用的对象还没有被扫描。\n  - 黑色：它自己和它引用的对象都已经被扫描过。\n  - 过程：从根对象（全局变量、各个 goroutine 的栈、寄存器）出发，先标记为灰色，然后不断取出灰色对象，把它引用的白色对象标记为灰色，自己变为黑色，直到没有灰色对象为止。\n- 写屏障的作用：在并发标记期间，用户代码还在修改引用关系。如果一个黑色对象引用了一个白色对象，同时这个白色对象从所有灰色对象的引用中被删除，它就会被错误地回收。写屏障在指针写入时插入额外的逻辑，保证不会出现这种情况。\n- 混合写屏障（Go 1.8 起）：结合了插入屏障和删除屏障。被覆盖的旧对象和新写入的对象都标记为灰色，并且栈上的对象不需要开启屏障，也不需要在标记结束时重新扫描栈，大大缩短了 STW 的时间。\n- 阶段：开启写屏障（短暂 STW）→ 并发标记（GC 后台工作线程大约占用 25% 的 CPU，分配内存过快的 goroutine 会被要求协助标记）→ 标记终止（短暂 STW）→ 并发清除。"}, {"no": 22, "title": "【专家】GC 调优有哪些手段（GOGC、GOMEMLIMIT、减少分配）？", "section": "内存与 GC", "answer": "- 触发机制：堆内存增长到上次 GC 之后存活堆大小的 (1 + GOGC/100) 倍时触发 GC（GOGC 默认为 100，即堆大小翻倍时触发）。另外，如果两分钟内没有发生过 GC，也会强制触发一次。\n- GOGC：\n  - 调大（如 200 到 400）：GC 次数减少，CPU 开销降低，但内存占用增加。\n  - 调小：内存占用低，但 GC 更频繁。\n  - 设置为 off：关闭 GC。\n- GOMEMLIMIT（Go 1.19 起）：软性的内存上限。内存接近上限时，GC 会更积极地执行。\n  - 常见用法：在容器中把 GOMEMLIMIT 设置为容器内存限制的 90% 左右，同时把 GOGC 调大（甚至设为 off）。这样在内存充足时很少执行 GC，接近上限时再积极回收，防止 OOM。\n  - 注意：如果存活的数据本身就接近上限，GC 会频繁执行，耗尽 CPU（GC 死亡螺旋），运行时会限制 GC 最多占用约 50% 的 CPU。\n- 减少内存分配（最根本的方法）：\n  - 用 pprof 的 allocs 和 heap profile 找到分配内存最多的位置。\n  - 预先分配切片和 map 的容量。\n  - 用 sync.Pool 复用对象。\n  - 减少逃逸。\n  - 避免频繁的字符串拼接和 []byte、string 之间的转换。\n  - 批量处理以减少临时对象。\n  - 减少指针的数量（大量没有指针的数据可以减少 GC 的扫描量）。\n- 观察：`GODEBUG=gctrace=1`、runtime/metrics、pprof 中 GC 的 CPU 占比。\n- 可举例：agent-mount 的优化中，把多协程查库改为批量查询后，内存分配次数从 359 降到 185，减少了 48.5%。"}, {"no": 23, "title": "内存泄漏在 Go 里有哪些常见形式？", "section": "内存与 GC", "answer": "- goroutine 泄漏（最常见）：goroutine 阻塞无法退出，它的栈和引用的对象都不能被回收。\n- 没有上限的缓存或全局 map：只添加不删除。即使删除了 key，map 的底层空间也不会缩小（需要重建 map）。\n- 子切片引用了大数组：`small := big[:10]`，导致整个大数组无法被回收。可以用 copy 复制出需要的部分，或者使用 slices.Clone。\n- 子字符串引用了大字符串：用 strings.Clone 复制出来（Go 1.20 起提供）。\n- time.Ticker 没有 Stop；time.After 在循环中频繁创建（Go 1.23 之前，没有触发的定时器在到期之前无法被回收；1.23 之后已经改进）。\n- 资源没有关闭：HTTP 的 resp.Body、文件、数据库的 Rows（Rows 不关闭还会一直占用连接）。\n- 使用 finalizer 或 cgo 分配的内存没有释放。\n- 排查：对比两个时间点的 heap profile（`go tool pprof -base`），以及 goroutine profile。"}, {"no": 24, "title": "【高频】pprof 怎么用？CPU、heap、goroutine、block、mutex profile 分别看什么？", "section": "内存与 GC", "answer": "- 开启：\n  - 服务中导入 `net/http/pprof`，访问 `/debug/pprof/` 系列的地址（生产环境要限制访问权限，或者使用单独的端口）。\n  - 测试中使用 `go test -cpuprofile`、`-memprofile`。\n  - 分析：`go tool pprof -http=:8080 <profile>` 查看火焰图、top、调用图。\n- 各种 profile：\n  - CPU（profile?seconds=30）：采样 CPU 时间，找出最耗 CPU 的函数和调用路径。\n  - heap：堆内存的使用情况。inuse_space 和 inuse_objects 表示当前还在使用的内存（排查泄漏）；alloc_space 和 alloc_objects 表示累计分配的内存（排查分配过多导致的 GC 压力）。\n  - allocs：等同于按累计分配查看的 heap。\n  - goroutine：所有 goroutine 的调用栈，排查泄漏和死锁（看数量和阻塞的位置）。\n  - block：goroutine 阻塞在同步原语上（channel、select、锁、WaitGroup）的时间。需要先调用 runtime.SetBlockProfileRate 开启。\n  - mutex：锁的竞争情况，找出竞争激烈的锁。需要先调用 runtime.SetMutexProfileFraction 开启。\n  - threadcreate：创建操作系统线程的情况。\n- trace（`go tool trace`）：查看调度、GC、系统调用的时间线，用于分析延迟毛刺和并行度不足的问题。\n- 线上持续剖析（continuous profiling）：如 Pyroscope、Parca。"}, {"no": 25, "title": "【专家】如何用 pprof 和压测量化一次性能优化的效果？", "section": "内存与 GC", "answer": "- 建立基线：\n  - 在相同的环境、相同的数据（如测试智能体手动挂载了 100 个商品）、相同的压测参数下，压测优化前的版本。\n  - 记录延迟（平均值、P99）、QPS、错误率。\n  - 同时采集 CPU、heap、allocs、goroutine、block、mutex 等 profile。\n- 定位瓶颈：分析火焰图和 top 中占比最高的部分（如大量的协程创建、数据库调用、序列化），确定优化的方向。\n- 验证优化：\n  - 用完全相同的参数压测优化后的版本，再次采集 profile。\n  - 用 `go tool pprof -base old.prof new.prof` 对比差异。\n  - 对比各项指标。\n- 微基准测试：针对核心函数写 benchmark（`go test -bench . -benchmem`），用 benchstat 做统计学上的比较，排除噪声。\n- 正确性：性能优化必须同时验证功能没有变化（对比接口返回的数据）。\n- 可举例（agent-mount 优化）：\n  - 压测命令为 `hey -n 100 -c 10`。\n  - 平均耗时从 3.23s 降到 0.197s，Requests/sec 从 3.09 提升到 50.6。\n  - pprof 的数据：内存分配次数从 359 降到 185（减少 48.5%），heap 对象数同样减少 48.5%，goroutine 从 229 降到 160（减少 30.1%），block 和 mutex 都为 0。\n  - 回归验证：对比了 10 类挂载组件的数据，结果一致。"}, {"no": 26, "title": "【高频】slice 的底层结构是什么？扩容规则是什么？", "section": "语言特性", "answer": "- 结构：slice 是一个结构体，包含指向底层数组的指针（array）、长度（len）、容量（cap）三个字段，共 24 字节（64 位系统）。多个 slice 可以共享同一个底层数组。\n- 扩容（append 时，cap 不够用）：\n  - Go 1.18 及以后：\n    - 需要的容量超过原容量的两倍时，直接使用需要的容量。\n    - 原容量小于 256 时，新容量翻倍。\n    - 原容量大于等于 256 时，按 `newcap += (newcap + 3×256) / 4` 逐步增长，增长率从 2 倍平滑地过渡到约 1.25 倍。\n  - Go 1.18 之前：容量小于 1024 时翻倍，大于等于 1024 时每次增长 1.25 倍。\n  - 最后，还会按内存规格（size class）向上取整，所以实际的容量可能比计算出来的值更大。\n- 扩容会分配新的数组并复制数据，原来的 slice 仍然指向旧数组。\n- 优化：能预估大小时，用 `make([]T, 0, n)` 预先分配容量，避免多次扩容和复制。"}, {"no": 27, "title": "slice 作为函数参数传递时，修改会影响原 slice 吗？", "section": "语言特性", "answer": "- Go 中都是值传递：传入函数的是 slice 结构体（指针、长度、容量）的副本，但指针指向的是同一个底层数组。\n- 在函数内修改元素（`s[i] = x`）：会影响原 slice，因为它们共享同一个底层数组。\n- 在函数内 append：\n  - 容量足够、没有扩容时：数据写入了共享的底层数组，但原 slice 的长度没有变化，所以从原 slice 上看不到新的元素（不过底层数组中对应位置的数据已经被修改了，如果原 slice 后续再 append，可能会覆盖或者读到这些数据）。\n  - 发生扩容时：函数内的 slice 指向了新的数组，之后的修改都不会影响原 slice。\n- 正确的做法：需要修改长度时，返回新的 slice（`s = appendXxx(s)`），或者传 slice 的指针。\n- 坑：对子切片 append 可能覆盖原 slice 的数据（共享底层数组），可以用完整切片表达式 `s[a:b:b]` 限制容量，强制 append 时分配新数组。"}, {"no": 28, "title": "【高频】map 的底层实现是什么？为什么遍历是无序的？并发读写会怎样？", "section": "语言特性", "answer": "- 实现（Go 1.24 之前，经典的哈希表）：\n  - hmap 由 2^B 个桶（bucket）组成。每个桶存放 8 个键值对，以及每个 key 哈希值的高 8 位（tophash，用于快速比较）。\n  - 一个桶放满后，通过溢出桶（overflow）组成链表。\n  - 负载因子超过 6.5，或者溢出桶过多时触发扩容：翻倍扩容，或者等量扩容（整理溢出桶）。扩容是渐进式的，在每次写入或删除时搬迁一部分桶，避免一次性搬迁带来的停顿。\n- Go 1.24 及以后：改为基于 Swiss Table 的实现（用分组和控制字节，借助 SIMD 指令快速查找），查找和插入的性能更好，内存利用率更高。\n- 遍历无序：\n  - 扩容和元素搬迁会导致元素的顺序变化。\n  - 运行时故意在每次遍历时随机选择起始的桶和桶内的起始位置，防止开发者依赖遍历顺序。\n  - 需要有序时，把 key 取出来排序后再遍历。\n- 并发读写：map 不是并发安全的。运行时检测到并发读写会直接抛出 `fatal error: concurrent map read and map write`，这个错误无法被 recover，进程会直接崩溃。所以必须加锁，或者使用 sync.Map。\n- 其他：map 的元素不能取地址（扩容时元素的位置会变化）；删除元素不会缩小 map 的内存。"}, {"no": 29, "title": "【高频】interface 的底层结构（iface、eface）是什么？nil interface 和值为 nil 的 interface 有什么区别？", "section": "语言特性", "answer": "- eface（空接口 interface{}，即 any）：包含两个字段，`_type`（动态类型的信息）和 `data`（指向实际值的指针）。\n- iface（有方法的接口）：包含 `tab`（itab，包含接口类型、动态类型、方法表）和 `data`。调用接口方法时，通过 itab 中的方法表找到具体实现（动态派发），itab 会被缓存。\n- nil 的判断：只有类型和值都为 nil 时，接口才等于 nil。\n- 经典的坑：\n```go\nfunc get() error {\n    var p *MyErr = nil\n    return p // 返回的接口：类型为 *MyErr，值为 nil\n}\nerr := get(); err != nil // 结果为 true！\n```\n  - 接口中的类型信息不为空，所以接口不等于 nil。\n- 正确的做法：函数没有错误时，直接 `return nil`，不要返回一个值为 nil 的具体类型指针。\n- 判断接口中的值是否为 nil，需要用类型断言，或者用反射（reflect.ValueOf(x).IsNil()）。"}, {"no": 30, "title": "defer 的执行顺序和参数求值时机是什么？defer 修改返回值的规则是什么？", "section": "语言特性", "answer": "- 执行顺序：后进先出（LIFO），在函数返回之前执行（发生 panic 时也会执行）。\n- 参数的求值时机：执行到 defer 语句时，就立即对它的参数求值，而不是等到真正执行时：\n  - `defer fmt.Println(i)` 打印的是执行 defer 语句那一刻 i 的值。\n  - `defer func() { fmt.Println(i) }()` 闭包引用的是变量本身，打印的是函数返回时 i 的值。\n- 修改返回值：\n  - return 语句的执行过程是：先给返回值赋值，然后执行 defer，最后真正返回。\n  - 命名返回值：defer 中修改命名返回值，会影响最终的返回结果（常用于在 defer 中把 recover 到的 panic 转换为 error 返回）。\n  - 匿名返回值：return 时，返回值已经被复制到了一个临时变量中，defer 中修改局部变量不影响返回的结果。\n- 性能：Go 1.14 之后使用开放编码（open-coded defer），开销接近于直接调用；但在循环中使用 defer，要等函数结束时才统一执行（例如资源要等到循环全部结束才释放），应该把循环体封装成一个函数。"}, {"no": 31, "title": "【高频】panic 和 recover 怎么用？goroutine 中的 panic 能被主 goroutine recover 吗？", "section": "语言特性", "answer": "- panic：发生不可恢复的错误时调用（或者由运行时触发，如空指针、数组越界）。当前函数停止执行，逐层执行 defer，一直向上传播。如果没有被 recover，程序崩溃并打印调用栈。\n- recover：只能在 defer 函数中直接调用才有效，用来捕获 panic，让程序继续执行。recover 返回 panic 传入的值；没有 panic 时返回 nil。\n- 不能跨 goroutine：recover 只能捕获当前 goroutine 中的 panic。子 goroutine 中的 panic 无法被主 goroutine（或任何其他 goroutine）recover，没有被处理的话会导致整个进程崩溃。所以每一个 goroutine 都要在内部自己加 defer recover（可以封装一个 SafeGo 函数统一处理）。\n- 无法被 recover 的情况：并发读写 map 引发的 fatal error、栈溢出、内存耗尽、调用了 os.Exit。\n- 使用原则：\n  - 业务错误使用 error 返回，panic 只用于程序的 bug 和无法继续运行的情况。\n  - 在框架的边界（HTTP 中间件、RPC 拦截器、goroutine 的入口）统一做 recover：记录日志和调用栈、上报告警、返回 500。"}, {"no": 32, "title": "值接收者和指针接收者有什么区别？", "section": "语言特性", "answer": "- 值接收者：方法内部操作的是接收者的副本，修改不会影响原来的对象；每次调用都要复制整个对象（大结构体的开销大）。\n- 指针接收者：可以修改原来的对象；不需要复制。\n- 方法集和接口实现：\n  - 类型 T 的方法集只包含值接收者的方法。\n  - 类型 *T 的方法集包含值接收者和指针接收者的全部方法。\n  - 所以，如果实现接口的方法使用的是指针接收者，只有 *T 实现了这个接口，T 没有实现（把值 T 赋给这个接口类型会编译报错）。\n  - 直接调用方法时，Go 会自动取地址或解引用（前提是值可以取地址）。\n- 选择：\n  - 需要修改接收者、结构体比较大、包含不能复制的字段（如 sync.Mutex）时，使用指针接收者。\n  - 小的、不可变的值类型（如 time.Time），使用值接收者。\n  - 同一个类型的所有方法，接收者类型应该保持一致。"}, {"no": 33, "title": "字符串和 []byte 转换有什么开销？", "section": "语言特性", "answer": "- string 是不可变的（结构为指针加长度），[]byte 是可变的。两者之间的转换通常要分配新的内存并复制数据（O(n)），以保证 string 不可变的语义。\n- 编译器会在一些场景下优化，避免复制：\n  - 用作 map 的 key 查询：`m[string(b)]`。\n  - 比较操作和字符串拼接中的临时转换。\n  - `for range []byte(s)`。\n- 零拷贝的转换（不安全，要谨慎使用）：Go 1.20 及以后可以用 `unsafe.String(&b[0], len(b))` 和 `unsafe.Slice(unsafe.StringData(s), len(s))`。前提是转换之后不能再修改这个 []byte，否则就破坏了 string 不可变的保证，可能产生难以排查的 bug。\n- 优化：\n  - 在热点路径上减少反复的来回转换。\n  - 拼接字符串时使用 strings.Builder（它内部用 unsafe 转换，避免最后一次复制）或 bytes.Buffer，而不是在循环中使用 `+=`。\n  - 需要处理字节数据的接口，直接使用 []byte 版本（如 bytes 包的函数）。"}, {"no": 34, "title": "泛型在 Go 中怎么用？有什么限制？", "section": "语言特性", "answer": "- 用法（Go 1.18 起）：\n  - 类型参数：`func Map[T, U any](s []T, f func(T) U) []U`。\n  - 约束（constraint）：用接口定义，可以包含类型集合，如 `type Number interface { ~int | ~int64 | ~float64 }`。`~int` 表示底层类型是 int 的所有类型。\n  - 内置约束：any、comparable；golang.org/x/exp/constraints 和标准库的 cmp.Ordered（Go 1.21 起）。\n  - 泛型类型：`type Stack[T any] struct { items []T }`。\n  - 标准库中的 slices、maps 包（Go 1.21 起）大量使用了泛型。\n- 限制：\n  - 方法不能有自己的类型参数（只能使用所在类型的类型参数）。\n  - 不能对类型参数直接做类型断言或 type switch（需要先转换为 any）。\n  - 不支持特化，也不支持元编程。\n  - 泛型函数不能直接作为值传递，必须先实例化。\n- 性能：编译器使用 GC Shape Stenciling 方案（底层形状相同的类型共享一份代码，再加上一个字典传递类型信息）。调用约束接口上的方法时可能有间接调用的开销，在极端的热点路径上不一定比手写具体类型的代码更快。\n- 适用：容器、通用算法（Map、Filter、Max）、类型安全的工具函数。不要为了使用泛型而过度抽象。"}, {"no": 35, "title": "结构体内存对齐是什么？怎么减少内存占用？", "section": "语言特性", "answer": "- 对齐：CPU 按字长访问内存，字段的地址必须是其对齐值的整数倍（如 int64 要对齐到 8 字节，int32 要对齐到 4 字节）。编译器会在字段之间插入填充字节，结构体的总大小也要是其中最大对齐值的整数倍。\n- 示例：\n```go\ntype A struct { a bool; b int64; c bool }  // 1 + 7(填充) + 8 + 1 + 7(填充) = 24 字节\ntype B struct { b int64; a bool; c bool }  // 8 + 1 + 1 + 6(填充) = 16 字节\n```\n- 优化：\n  - 字段按大小从大到小排列，减少填充。\n  - 可以用 fieldalignment 工具（golang.org/x/tools）自动检查。\n  - 用 unsafe.Sizeof 和 unsafe.Alignof 查看大小和对齐值。\n- 意义：结构体被大量创建时（如几百万个对象、大切片），节省的内存很可观，还能提高 CPU 缓存的命中率。\n- 并发场景中的伪共享：多个 CPU 核频繁写入同一条缓存行（通常是 64 字节）上的不同变量时，会互相导致对方的缓存失效。可以在变量之间填充到缓存行的大小来隔离（runtime 内部有这样的做法）。\n- 注意：调整字段顺序会影响代码的可读性，只在热点结构上做。"}, {"no": 36, "title": "【高频】Go 中的错误处理有哪些最佳实践？errors.Is、errors.As、%w 怎么用？", "section": "语言特性", "answer": "- 包装错误：`fmt.Errorf(\"query user %d: %w\", id, err)`，用 %w 包装原始错误，同时附加上下文信息，形成错误链。Go 1.20 起支持多个 %w，以及 errors.Join。\n- errors.Is(err, target)：沿着错误链逐层比较，判断是否等于某个哨兵错误（如 `sql.ErrNoRows`、`context.DeadlineExceeded`）。不要用 `==` 直接比较被包装过的错误。\n- errors.As(err, &target)：沿着错误链查找某个具体类型的错误，并赋值给 target，用于获取错误中携带的字段（如自定义的 BizError 中的错误码）。\n- 最佳实践：\n  - 错误只处理一次：要么记录日志，要么返回给上层，不要在每一层都记录日志（会导致日志重复）。\n  - 在边界处转换：DAO 层返回原始的错误，service 层包装上业务的上下文，controller 层转换为错误码和用户能看懂的提示。\n  - 定义有意义的哨兵错误和错误类型；对外暴露的错误要稳定。\n  - 不要忽略错误（如 `_ = f()`），确实可以忽略时写注释说明原因。\n  - 不要把 panic 当作错误处理的手段。\n  - 错误信息使用小写、不以标点结尾，便于拼接。"}, {"no": 37, "title": "【高频】Gin 的中间件机制是怎么实现的？", "section": "工程实践", "answer": "- 核心：每个路由对应一个处理函数链（HandlersChain，类型是 []HandlerFunc），包括全局中间件、路由组的中间件，以及最终的业务处理函数，按注册的顺序依次排列。\n- 执行：\n  - gin.Context 中维护了一个下标 index。\n  - 调用 `c.Next()` 时，index 加一，并依次执行后续的处理函数。\n  - 中间件中，写在 Next 之前的代码在请求阶段执行，写在 Next 之后的代码在响应阶段执行（洋葱模型），可以用来统计耗时、统一处理返回结果。\n- 中断：调用 `c.Abort()` 把 index 设置为一个很大的值（abortIndex），后面的处理函数就不会再执行（例如鉴权失败时）。Abort 不会中止当前函数，需要自己 return。\n- 路由：基于基数树（radix tree）的路由匹配，速度快；每种 HTTP 方法有一棵树。\n- Context 复用：gin.Context 通过 sync.Pool 复用，所以不能在请求结束后继续使用它，也不能在 goroutine 中直接使用（要先调用 c.Copy()）。\n- 常见的中间件：Recovery（recover panic）、Logger、鉴权、限流、trace 注入、CORS、超时控制。"}, {"no": 38, "title": "Go 的 HTTP Server 是怎么处理并发请求的？", "section": "工程实践", "answer": "- `http.Server.Serve` 循环调用 `Accept` 接受新的连接，为每个连接启动一个 goroutine（conn.serve）。\n- 在这个 goroutine 中循环读取请求（HTTP/1.1 的 keep-alive 连接上可以处理多个请求，但这些请求是按顺序处理的），对每个请求调用 Handler 的 ServeHTTP 方法。\n- HTTP/2：一条连接上的多个流会并发处理，每个流都有自己的 goroutine。\n- 底层：连接的读写借助 netpoller（epoll），goroutine 等待网络数据时会被挂起，不占用操作系统线程。所以\"每个连接一个 goroutine\"的模型可以支撑大量的并发连接。\n- 必须配置超时：ReadTimeout、ReadHeaderTimeout（防止 Slowloris 慢速攻击）、WriteTimeout（注意：流式接口 SSE 要单独处理，否则连接会被提前断开）、IdleTimeout。\n- 用 MaxHeaderBytes 限制请求头的大小。\n- Handler 中的 panic 会被 net/http 自动 recover（只影响这一个请求），但最好还是在中间件中自己处理。"}, {"no": 39, "title": "【高频】http.Client 为什么要复用？连接池参数怎么配？", "section": "工程实践", "answer": "- 为什么要复用：\n  - http.Client（准确地说是它的 Transport）内部维护了连接池，可以复用 TCP 连接和 TLS 连接，避免每次请求都要重新做三次握手和 TLS 握手。\n  - 如果每次请求都新建一个 Client 或 Transport，连接无法复用，会产生大量 TIME_WAIT 状态的连接，端口可能被耗尽，延迟也会增加。\n  - Client 是并发安全的，应该全局复用一个（或者按下游服务分别复用）。\n- 关键参数（http.Transport）：\n  - MaxIdleConns：所有主机的空闲连接总数（默认 100）。\n  - MaxIdleConnsPerHost：每个主机的最大空闲连接数，默认只有 2。在高并发地调用同一个下游时，必须调大（如 50 到 100），否则连接用完就关闭，频繁新建。\n  - MaxConnsPerHost：每个主机的最大连接数（默认不限制），可以用来保护下游。\n  - IdleConnTimeout：空闲连接的超时时间，要小于下游或负载均衡设置的空闲超时。\n  - DialContext 的超时、TLSHandshakeTimeout、ResponseHeaderTimeout。\n- 超时：设置 Client.Timeout（整个请求的总超时，对流式请求要谨慎，因为它会限制读取整个响应体的时间），或者用 ctx 控制每个请求的超时。\n- 必须读完并关闭 resp.Body：`defer resp.Body.Close()`，并把响应体读完（io.Copy(io.Discard, resp.Body)），连接才能被放回连接池复用。"}, {"no": 40, "title": "【高频】Go 服务怎么优雅退出？", "section": "工程实践", "answer": "```go\nsrv := &http.Server{Addr: \":8080\", Handler: h}\ngo func() {\n    if err := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed { log.Fatal(err) }\n}()\nctx, stop := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)\ndefer stop()\n<-ctx.Done()                                   // 等待退出信号\nmarkUnready()                                  // 先从注册中心或负载均衡摘除，等待几秒生效\nshutdownCtx, cancel := context.WithTimeout(context.Background(), 30*time.Second)\ndefer cancel()\n_ = srv.Shutdown(shutdownCtx)                  // 停止接收新请求，等待处理中的请求完成\nstopWorkers(shutdownCtx)                       // 停止后台任务：不再拉取新任务，处理完当前的任务\ncloseResources()                               // 关闭 DB、MQ、Redis 连接，刷新日志\n```\n- 要点：\n  - Shutdown 会关闭监听，并等待活跃的连接处理完；超时后返回错误，可以再调用 Close 强制关闭。\n  - Shutdown 不会等待被劫持的连接（如 WebSocket），需要自己处理（用 RegisterOnShutdown 通知这些连接）。\n  - 在 k8s 中：terminationGracePeriodSeconds 要大于退出流程所需的时间；可以配置 preStop 钩子，先等待几秒，让流量被摘除。\n  - 后台的 goroutine 要统一通过 ctx 或 WaitGroup 管理，保证能够退出。"}, {"no": 41, "title": "单元测试怎么写？表驱动测试、mock、gomonkey 怎么用？", "section": "工程实践", "answer": "- 基本写法：在 `xxx_test.go` 文件中写 `func TestXxx(t *testing.T)`；用 `go test ./... -cover` 运行并查看覆盖率；断言可以使用 testify（assert 和 require）。\n- 表驱动测试：用一个切片定义多组输入和期望的输出，循环调用 `t.Run(name, ...)` 执行每个子测试。用例清晰、方便扩展，是 Go 社区的惯用写法：\n```go\ntests := []struct{ name string; in int; want int }{{\"zero\", 0, 0}, {\"pos\", 2, 4}}\nfor _, tt := range tests {\n    t.Run(tt.name, func(t *testing.T) { assert.Equal(t, tt.want, Double(tt.in)) })\n}\n```\n- mock：\n  - 依赖接口（依赖倒置）：在被测代码中依赖接口，测试时注入假的实现。可以用 gomock（mockgen 生成代码）或 testify/mock。\n  - 数据库：可以用 sqlmock，或者使用真实的测试数据库（testcontainers）。\n  - HTTP：用 httptest.NewServer 启动一个模拟的下游服务。\n  - Redis：可以使用 miniredis。\n- gomonkey：在运行时直接替换函数或方法的实现（修改机器码），可以对没有使用接口的代码打桩（如全局函数、time.Now）。缺点是需要关闭内联（`-gcflags=all=-l`），不是并发安全的，对不同架构的支持有限制。适合改造老代码时临时使用；新代码应该优先通过接口加依赖注入，提高可测试性。\n- 其他：benchmark（`-benchmem`）、fuzz 测试（Go 1.18 起）、用 `-race` 检测并发问题。"}, {"no": 42, "title": "go mod 的依赖管理机制是什么？replace、indirect 是什么？", "section": "工程实践", "answer": "- go.mod：声明模块路径、Go 版本、依赖（require）。go.sum 记录每个依赖的哈希值，用于校验下载的依赖是否被篡改。\n- 版本选择：使用 MVS（最小版本选择）算法。对于每个依赖，选择所有 require 声明中要求的最高版本中的最低满足版本，而不是自动选择最新的版本，所以构建结果是可以复现的。\n- 语义化版本：v2 及以上的主版本，模块路径要加上 /v2 后缀（这种做法叫语义导入版本）。\n- indirect：标记为 `// indirect` 的依赖，是当前模块没有直接 import，但由其他依赖间接需要的（或者依赖的 go.mod 中没有声明完整），`go mod tidy` 会自动维护这些标记。\n- replace：把某个依赖替换为另一个路径或版本，例如本地调试时指向本地目录（`replace x => ../x`）、使用 fork 后的版本、修复安全漏洞。replace 只在主模块中生效（被其他模块依赖时会被忽略）。\n- 其他：exclude（排除某个版本）；GOPROXY（代理加速，内网使用私有代理）；GOPRIVATE（私有仓库不经过公共代理和校验）；go work（多模块的工作区，本地联调时使用）；Go 1.24 新增 tool 指令，用来管理工具依赖。"}, {"no": 43, "title": "【专家】大型 Go 项目的目录结构和分层（controller、service、dao）怎么设计？", "section": "工程实践", "answer": "- 常见的目录结构（参考 golang-standards/project-layout，按团队的规范调整）：\n  - `cmd/`：各个可执行程序的入口（main 函数，只负责组装和启动）。\n  - `internal/`（或 `pkg/`）：业务代码，internal 下的包不能被外部模块导入。\n  - `conf/`：配置文件；`api/`：接口定义（proto、OpenAPI）；`scripts/`、`deploy/`：脚本和部署配置。\n- 分层：\n  - controller 或 handler：解析和校验参数、鉴权、调用 service、把结果转换为响应和错误码。不包含业务逻辑。\n  - service：业务逻辑和流程编排，事务边界一般放在这一层。\n  - dao 或 repository：数据访问（MySQL、Redis、下游接口的客户端），对上层屏蔽存储的细节。\n  - model 或 entity：数据结构；DTO（接口的入参和出参）和数据库模型分开定义。\n- 原则：\n  - 依赖单向：上层依赖下层，下层不能反向依赖上层。\n  - 面向接口：service 依赖 dao 的接口，便于 mock 测试和替换实现。\n  - 依赖注入：在 main 中组装（可以用 wire）；避免使用全局变量。\n  - 按业务领域分包（如 figure/、delivery/、qc/），不要只按技术分层（所有的 service 放在一个包中），以控制单个包的大小。\n  - 横切的关注点（日志、trace、配置、错误码）放在公共包中，通过中间件统一处理。\n- 可举例：ai-agent-cserver 按领域分包，如 service/figure（qc_review.go、list.go）、dao 层的常量枚举、controllers/mount.go、conf/servicer。"}, {"no": 44, "title": "指针类型字段在请求结构体中有什么用（区分\"不传\"和\"传零值\"）？", "section": "工程实践", "answer": "- 问题：在 Go 中，没有传的字段在反序列化后是零值（0、\"\"、false），无法区分\"调用方没有传这个字段\"和\"调用方明确传了 0 或空字符串\"。\n- 解决：把字段定义为指针类型（`Status *int`）。\n  - nil：表示没有传，不作为过滤条件，或者在更新时不修改这个字段。\n  - 非 nil：表示传了，哪怕值是 0，也按这个值处理。\n- 典型场景：\n  - 列表的筛选条件：状态为 0 也是一个有意义的筛选值。\n  - 部分更新（PATCH）：只修改传入的字段，没有传的字段保持不变。\n  - 布尔开关：false 和\"不修改\"要能区分开。\n- 代价：使用前要判断是否为 nil；代码更啰嗦（可以封装辅助函数）。也可以使用自定义的 Optional 类型，或者 sql.Null* 系列类型。\n- 可举例：质检明细接口 `/dh/qc_record/list` 的筛选字段都使用指针类型，\"不传\"表示不过滤，\"传 0\"表示按 0 过滤，多个条件之间是 AND 关系。"}, {"no": 45, "title": "【专家】Go 和 Python 在 Agent 服务开发中分别适合哪些部分？", "section": "工程实践", "answer": "- Go 适合：\n  - 高并发的在线服务：网关、对话服务的主链路、挂载服务、流式（SSE、WebSocket）接入、长连接。\n  - 对性能和稳定性要求高的部分：低延迟、内存占用小、部署方便（单个二进制文件）。\n  - 平台型的后端：配置管理、任务调度、质检和评估平台的 server、计费、对客的 PaaS 接口。\n  - 原因：goroutine 天然适合大量的 IO 并发（同时调用模型、检索、工具）；静态类型便于大型团队协作和维护。\n- Python 适合：\n  - 模型和算法相关的工作：推理服务（vLLM、Transformers）、微调和训练、embedding、rerank、数据处理。\n  - 快速验证原型和策略：LangChain、LangGraph、LlamaIndex 等 Agent 框架；评估脚本、Prompt 实验。\n  - AIGC 工具链：TTS、视频生成、各种模型 SDK 的对接（生态最丰富）。\n- 常见的组合：\n  - Go 负责在线的编排和平台服务，Python 负责模型服务和算法，两者之间通过 HTTP 或 gRPC 通信。\n  - 策略先用 Python 验证，稳定后再用 Go 在线上实现主链路。\n- 可举例：Go 实现的 ai-agent-cserver、agent-mount、Pipeline 平台的 server；Python 实现的 Flask TTS 和视频工具服务、IndexTTS-2 的私有化部署、统计脚本。"}]}, {"title": "15 场景设计与综合", "questions": [{"no": 1, "title": "【高频】设计一个支持千万日活的智能客服 Agent 系统。", "section": "Agent 场景设计", "answer": "- 需求和量级：千万日活，人均 3 次对话，每天约 3000 万次对话；峰值 QPS 按平均值的 5 到 10 倍估算，大约是几千。目标是首 token 延迟 1 秒以内、问题自助解决率高、能够转人工、成本可控。\n- 架构：\n  - 接入层：多渠道（App、Web、小程序、电话），网关负责鉴权、限流，SSE 流式输出。\n  - 对话服务（无状态，可以水平扩展）：会话管理、意图路由。\n  - 处理链路：FAQ 精确匹配 → RAG 知识库问答 → 任务型流程（查订单、退款，通过工具调用业务系统）→ 转人工。\n  - 支撑：模型网关（多模型、降级）、知识库平台、工单和人工坐席系统、评估平台。\n- 关键难点和方案：\n  - 成本：大部分高频问题用 FAQ 和缓存解决，路由和改写用小模型，只有复杂问题才使用大模型；用好 Prompt 缓存。\n  - 准确性：业务数据一律通过工具实时查询；回答带引用；低置信度时追问或转人工。\n  - 业务办理的安全：涉及操作的工具使用用户的身份和权限；高风险操作需要确认；幂等。\n  - 多轮对话：会话状态存储在外部（Redis），槽位填充的状态结构化保存。\n  - 稳定性：模型故障时降级为 FAQ 加转人工；限流排队；有完整的降级预案。\n- 运营闭环：满意度和转人工率的监控，badcase 收集，知识库缺口分析，AB 实验。"}, {"no": 2, "title": "【高频】设计一个企业内部知识问答助手（支持权限、引用、更新）。", "section": "Agent 场景设计", "answer": "- 需求：接入 Wiki、文档、工单等多种数据源；回答准确并且带出处；员工只能看到自己有权限的内容；文档更新后能及时生效。\n- 架构：\n  - 数据接入：各数据源的连接器，按事件驱动增量同步，同时定期全量校对；同步文档的权限信息（ACL）。\n  - 处理流水线：解析（不同格式分别处理，包括 OCR 和表格）→ 结构化切分（父子 chunk，附带标题路径）→ embedding → 写入向量库和全文索引，每个 chunk 带上权限元数据和版本号。\n  - 问答链路：query 改写 → 混合检索（服务端根据员工身份强制注入权限过滤条件）→ rerank → 生成答案并标注引用 → 校验引用。\n- 难点和方案：\n  - 权限：在检索阶段就按权限前过滤，不能依赖 Prompt；权限变化时及时同步。\n  - 引用的真实性：chunk 编号和原文链接一一对应，可以跳转定位到原文段落；做引用校验。\n  - 更新：基于内容哈希做增量更新；删除的文档同步删除对应的 chunk；查询时只检索最新版本。\n  - 效果：建立评测集，按环节排查 badcase（召回、排序、生成），持续优化。\n- 可扩展：Agentic RAG（多轮检索、跨数据源）、结构化数据查询（Text2SQL）、对话中直接创建工单。"}, {"no": 3, "title": "【专家】设计一个 Coding Agent，能读代码库、改代码、跑测试。", "section": "Agent 场景设计", "answer": "- 核心循环：基于工具的 ReAct 循环，由模型自主决定读取哪些文件、修改哪里、怎么验证。\n- 工具设计（粒度小、可以组合、描述详细）：\n  - 搜索：glob 按文件名查找、grep 按内容查找、符号或语义检索。\n  - 读取文件：支持按行范围读取。\n  - 编辑：精确的字符串替换，要求原文唯一匹配，避免误改。\n  - 执行命令：编译、测试、lint。\n  - 版本控制：查看 git diff、状态。\n- 上下文管理：\n  - 不一次性加载整个代码库，按需检索读取。\n  - 用项目说明文件提供约定（构建方式、目录结构、代码规范）。\n  - 长任务自动压缩上下文；用待办列表维持目标。\n  - 调研类的子任务交给子 Agent，只回传结论。\n- 验证闭环：修改代码后运行测试或编译，失败就把报错信息返回给模型继续修改；设置最大轮数。\n- 安全：\n  - 在沙箱或容器中执行命令。\n  - 危险命令（删除、强制推送、修改权限）需要用户确认。\n  - 网络访问受限，密钥隔离。\n  - 所有修改可以回滚（基于 git）。\n- 评估：用 SWE-bench 风格的评测集（真实的问题加上隐藏的测试），统计通过率、步数、成本。\n- 可引用：用 LangGraph 实现 Claude Code 核心设计的调研。"}, {"no": 4, "title": "设计一个能自动写周报的 Agent（数据来源：代码提交、文档、日程）。", "section": "Agent 场景设计", "answer": "- 数据采集（通过工具或 MCP 接入）：\n  - 代码平台：本周的 commit、CR、合入记录、代码变更行数。\n  - 文档平台：新建和编辑过的文档（如知识库中的迭代文档）。\n  - 项目管理：卡片的状态变化（完成了哪些需求和 bug）。\n  - 日程：参加的评审和会议。\n- 处理流程：\n  1. 按时间范围拉取数据，去重。\n  2. 按项目或需求聚类（用卡片号、仓库、文档目录关联）。\n  3. 让模型针对每个项目总结出\"做了什么、进度、结果\"。\n  4. 按周报模板生成（本周完成、进行中、下周计划、风险）。\n- 要点：\n  - 只写有数据依据的内容，不编造进展；指标和链接直接引用原始数据。\n  - 生成后由用户确认和修改再发布，不自动发送。\n  - 权限：只读取本人有权限的数据。\n- 扩展：每周定时触发，生成草稿后通知用户；用历史周报学习用户的写作风格。\n- 可引用：这次整理迭代目录生成工作总结，就是同样的思路。"}, {"no": 5, "title": "【专家】设计一个 Deep Research Agent，输出带引用的研究报告。", "section": "Agent 场景设计", "answer": "- 流程：\n  1. 需求澄清：确认研究的范围、深度、读者、输出格式。\n  2. 规划：生成研究大纲，拆分成若干子问题。\n  3. 并行调研：多个子 Agent 分别负责子问题，循环执行\"搜索 → 筛选 → 阅读 → 提取要点 → 发现新的问题\"。\n  4. 汇总：交叉验证信息，处理不同来源之间的冲突。\n  5. 撰写：按大纲写报告，每个结论都附上引用。\n  6. 质检：检查引用的真实性、内容的覆盖度、是否有矛盾。\n- 关键设计：\n  - 预算控制：总的搜索次数、token 数和时间上限；每个子问题判断\"信息是否足够\"，足够就停止，连续几轮没有新信息也停止。\n  - 去重：query 语义去重、URL 归一化、内容去重。\n  - 笔记机制：每个来源先提炼成结构化的笔记（结论、原文摘录、链接），最终报告基于笔记撰写，避免把所有原文都塞进上下文。\n  - 引用：引用编号和来源列表对应；抽样校验引用的内容是否真的支持结论。\n  - 来源质量：优先选择权威来源，标注信息的时效性。\n- 工程：作为异步长任务运行（几分钟到几十分钟），推送进度，支持断点续跑，结果可以导出。\n- 评估：报告的质量（人工或 LLM 按维度打分）、引用的准确率、成本和耗时。"}, {"no": 6, "title": "设计一个电商导购 Agent，能推荐商品并挂载商品卡片。", "section": "Agent 场景设计", "answer": "- 能力：理解购物需求（预算、用途、偏好）、追问澄清、检索和推荐商品、比较商品、在对话中挂载商品卡片（价格、图片、购买链接）、引导下单。\n- 架构：\n  - 意图和槽位：品类、预算、品牌偏好、场景，多轮对话中逐步收集。\n  - 商品检索工具：结构化过滤（品类、价格区间、库存）加语义检索（描述、评价），再结合推荐模型排序。\n  - 模型：根据检索到的结果组织推荐理由和比较，不编造参数和价格（价格和库存实时查询）。\n  - 挂载服务：根据推荐出的商品 ID 生成商品卡片的 ui_data，以组件事件的形式流式插入到回复中。\n- 关键点：\n  - 商业化的平衡：相关性优先，不能为了商业化强行推荐。\n  - 卡片的频率控制，避免每轮都出现。\n  - 归因：卡片的曝光、点击、转化，都要带上 session_id、message_id、商品 ID，用于计算效果。\n  - 实时性：价格和库存以接口返回为准，缓存的时间要短。\n- 可引用：智能体挂载商品卡、问一问商品卡（component_id=4）、agent-mount 的商品自动挂载等组件。"}, {"no": 7, "title": "【高频】设计一个实时语音交互的数字人 Agent，端到端延迟控制在 1 秒内。", "section": "Agent 场景设计", "answer": "- 链路：客户端采集音频 → RTC 或 WebSocket 上行 → VAD 和流式 ASR → 对话 Agent（大模型）→ 流式 TTS → 数字人驱动（口型、表情、动作）→ 渲染（云端渲染推流，或者在端上渲染）→ 播放。\n- 延迟预算（目标是用户说完话后约 1 秒内开始响应）：\n  - 端点检测：一两百到几百毫秒。\n  - ASR 最终结果：一两百毫秒。\n  - LLM 生成首句：两三百到几百毫秒。\n  - TTS 首包：一两百毫秒。\n  - 驱动渲染和网络传输：一两百毫秒。\n- 关键手段：\n  - 全链路流式，各环节重叠执行：ASR 的中间结果稳定时就提前启动 LLM 推理；LLM 输出首个短句后立即开始 TTS；TTS 的首包一出来就开始驱动和播放。\n  - 模型侧：精简 Prompt，命中前缀缓存，选择低延迟的模型，减少前置的串行步骤（检索可以并行或者省略）。\n  - 打断：VAD 检测到用户开始说话时，立即停止播放和生成，只把已经播放的内容写入对话历史。\n  - 部署：服务就近部署，连接预热，数字人实例提前预热好资源池。\n- 监控：分段统计各环节的耗时（P50、P99），定位瓶颈。\n- 可引用：实时互动数字人平台、agent-proxy 互动超低延迟的调研、数字人首 token 慢的排查（修复了消息序列错误）。"}, {"no": 8, "title": "【专家】设计一个支持上万个第三方开发者的智能体开放平台。", "section": "Agent 场景设计", "answer": "- 开发者侧：\n  - 智能体创建：人设、开场白、知识库、插件和工作流、模型选择、商业化组件。\n  - 预览调试、发布审核、版本管理、数据分析看板。\n  - API 或 SDK 接入（AK/SK 鉴权、配额）。\n- 运行时：\n  - 无状态的通用执行引擎，按 app_id 加载配置（多级缓存，配置变更时主动失效）。\n  - 插件和工具网关：第三方接口的限流、超时、熔断、域名白名单。\n  - 知识库服务：多租户隔离。\n- 分发：搜索、广场、推荐、\"最近使用\"。分发前要校验智能体的状态（已下线、私有的不能分发）。\n- 治理：\n  - 内容安全：智能体配置审核、输入输出审核、违规时下线。\n  - 多租户：配额、隔离、按开发者计费。\n  - 质量：成功率、满意度的监控，低质量的智能体降低权重。\n- 数据：对话打点（配置维度和运行时维度），提供给开发者和运营使用；对话数据要有生命周期管理（冷备、删除）。\n- 难点：配置同步到下游系统时的一致性（如千帆 Assistant 不存在时的自愈）；大量长尾智能体的冷启动和缓存；第三方插件的稳定性和安全。\n- 可引用：文心智能体平台相关的工作，如 240 个智能体跳转下线页的修复、数据捞取能力的升级、对话数据冷备。"}, {"no": 9, "title": "设计一个 Agent 评测平台，支持数据集管理、自动评测、人工质检。", "section": "Agent 场景设计", "answer": "- 数据集：上传（Excel 或文件，存到 BOS）、通过输入 query 构建、从线上日志抽样、版本管理、分类标签。\n- 评测任务：选择数据集和被测对象（Agent 版本、Prompt、模型、形象包），创建异步任务。由 Worker 轮询执行：防止重复处理、单条失败自动重试、记录重试信息、统计失败数。\n- 评估方式：\n  - 规则评估：格式、关键词、工具调用是否正确。\n  - LLM-as-a-Judge：按维度打分并给出理由，交换顺序以消除位置偏差。\n  - 人工质检：轮询或交叉分配任务、多维度打分表单、分档合并分数、管理员抽检并覆盖分数。\n  - 机器质检回调。\n- 结果：按指标和维度汇总，版本之间对比，查看 badcase 明细，导出；达标后标记为可交付或可上线。\n- 权限：外部质检员（众测）、PM、超级管理员，各自能看到和操作的内容不同。\n- 通知：任务完成或失败时发送群通知。\n- 可引用：端到端视频评估平台（Pipeline 二期），包括 4 张表、17 个指标、6 个维度、交叉质检、管理员抽检和 VideoProduceWorker。"}, {"no": 10, "title": "设计一个数据分析 Agent（自然语言查数据库、出图表）。", "section": "Agent 场景设计", "answer": "- 流程：\n  1. 理解问题（指标、维度、时间范围、过滤条件）。\n  2. 选择数据源：优先使用语义层或指标层，其次才是直接查表。\n  3. 生成 SQL：基于裁剪后的 schema 和相似问题的示例。\n  4. 校验并执行：只读账号，只允许 SELECT，强制加 LIMIT，设置超时。\n  5. 检查结果是否合理。\n  6. 生成结论和图表：模型生成图表配置（如 ECharts 的 JSON），或者在沙箱中执行 Python 代码画图。\n  7. 回答中给出使用的口径和 SQL，方便用户核对。\n- 关键点：\n  - 口径一致：常用的指标（如 DAU、转化率）由语义层预先定义好，模型只负责选择指标和维度，避免每次都现场写复杂的口径。\n  - 权限：行级和列级的权限控制，敏感字段脱敏。\n  - 准确性：执行出错时自动修正；结果为空或异常时追问用户；用评测集统计 SQL 的准确率。\n  - 性能：大表查询要走数仓（如 Spark 或 Doris），异步执行，缓存结果。\n- 可引用：为运营提供的自助捞数 SQL 模板（基于数仓的宽表和 get_json_object），可以作为 Agent 的示例库。"}, {"no": 11, "title": "【专家】设计一个 Agent 任务调度平台，支持长任务、断点续跑、人工审批。", "section": "Agent 场景设计", "answer": "- 数据模型：\n  - 任务表：类型、参数、状态、当前步骤、优先级、所有者。\n  - 步骤和检查点表：每一步的输入、输出、状态、重试次数、外部任务 ID。\n  - 审批表：待审批的操作、审批人、审批结果。\n  - 事件和日志表。\n- 执行：\n  - 调度器按优先级和配额分发任务；Worker 抢占任务时用条件更新，防止重复执行。\n  - 每完成一步就持久化检查点（参考 LangGraph 的 checkpoint 机制）。\n  - 有副作用的步骤要幂等（使用幂等键）。\n- 断点续跑：Worker 崩溃或任务超时后，其他 Worker 从最近的检查点继续执行；外部的异步步骤通过任务 ID 查询状态，而不是重新提交。\n- 人工审批：执行到需要审批的节点时，任务进入\"等待审批\"状态并通知审批人；审批通过后继续执行，驳回则终止或回退；设置审批的超时时间。\n- 状态推进：事件驱动（回调、审批结果），加上定时巡检兜底（reconcile），修复卡住的任务。\n- 可观测：任务的时间线、各步骤的耗时和成功率、积压量、告警。\n- 控制：取消、暂停、恢复、重试某一步、按租户设置配额和成本上限。"}, {"no": 12, "title": "设计一个多模态内容生产流水线（文案 → 配音 → 视频）。", "section": "Agent 场景设计", "answer": "- 流程（DAG）：\n  1. 文案生成（LLM）。\n  2. 人工或机器审核。\n  3. TTS 配音（选择音色、调整语速，支持克隆的声音）。\n  4. 视频生成（数字人口型驱动，或者文生视频、图生视频）。\n  5. 合成（音轨、字幕、背景）。\n  6. 质检。\n  7. 发布。\n- 架构：\n  - 工作流引擎：节点之间的依赖解析，上游完成后自动触发下游，审核通过后再进入下一步。\n  - 异步任务队列（如 Celery、MQ），把 GPU 密集型的节点调度到专门的资源池。\n  - 每个节点的产物存储到对象存储，只传递引用。\n- 关键点：\n  - 节点失败时自动重试，或者人工重试；支持批量任务（如单批 100 个任务）、并发轮询、在夜间低峰期执行。\n  - 素材的规范校验（格式、编码、码率、帧率、分辨率、时长）。\n  - 成本：GPU 资源池的排队和优先级。\n  - 合规：AIGC 水印，素材的授权。\n  - 结果通知（群消息）和回写（Excel 或数据库）。\n- 可引用：维护的 Flask 工作流服务（基于 Celery 的 DAG、PM 审核后自动触发下游、批量重试、如流通知），以及背景素材的上传校验规则。"}, {"no": 13, "title": "【高频】设计一个大模型 API 网关，支持多供应商、限流、计费、降级。", "section": "Agent 场景设计", "answer": "- 统一接入：\n  - 兼容 OpenAI 格式的统一 API，覆盖流式和非流式、工具调用、多模态。\n  - 调用方使用网关签发的密钥，供应商的密钥统一托管在网关，调用方接触不到。\n- 路由：\n  - 按模型别名或场景配置首选和备选模型。\n  - 按延迟、错误率、剩余配额、成本动态选择。\n  - 前缀感知路由，提高 KV Cache 的命中率。\n- 流量治理：\n  - 按调用方、模型、用户多个维度限流（QPS、TPM、并发）。\n  - 排队和优先级（在线请求优先于离线批量任务）。\n  - 超时；可重试的错误带退避重试。\n  - 熔断，并切换到备用供应商。\n  - 流式请求只能在开始输出前切换供应商。\n- 计费：从响应中统计输入、输出、缓存命中的 token，按单价计算费用；实时累计并检查配额，超出预算时告警或拒绝；明细异步落库，用于对账。\n- 缓存：支持供应商的 Prompt 缓存；精确缓存和语义缓存（可以选择开启）。\n- 安全：内容审核、日志脱敏、审计。\n- 可观测：每个模型的首 token 延迟、TPOT、错误率、成本大盘。"}, {"no": 14, "title": "设计一个对话数据的埋点、存储和分析系统。", "section": "Agent 场景设计", "answer": "- 埋点设计：\n  - 一条对话日志包含基础维度（时间、uid、app_id、session_id、logid、渠道、环境、Agent 模式）、内容（query、answer）、Agent 配置维度（是否挂载了知识库、插件）、运行时维度（触发了哪个知识库或工具、使用的模型、耗时、是否出错、多模态检索结果）。\n  - 扩展字段统一放在 JSON 字段中。\n- 采集和传输：服务端异步写日志，或者发送到 MQ，不阻塞主链路；保证不丢失（至少一次投递）。\n- 存储：\n  - 实时链路：发送到 Kafka，再由 Flink 写入 OLAP（如 Doris、ClickHouse），用于实时看板。\n  - 离线链路：进入数仓的宽表（按小时分区），用于深度分析。\n  - 原始对话的在线存储要和分析存储分开，并且做冷热分层。\n- 分析：\n  - 预置报表（Sugar 等 BI 工具）：调用量、满意度、工具触发率、调度命中率。\n  - 自助查询的 SQL 模板。\n  - badcase 抽样。\n- 治理：统一字段口径并维护文档；敏感信息脱敏；按数据保留期限清理。\n- 可引用：agent_content 打点字段的升级（is_dataset_set、rag_triggered_plugin 等）、数仓表 search_dwd_pv_and_chat_log_hf、多人调度的 Sugar 报表、对话历史导出。"}, {"no": 15, "title": "【专家】设计一个商业化归因系统：衡量一个 query 通过什么内容给哪个 Agent 带来了多少商业价值。", "section": "Agent 场景设计", "answer": "- 归因链路：搜索 query → 展示的内容（content_id）→ 进入的 Agent（app_id）→ 会话（session_id）→ 消息（message_id）→ 商业化组件的曝光和点击（线索表单、电话、报价）→ 转化（提交线索、后续成单）。\n- 关键是全链路的 ID 透传：\n  - 从入口处开始，每一跳都携带 searchWord、logid（lid）、content_id、session_id、message_id。\n  - 在挂载服务返回的组件数据（如 ui_data 的 chatInfo）中写入这些 ID，前端在用户点击或提交时原样带回。\n  - 线索数据入库时也带上这些 ID。\n- 难点：\n  - 通路多：q2a、q2c、Agent 房间页、快捷指令、电话加线索，每种通路的字段来源都不同（如只有 q2c 有 content_id），要逐一梳理调用点。\n  - 跨多个服务：需要按依赖顺序上线（被依赖方先上线），新字段都是可选的、向后兼容。\n  - 归因模型：可以先用末次触点归因，再逐步引入多触点归因；明确时间窗口（如 7 天内的转化都算）。\n- 数据层：曝光、点击、转化事件进入数仓，按 query、content、Agent 维度聚合出转化率和商业价值，形成\"生产-分发-商业化\"的数据飞轮，反哺内容的生产和分发。\n- 可引用：线索 RFQ 的 query 获取能力升级和飞轮数据链路打通，涉及 704、676、646、722、714 五个服务和五种通路，上线顺序为 704 → 676 → 722 → 646，并修复了 searchid 的取值问题。"}, {"no": 16, "title": "【高频】Agent 服务突然大量超时，你的排查步骤是什么？", "section": "线上问题处理", "answer": "- 止损：\n  - 先看影响面（全部请求还是部分 Agent、部分接口）。\n  - 如果刚有变更，立即回滚。\n  - 降级非核心环节（追问、挂载组件、检索），切换到备用模型，扩容、限流。\n- 定位：\n  - 时间线：超时开始的时间点和变更、流量、依赖告警是否吻合。\n  - trace：超时的请求卡在哪个环节。\n    - 模型：排队、限流（429）、供应商故障。\n    - 检索服务、工具调用、数据库和 Redis。\n    - 前置数据加载变慢。\n    - 服务自身：CPU、GC、协程数暴涨、连接池打满。\n  - 流量：是否有突发流量，是否有异常的大请求（超长上下文）。\n- 修复：针对根因处理（切换供应商、修复慢查询、扩大连接池、修复 bug），然后逐步恢复被降级的功能。\n- 复盘：时间线、根因、影响范围、改进措施（超时配置、熔断、监控告警、预案演练），并跟踪改进措施的落实。"}, {"no": 17, "title": "模型供应商故障，整个 Agent 不可用，怎么快速止损？", "section": "线上问题处理", "answer": "- 快速确认：模型网关的错误率和延迟监控、供应商的状态页、直接调用测试，确认是供应商的问题。\n- 止损措施（按事先准备好的预案执行）：\n  1. 切换到备用供应商或备用模型（通过配置开关，秒级生效）。\n  2. 如果没有同等能力的备用模型，降级到小模型或自建模型，回答质量可能下降，但服务可用。\n  3. 功能降级：只保留 FAQ 和缓存的答案；返回友好的提示和兜底文案；客服场景转人工。\n  4. 熔断，防止请求堆积拖垮整个服务。\n- 沟通：同步给相关方，必要时在产品中发布公告。\n- 恢复：供应商恢复后，逐步切回流量，观察指标。\n- 改进：多供应商的主备架构常态化；定期做切换演练；为不同模型维护对应的 Prompt，并且在评测集上验证过备用模型的效果。"}, {"no": 18, "title": "【高频】某个 Agent 被用户诱导输出了违规内容，怎么处理？", "section": "线上问题处理", "answer": "- 立即止损：\n  - 根据严重程度，下线这个 Agent，或者关闭相关的功能。\n  - 撤回或删除已经产生的违规内容（包括分享出去的内容）。\n  - 封禁恶意用户。\n- 定位：\n  - 通过日志和 trace 还原完整的对话：用户用了什么手法（越狱、角色扮演、编码绕过、多轮诱导）。\n  - 审核为什么没有拦截：输入审核、输出审核是否生效，流式输出时的审核策略是否有漏洞。\n- 修复：\n  - 把这次的攻击手法加入审核规则和模型的训练样本。\n  - 加固 Prompt 中的拒答策略。\n  - 对流式输出采用更严格的审核（边生成边审核）。\n  - 用类似的攻击用例做红队测试，验证修复效果。\n- 复盘和上报：按公司的安全事件流程上报和复盘。\n- 预防：把攻击用例纳入回归测试集；监控违规率；新上线的 Agent 先经过安全评测。"}, {"no": 19, "title": "线上数据库 CPU 打满，怎么快速定位和止损？", "section": "线上问题处理", "answer": "- 快速定位：\n  - `SHOW PROCESSLIST` 或 performance_schema：查看当前正在执行的 SQL，找出执行时间长、数量多的语句。\n  - 慢查询日志，以及 DBA 平台的 TOP SQL（按 CPU、扫描行数排序）。\n  - 和时间点对比：是否有新上线的功能、是否有批量任务（数据清理、导出、统计）、流量是否突增、是否有缓存失效导致大量请求回源到数据库。\n- 止损：\n  - KILL 掉异常的慢查询，暂停批量任务。\n  - 如果是新功能导致的，立即回滚，或者关闭对应的开关。\n  - 限流：在应用层对相关接口限流、降级，或者在数据库代理层做 SQL 限流。\n  - 缓存失效引起的：恢复缓存（预热），用 singleflight 防止并发回源。\n  - 临时扩容：增加只读实例，分担读流量。\n- 根因修复：\n  - 添加或修复索引（全表扫描、索引失效）。\n  - 改写 SQL（深分页、N+1 查询、大 IN 列表）。\n  - 大事务分批执行。\n  - 加缓存。\n- 复盘：SQL 上线前的审核流程（EXPLAIN）、慢查询告警、批量任务的执行规范（低峰期、限速）。"}, {"no": 20, "title": "Redis 突然大量超时，可能有哪些原因？", "section": "线上问题处理", "answer": "- Redis 侧的原因：\n  - 慢命令阻塞（KEYS、对大 key 执行 HGETALL、DEL 大 key、耗时的 Lua 脚本），可以查看 SLOWLOG。\n  - 热 key：单个分片的 CPU 打满。\n  - 持久化：fork 阻塞（latest_fork_usec）、AOF 刷盘阻塞、开启了透明大页（THP）。\n  - 内存达到上限，频繁淘汰数据；或者发生了 swap。\n  - 大量 key 同时过期。\n  - 主从切换或集群迁移（出现 ASK、MOVED 重定向，或者迁移大 key 时阻塞）。\n  - 连接数达到上限。\n- 客户端侧的原因：\n  - 连接池太小，请求在客户端排队（连接池等待超时）。\n  - 客户端的 GC 停顿、CPU 打满。\n  - 读写大 value 导致的网络传输慢。\n- 网络：带宽打满、丢包、跨机房访问。\n- 排查顺序：看 Redis 监控（CPU、内存、连接数、QPS、慢查询）→ 看客户端连接池的指标 → 看网络。\n- 止损：限流降级、启用本地缓存、迁移或拆分热 key、停止危险的操作、扩容或增加分片。"}, {"no": 21, "title": "发布后错误率上升，怎么判断是否回滚？", "section": "线上问题处理", "answer": "- 原则：如果怀疑问题和这次发布有关，并且影响到了用户，就优先回滚，再定位问题，而不是在线上边排查边修复。止损比找到根因更重要。\n- 判断依据：\n  - 时间相关性：错误率是不是在发布（或灰度批次）之后开始上升。\n  - 灰度对比：新版本实例的错误率明显高于老版本的实例。\n  - 错误类型：报错的位置是否在这次修改的代码中。\n  - 影响程度：是否突破了 SLO 的阈值（错误预算消耗得很快）。\n- 回滚的前提：\n  - 每次发布都提前准备好回滚方案。\n  - 如果数据库结构变更或数据格式发生了不兼容的变化，回滚代码可能会有问题，所以变更要设计成向前兼容。\n  - 多个服务联合发布时，按相反的顺序回滚。\n- 回滚之后：确认指标恢复；保留现场（日志、问题实例）用于分析；修复后重新走灰度发布流程。\n- 预防：分批灰度发布，每一批都观察指标；把自动化的指标检查作为发布的卡点。"}, {"no": 22, "title": "【专家】上线后发现一批数据被写错了，怎么修复且不影响线上？", "section": "线上问题处理", "answer": "- 先止血：找到写错数据的根因（代码 bug、配置错误、脚本错误），先修复，或者关闭对应的功能，防止继续产生错误的数据。\n- 评估范围：根据时间窗口、业务条件、日志、binlog，统计受影响的数据（行数、用户、业务影响）。\n- 确定正确的数据：\n  - 从备份、binlog 中恢复修改前的值（可以使用闪回工具，基于 row 格式的 binlog 生成反向 SQL）。\n  - 从上游的数据源或日志中重新计算出正确的值。\n- 修复方案：\n  - 写修复脚本或 SQL，先在测试环境用线上数据的副本验证。\n  - 执行前备份当前的数据，准备好回滚 SQL。\n  - 分批执行（控制每批的大小、批次之间休眠），在低峰期执行，监控主从延迟和业务指标。\n  - 通过 DMS 提交，经过 DBA 审核。\n- 下游：错误的数据可能已经同步到了缓存、ES、数仓或者其他系统，要一并修复，或者重新同步；必要时通知受影响的用户或业务方。\n- 验证和复盘：抽样核对修复的结果；复盘为什么测试和灰度阶段没有发现这个问题，补充校验和监控。\n- 可引用：清理 20b 衔接视频数据时，制定了修复 SOP：备份三张质检表、按顺序变更、按相反的顺序回滚、在 DMS 上分批提交。"}, {"no": 23, "title": "【高频】在两个技术方案之间做选择时，你会考虑哪些因素？", "section": "技术决策与管理", "answer": "- 是否满足需求：功能、性能指标（延迟、QPS）、一致性的要求、可扩展性。\n- 复杂度和成本：开发的人力和工期、运维成本、机器成本、团队的学习成本。\n- 风险：技术是否成熟、对现有系统的影响面、能否灰度和回滚、出现故障时的影响范围。\n- 长期：可维护性、职责是否清晰、和整体架构是否一致、是否会引入技术债。\n- 团队：团队的技术栈和经验、上下游团队的配合成本。\n- 方法：\n  - 列出评估维度，把各方案逐项对比（必要时打分）。\n  - 用数据说话：做一个原型或压测验证关键假设。\n  - 写进技术评审文档，让相关方一起评审。\n  - 没有完美的方案，要明确取舍了什么、为什么可以接受。\n- 可引用：数字人\"最近使用\"的读取方案，对比了两种方案后选择了\"分发 server 调用 agent server\"，因为职责更清晰；TTS 迁入爱速搭时，对比了\"申请爱速搭组织\"（1 到 2 人日，但审批时间不可控）和\"用 Go 重写后部署到 appengine\"（2 到 3 人日）两种方案。"}, {"no": 24, "title": "【高频】怎么评估一个技术方案的风险？", "section": "技术决策与管理", "answer": "- 识别风险：\n  - 技术风险：新技术是否成熟、性能能否达标、是否有未经验证的假设。\n  - 依赖风险：上下游团队的排期、第三方服务的稳定性和配额。\n  - 数据风险：数据迁移、一致性、数据丢失。\n  - 上线风险：影响面、能否回滚、发布的顺序依赖。\n  - 安全和合规风险。\n  - 进度风险：工期估算是否乐观、关键人员是否只有一个人。\n- 评估：对每个风险按发生的概率和影响程度分级。\n- 应对：\n  - 高风险的点先做原型或压测验证。\n  - 设计降级和回滚方案；用功能开关和灰度控制影响面。\n  - 关键依赖提前对齐，留出缓冲时间。\n  - 写进评审文档，明确每个风险的负责人。\n- 持续跟踪：在里程碑节点复查风险，有变化及时同步。\n- 可引用：长底板组件评审中明确了一个风险，三处筛选映射必须同步修改，漏改一处长底板形象就\"查不到\"；PaaS 上线评审明确了 pipeline 后端必须先于 paas 上线。"}, {"no": 25, "title": "业务需求紧急，但技术方案有隐患，你怎么处理？", "section": "技术决策与管理", "answer": "- 先把隐患说清楚：具体的风险是什么、发生的概率、发生后的影响（数据、资金、用户体验），用业务方能理解的语言描述，不只是说\"技术上不好\"。\n- 给出可选的方案，而不是只是拒绝：\n  - 方案 A：按期上线一个最小可用版本，同时用兜底措施控制风险（开关、限流、监控、人工兜底），之后再排期偿还技术债。\n  - 方案 B：延期 N 天，做正确的方案。\n  - 说明每个方案的代价。\n- 让决策人基于信息做决策，并把结论记录下来（风险由谁承担、技术债什么时候偿还）。\n- 底线：涉及安全、数据丢失、资金正确性的问题不妥协，必须解决之后才能上线。\n- 跟进：上线后加强监控；按照约定的时间完成技术债的偿还，不要让临时方案变成永久方案。"}, {"no": 26, "title": "【专家】多个团队联合开发一个需求，你怎么推进和协调？", "section": "技术决策与管理", "answer": "- 对齐目标和范围：组织需求评审和技术评审，明确每个团队负责的部分、接口的边界、验收标准。\n- 接口先行：先定好接口文档（字段、错误码、调用时序、上线顺序），各团队基于接口文档并行开发，用 mock 联调。\n- 计划：拆分出里程碑（开发、联调、提测、上线），识别关键路径和依赖，每个任务都要有负责人和截止时间。\n- 过程管理：\n  - 定期同步进度（站会或周会），提前暴露风险，阻塞的问题及时升级。\n  - 整理疑问清单，逐条关闭。\n  - 联调时使用统一的环境和测试数据。\n- 上线：统一的上线文档（发布顺序、负责人、验证方法、回滚方案）；上线当天大家同时在线，按 checklist 执行。\n- 复盘：沉淀协作中暴露的问题和经验。\n- 可引用：\n  - 对客 PaaS 平台：打通了 PaaS、MIS、Pipeline、架构四方，输出了 PaaS 对客接口文档、疑问点整理、提测文档、上线文档，上线顺序为架构后端 → pipeline 后端 → pipeline 前端 → paas。\n  - 商业化线索工具：对接 B 端和 C 端的前端、服务端以及 QA。"}, {"no": 27, "title": "技术债怎么识别和偿还？", "section": "技术决策与管理", "answer": "- 识别：\n  - 代码层面：重复代码、没有测试、复杂度高、过时的依赖。\n  - 架构层面：耦合过紧、性能瓶颈、单点。\n  - 运维层面：手工操作、没有监控、临时脚本。\n  - 信号：同类 bug 反复出现、修改一个功能需要动很多地方、新人很难上手、频繁发生线上问题。\n- 记录：建立技术债清单，记录影响、偿还的成本、优先级，不要只停留在口头上。\n- 偿还策略：\n  - 按\"影响程度除以偿还成本\"排序，优先处理影响稳定性和效率的问题。\n  - 结合业务需求顺带偿还（修改到某个模块时顺便重构这个模块）。\n  - 固定比例：每个迭代预留一部分时间（如 10% 到 20%）用于偿还技术债。\n  - 大的重构要有灰度方案和对比验证，保证行为不变。\n- 预防：代码评审、技术评审中控制新增的技术债；临时方案要写明偿还计划。\n- 可引用：每月的 O 端平台技术优化；mount 服务前置数据获取的重构；646 拒绝老协议流量；对话数据冷备和存量数据治理。"}, {"no": 28, "title": "你怎么做代码评审？关注哪些点？", "section": "技术决策与管理", "answer": "- 正确性：逻辑是否正确、边界条件、错误处理（是否吞掉了错误）、空指针、并发安全（数据竞争、锁、goroutine 泄漏）。\n- 稳定性：超时、重试、幂等、资源释放（Body、Rows、文件）、panic 的兜底、对下游的保护（限流、批量操作的大小）。\n- 性能：N+1 查询、循环中的 IO、不必要的内存分配、索引是否使用正确（附上 EXPLAIN 的结果）、缓存的使用。\n- 兼容性：接口和数据结构是否向后兼容、DDL 是否在线执行、上线顺序是否有依赖、新功能是否有开关。\n- 安全：输入校验、SQL 注入、越权（资源归属的校验）、敏感信息是否打到了日志中、密钥是否写在了代码里。\n- 可维护性：命名、函数的职责、和现有代码风格的一致性、必要的注释、测试的覆盖。\n- 方式：\n  - 先看改动的意图和设计，再看细节；大的改动要求拆成小的提交。\n  - 评论区分\"必须修改\"和\"建议\"，就事论事。\n  - 借助工具：lint、静态检查、`-race`、AI 辅助评审。"}, {"no": 29, "title": "【高频】怎么写一份好的技术评审文档？", "section": "技术决策与管理", "answer": "- 结构：\n  1. 背景和目标：要解决什么问题，衡量成功的指标。\n  2. 需求范围：包含什么、不包含什么。\n  3. 现状分析：现有的链路和问题，最好有数据。\n  4. 方案设计：\n     - 整体架构和流程图（时序图、状态机）。\n     - 数据模型（表结构和 DDL、索引）。\n     - 接口定义（字段、错误码、示例）。\n     - 关键的算法和规则。\n  5. 方案对比和取舍：备选方案和选择的理由。\n  6. 非功能设计：性能和容量估算、一致性、安全、监控告警、降级预案。\n  7. 兼容性和上线：存量数据的处理、发布顺序、灰度、回滚方案。\n  8. 风险和待确认的问题。\n  9. 排期和分工、测试要点。\n- 要点：\n  - 读者是评审人，结论先行，图表优于大段的文字。\n  - 关键的设计决策要写清楚\"为什么\"。\n  - 数字要有依据（压测结果、容量估算）。\n  - 评审后补充评审意见和结论，并持续更新。\n- 可引用：长底板方案的 PPL 技术评审、删除衔接视频的技术评审（6 个接口、可用率算法、DDL 和刷新脚本）、对客 PaaS 的技术评审。"}, {"no": 30, "title": "怎么带新人？怎么做技术分享和沉淀？", "section": "技术决策与管理", "answer": "- 带新人：\n  - 提供入门的资料：系统架构、核心链路、开发和发布流程、常用的排查方法。\n  - 从边界清晰的小需求开始，逐步增加难度，在过程中做代码评审和方案评审的辅导。\n  - 定期 1 对 1 交流，了解卡点。\n  - 重点培养的是排查问题的思路和工程规范，而不只是完成任务。\n- 技术分享：\n  - 选题来自实际的项目和问题（踩过的坑、优化的案例、新技术的调研）。\n  - 讲清楚问题、思路、方案、数据和结论，让听众能直接用上。\n- 沉淀：\n  - 把技术评审、排查记录、SOP（上线规范、数据清理规范）、接口文档整理到知识库中。\n  - 重复出现的问题整理成文档或工具。\n  - 把经验固化到流程中（checklist）。\n- 可引用：知识库中整理的迭代文档（每个需求都有技术评审、联调文档、上线 checklist）。团队\"AI智能体\"目录下的技术分享（RAG、Milvus、A2A、MCP、上下文工程、Go 模块管理、Go TUI 等）可以作为分享选题的参考，但要先确认其中哪些是你自己做的分享再引用。"}, {"no": 31, "title": "【专家】AI 编程工具（Copilot、Cursor、Claude Code）对团队研发流程有什么影响？你怎么用？", "section": "技术决策与管理", "answer": "- 影响：\n  - 编码：样板代码、单元测试、接口对接、脚本、SQL 等工作的效率明显提升；开发者的重心从\"写代码\"转向\"描述需求、评审和验证\"。\n  - 学习和排查：快速理解陌生的代码库、阅读日志、定位问题。\n  - 文档：自动生成技术文档、接口文档、周报和总结。\n  - 新的风险：生成的代码看起来正确，但存在隐藏的 bug；安全问题（注入、越权）；代码风格不一致；敏感代码和数据的外泄。\n- 我的用法：\n  - 明确的任务交给 AI：写单元测试、写数据处理脚本、生成 CRUD 和接口代码、整理文档、批量修改。\n  - 设计和关键逻辑由自己把握：AI 生成的代码必须经过评审和测试，再合入代码库。\n  - 给足上下文：项目规范文件、现有代码的风格、接口定义，让它遵循现有的约定。\n  - 验证闭环：让 AI 修改后运行测试或编译，用结果来校验。\n- 团队层面：\n  - 制定使用规范：哪些代码和数据不能发送给外部模型、代码评审的要求不降低。\n  - 沉淀团队的提示词和项目说明文件（如 CLAUDE.md），共享常用的工作流。\n  - 衡量效果：交付周期、缺陷率。\n- 可引用：使用 AI 编写单元测试的实践文档。"}, {"no": 32, "title": "【专家】你怎么看 Agent 技术未来 1 到 2 年的发展方向？", "section": "技术决策与管理", "answer": "- 模型：\n  - 推理能力和工具调用能力继续提升，长任务的可靠性提高（能够自主运行几小时的 Agent）。\n  - 多模态和实时交互（语音、视频、数字人）的延迟进一步降低，端到端的语音模型普及。\n  - 小模型的能力增强，端侧部署和专用模型的成本下降。\n- 工程：\n  - 上下文工程和记忆系统成为核心竞争力（记忆的组织、演化、个性化）。\n  - 协议标准化：MCP（工具）、A2A（Agent 之间协作）走向成熟，形成 Agent 互联的生态。\n  - Agent 的评估、可观测和安全护栏成为平台的标配。\n  - Workflow 和 Agent 融合（可控的自主性）成为主流的落地形态。\n- 应用：\n  - Coding Agent 和 Deep Research 已经被验证，会扩展到更多的垂直领域（客服、营销、数据分析、内容生产）。\n  - 从\"对话助手\"走向\"能够执行任务、替人办事\"的 Agent，同时对权限和安全的要求更高。\n  - 数字人和实时互动 Agent 在电商、教育、客服等场景商业化。\n- 对自己的意义：\n  - 在平台工程能力（高并发、稳定性、数据治理）的基础上，加深对 Agent 核心技术（上下文、记忆、评估、工具协议）的理解。\n  - 把评估平台和数据闭环的建设经验，应用到 Agent 的质量体系中。"}, {"no": 33, "title": "如果业务方案效果不及预期，你怎么用数据说服产品调整方向？", "section": "技术决策与管理", "answer": "- 先确认数据可信：统计口径正确、样本量足够、排除了实验设计的问题（分流是否均匀、实验周期是否足够长）。\n- 拆解问题：漏斗分析（曝光 → 点击 → 使用 → 转化）找出流失最多的环节；分人群和场景对比；结合 badcase 和用户反馈，分析\"为什么\"。\n- 呈现方式：\n  - 结论先行：核心指标的变化，和预期之间的差距。\n  - 证据：关键数据、对比图表、具体的案例。\n  - 原因分析。\n  - 建议：调整的方向，以及每个方向的预期收益和成本，甚至可以提前做一个小实验来验证。\n- 态度：站在共同的业务目标上讨论，不是否定产品的判断，而是基于数据共同决策。尊重产品的最终决策，但要把风险和数据记录下来。\n- 可引用：资源型智能体追问优化，用 150 条样本的评估数据（badcase 率从 20% 降到 4.67%）和产品对齐效果与后续目标；多人调度统计中和产品确定口径（使用 query 维度）。"}, {"no": 34, "title": "【专家】专家和高级工程师的区别是什么？你认为自己已经具备了哪些专家能力？", "section": "技术决策与管理", "answer": "- 区别：\n  - 高级工程师：能独立、高质量地完成复杂模块的设计和开发，解决疑难问题。\n  - 专家：\n    - 影响范围更大：从负责一个模块，到负责一个领域或平台的技术方向。\n    - 系统性：能把一类问题抽象成平台能力或方法论，而不只是解决单个问题。\n    - 前瞻性：判断技术趋势，提前规划。\n    - 带动团队：通过技术评审、规范、分享提升团队的整体能力。\n    - 跨团队：主导跨团队的复杂项目，对业务结果负责。\n- 我已经具备的（结合实际项目举例）：\n  - 平台从 0 到 1 的建设：数字人形象制作、质检、端到端评估、对客 PaaS 交付平台的 server 端设计（数据模型、状态机、一致性方案）。\n  - 跨团队主导：RFQ 归因链路（5 个服务、5 种通路）、PaaS 四方打通（明确上线顺序和依赖）。\n  - 用数据驱动的性能和质量优化：mount 服务耗时降低约 30 倍；追问 badcase 率降到 4.67%。\n  - 大规模的数据治理：约 20T 对话数据的冷备和删除；存储占用从 80% 降到 61%。\n  - 风险控制的方法：灰度双接口、在线 DDL、先备份后变更的 SOP、新能力只命中新的枚举值。\n- 还需要加强的（诚实地说）：\n  - Agent 核心技术的深度（上下文工程、记忆、评估体系的方法论）。\n  - 技术规划和对外的技术影响力（分享、规范的沉淀）。\n  - 下一步的计划。"}, {"no": 35, "title": "你下一年的技术规划是什么？", "section": "技术决策与管理", "answer": "- 框架：业务目标 → 技术挑战 → 规划的方向 → 衡量指标 → 里程碑。\n- 示例（结合数字人 PaaS 和 Agent 方向，按实际情况调整）：\n  1. 平台稳定性和效率：PaaS 交付链路的 SLA 体系（可用性、交付时长）；生产调度平台化（统一的任务状态机、自动重试、巡检兜底）；把交付周期从天级缩短到小时级（推广长底板、生成式底板等方案）。\n  2. 质量体系：端到端评估从人工为主转向机器质检加人工抽检；建立评估指标和数据闭环，用数据驱动形象和对话策略的迭代。\n  3. Agent 能力：实时互动 Agent 的低延迟优化（全链路流式、打断）；记忆和个性化；用 MCP 和工具网关统一管理能力。\n  4. 工程效能：沉淀通用组件（状态机、异步任务框架、批量查询和缓存的规范）；把 AI 编程工具引入团队的研发流程。\n  5. 团队和影响力：输出技术分享、规范和 SOP；带新人。\n- 每项规划都要有可以衡量的目标（如延迟降低 X%、自动化质检的覆盖率达到 Y%、交付时长缩短到 Z），并说明如何支撑业务目标。"}]}, {"title": "16 结合个人项目的追问", "questions": [{"no": 1, "title": "agent-mount 优化从 3s 降到 98ms，瓶颈到底在哪？只是查库次数多吗？", "section": "智能体平台", "answer": "- 瓶颈主要在前置获取 mount data 的方式：原来按每个挂载项起一个协程，分别查 MySQL 的 uimeta 和 uidata。挂载项一多，查库次数、协程数量和内存分配都随之线性增长。\n- 不只是查库次数多，还连带了三个问题：\n  - 协程数多：优化前 229 个，优化后 160 个，减少 30.1%。\n  - 内存分配多：allocs 和 heap 对象都从 359 降到 185，减少 48.5%，GC 压力随之下降。\n  - 并发查库在数据库连接池上排队，长尾延迟被放大。\n- 改法：收集 ID 后用 `WHERE IN` 一次批量查询，再在内存中组装。\n- 结果：AgentMount 平均耗时从 3.124s 降到 98.43ms。hey 压测（`-n 100 -c 10`）的平均耗时从 3.23s 降到 0.197s，Requests/sec 从 3.09 提到 50.6。\n- 测试条件：用一个手动挂载了 100 个商品的智能体压测。线上手动挂载商品的智能体有 238,645 个，其中挂载数 ≥20 的有 3,331 个。\n- 【文档未记录，需本人确认】pprof 中最大的 CPU 热点具体是哪个函数，比如 SQL 执行、结果扫描还是 JSON 序列化？如果被追问细节，按实际的火焰图回答。"}, {"no": 2, "title": "改成 `WHERE IN` 批量查询后，挂载项特别多（上千个）时会不会有新问题？", "section": "智能体平台", "answer": "- 会有，主要是三个风险：\n  - SQL 过长，解析开销增加，还可能触碰 max_allowed_packet 的限制。\n  - IN 列表超过 eq_range_index_dive_limit（默认 200）后，优化器改用统计信息估算行数，可能选错执行计划。\n  - 一次返回的数据量大，单次查询耗时和内存占用都会上升。\n- 现状：线上挂载数 ≥20 的智能体有 3,331 个，上千个挂载项属于极少数。\n- 【文档未记录，需本人确认】当前代码有没有对 IN 列表做分批上限。\n- 【可补充的改进思路】\n  - IN 列表按固定大小分批（如每批 500 个），批次之间可以有限并发。\n  - 对挂载数据做缓存（Agent 维度的本地缓存加 Redis），配置变更时主动失效。\n  - 运营侧限制单个 Agent 的最大挂载数量。\n  - 压测极端用例（如 1000 个挂载项），用数据确认上限。"}, {"no": 3, "title": "优化后协程数只降了 30%，剩下的协程是什么？还能再降吗？", "section": "智能体平台", "answer": "- 剩下的 160 个协程，大部分是服务的常驻协程，和挂载项数量无关：\n  - HTTP server 的连接处理协程（压测并发为 10）。\n  - 数据库和 Redis 客户端连接池的后台协程。\n  - 日志、监控上报等框架的后台协程。\n  - 其他并行加载逻辑的协程。\n- 原来按挂载项起的协程，在改成批量查询后已经去掉了，这也是减少的那 69 个协程的主要来源。\n- 判断：剩余的协程是正常开销，不随挂载数增长，所以不是瓶颈，继续压缩的收益不大。\n- 【文档未记录，需本人确认】goroutine profile 中剩余协程的具体构成。被问到时可以说\"按 goroutine profile 的调用栈分组看过\"，前提是你确实看过。\n- 【可补充的改进思路】如果要继续优化，看 goroutine profile 中是否还有按请求临时创建、可以合并的协程；对独立的下游调用使用有并发上限的 errgroup。"}, {"no": 4, "title": "为什么用双接口加提前 return 灰度，而不是用配置开关？", "section": "智能体平台", "answer": "- 文档中的做法：\n  - 接口分 v1 和 v2，新逻辑默认走 v1，老逻辑保留在 v2。\n  - 在获取 mountdata 的位置先提前 return，代码分两半上线；验证通过后再去掉 return，正式生效。\n- 这么做的考虑：\n  - 新老两套逻辑同时存在于线上，可以用同一批请求分别调用 v1 和 v2，逐一对比返回数据，覆盖了全部 10 类挂载组件。\n  - 代码先上线、逻辑后生效，降低了一次发布的变更量。\n  - 发现问题可以直接切回老接口。\n- 和配置开关的比较：配置开关能做到不发版就切换，回滚更快，粒度也可以更细（按 Agent 或流量比例）。\n- 【文档未记录，需本人确认】当时没有用配置开关的具体原因，比如调用方切换接口的方式、团队习惯或者开关组件的限制。\n- 【可补充的改进思路】以后同类核心链路的改造，可以把双接口对比和配置开关结合起来：按比例放量，并自动做新老结果的 diff 校验。"}, {"no": 5, "title": "追问优化只改了 Prompt，如果以后换模型，这套 Prompt 失效怎么办？", "section": "智能体平台", "answer": "- 文档中已经把这一点列为风险：以后追问能力升级，这套提示词可能不再可用。\n- 当时只改 Prompt 的原因：PM 不希望换成本更高的模型，所以只能在现有模型上靠 Prompt 收敛效果。\n- 应对办法：\n  - Prompt 放在 `shendeng.lgzx_app_prompt` 表中管理（tpl_id=ResourceAgentSuggestionPromptTpl），换模型时可以单独调整，不需要改代码。\n  - 已经有一套评估方法：10 个智能体、每个 5 个随机 query，共生成 150 条追问，人工标注 badcase 率和有效推荐率。换模型时用同一批样本先回归，指标达标后才切换。\n- 【可补充的改进思路】\n  - 把这 150 条样本沉淀成固定评测集，并补充更多场景。\n  - 用 LLM-as-a-Judge 做自动评估，配合人工抽检。\n  - 后续目标是无 badcase、有效推荐率超过 50%，可以考虑 few-shot 动态检索，或者在追问量足够大时做小模型微调。"}, {"no": 6, "title": "追问的 badcase 评估只有 150 条样本，结论可靠吗？怎么扩大评估规模？", "section": "智能体平台", "answer": "- 先承认局限：150 条样本来自 10 个智能体，每个 5 个 query，每个 query 生成 3 条追问。样本量不大，覆盖面有限，结论只能说明在这批样本上效果明显改善。\n- 但改善幅度足够大，方向是可信的：\n  - badcase 率从 20%（30/150）降到 4.67%（7/150）。\n  - 有效推荐类引导追问率从 18%（27/150）升到 35%（52/150）。\n  - 评估由 PM 完成，结果符合 PM 的预期。\n- 【可补充的改进思路】\n  - 扩大样本：按资源类型（影视、小说、音乐）分层抽取更多智能体和真实线上 query，目标是几百到上千条。\n  - 用 LLM-as-a-Judge 按\"是否违反禁令、是否属于推荐类引导\"自动打分，再用人工抽检校准一致性。\n  - 上线后看线上指标：追问点击率、点击后的会话深度，最好配合 AB 实验。\n  - 定期把新的 badcase 加入评测集。"}, {"no": 7, "title": "240 个智能体的自愈方案，如果千帆重建也失败，会怎样？有没有重复创建的风险？", "section": "智能体平台", "answer": "- 方案回顾：在 shendeng 的 `pipe_app_save` 中，调用 `qianfan.UpdateAssistant` 返回 5002（Assistant 不存在）时，改为调用 `qianfan.CreateAssistant` 重建，并带上 ThoughtInstructions 和 ChatInstructions。\n- 验证方式：在线下把 `lgzx_app` 表的 assistant_id 改成错误的值，复现问题，再验证接口返回 code 0。\n- 只在明确返回 5002 时才重建，其他错误码不会触发，这限制了误触发的范围。\n- 【文档未记录，需本人确认】\n  - 重建也失败时的处理：是直接返回错误、记录日志并告警，还是有重试？\n  - 重建成功后，有没有把新的 assistant_id 回写到 `lgzx_app` 表？没有回写的话，每次保存都会触发重建，导致重复创建。\n  - 修复上线后，那 240 个存量智能体是等用户下次保存时自动修复，还是做了批量修复？\n- 【可补充的改进思路】\n  - 重建成功后在同一个流程中更新 assistant_id，保证幂等。\n  - 重建失败时告警，并加入待修复队列。\n  - 用定时对账任务批量扫描两侧数据不一致的智能体。\n  - 统计重建次数，次数异常增多说明有系统性问题，要及时告警。"}, {"no": 8, "title": "首 token 慢的根因是历史消息序列错误，为什么历史里会出现没有回复的 user 消息？源头修了吗？", "section": "智能体平台", "answer": "- 排查过程：\n  - 在 ae-app-646 的日志中筛出 `yiyan_first_cost > 2.0s` 的数字人请求。\n  - 在 trace 平台按 session_id 检索，发现 `op_prompter` 报错 \"preRole: user, nowRole: user … message sequence error\"。\n  - 原因是历史记录中有 user 输入但没有 assistant 回复，导致消息序列不合法。\n- 修复：在 ai-agent-core 查询历史时，过滤掉没有 assistant 回复的记录（CR \"数字人智能体逻辑优化\"）。\n- 这是读取端的防御。源头产生这类记录的可能原因：\n  - 生成失败或被用户打断后，只保存了 user 消息。\n  - 数字人的默认引导或空 query 也写入了历史。\n- 【文档未记录，需本人确认】\n  - 当时是否定位并修复了写入端的源头？\n  - 修复后首 token 耗时的实际数据。\n- 【可补充的改进思路】\n  - 写入端以\"轮\"为单位保存，回复成功后才落库，失败的轮次打上标记。\n  - 读取端保留过滤作为兜底。\n  - 对消息序列错误加监控和告警。"}, {"no": 9, "title": "RFQ 链路跨 5 个服务、5 种通路，你怎么保证字段一个都没漏？", "section": "商业化线索", "answer": "- 先梳理：完整画出 FE → Agent Proxy → 676（Q2C）/ 646（shendeng）/ 722（ai-agent-core）→ 704（agent-mount）的链路，并为 q2a、q2c、智能体房间页、快捷指令、房间页电话加线索这 5 种通路各写一篇子文档，逐一梳理调用点。\n- 找全调用点：在 646 和 722 中，按 agent_mount 的 ral 配置搜索所有调用 mount 的位置，逐个补传 session、log 和 message_id。\n- 明确差异：记录每种通路的字段来源差异，例如只有 q2c 有 content_id，快捷指令通路一直没有 contentid，避免把\"本来就没有\"误判成\"漏传\"。\n- 验证：\n  - 走查和联调：8.11 安排了联调走查。\n  - 在 `/agent/mount/search` 的返回中检查 `ui_data.chatInfo` 是否带齐了字段。\n  - mount 有按 session_id 的频控，测试时要构造不同的 session_id。\n- 后续还发现并修复了 searchid 的取值问题（改为取 trans_data 中 log 里的 lid），以及 q2c 链路 trans_data 的传递问题。说明联调和线上验证确实发现了遗漏，这也是为什么验证环节必不可少。\n- 【可补充的改进思路】建立字段透传的自动化校验，比如按通路构造请求，断言 chatInfo 中的必填字段；线上统计各字段的缺失率并告警。"}, {"no": 10, "title": "704 必须先上线，如果 704 上线后出问题回滚，其他服务会怎样？", "section": "商业化线索", "answer": "- 上线顺序是 704 → 676 → 722 → 646，704 先发。原因是 704 新增的是可选入参（message_id、log_id、content_id），上游服务上线后才开始传这些参数。\n- 回滚的影响分两种情况：\n  - 只有 704 上线时就回滚：上游还没有开始传新参数，没有影响。\n  - 上游已经上线后 704 回滚：上游传的新字段会被旧版 704 忽略。只要旧版接口对未知参数是容错的（不报错），主流程不受影响，只是线索卡中暂时缺少归因字段。\n- 【文档未记录，需本人确认】旧版 704 对未知参数是否确实忽略而不报错，当时有没有验证过。\n- 结论：设计上，新字段都是可选的、向后兼容，所以任何一个服务回滚都不会破坏主流程，只会让归因数据短暂不完整。\n- 【可补充的改进思路】上线 checklist 中写明每个服务的回滚影响；用功能开关控制新字段的写入，可以不发版就关闭。"}, {"no": 11, "title": "线索组件召回时机怎么判断？召回太频繁影响用户体验怎么办？", "section": "商业化线索", "answer": "- 召回由 mount 服务负责：\n  - 修改了 mount 服务的 LLM 提示词并增加了 `leads_type`，配合策略侧优化线索组件的召回。\n  - 做了关闭线索表单的提示词 AB 实验，配置在 `conf/app/agent.toml` 中。\n  - 快捷指令（cmd）是确定性的召回链路：system_leads、system_order_service、system_quotation。\n- 控制频率：mount 有按 session_id 的频控。\n- 跟进修复过两个和召回体验相关的 bug：\n  - 提交预约表单后发送\"我已预约咨询\"，又召回了表单（miniapp-offline-16557）。\n  - 会员过期后仍然能召回会员线索（miniapp-offline-17030）。\n- 【文档未记录，需本人确认】频控的具体规则，比如一个会话内最多召回几次、间隔多少轮；AB 实验的结论。\n- 【可补充的改进思路】\n  - 用户已经提交过表单后，在会话状态中打标，不再召回。\n  - 把召回率和线索转化率、会话流失率一起看，找到平衡点。\n  - 对高价值 query 优先召回。"}, {"no": 12, "title": "会员信息要跨 4 个服务透传，为什么不让 mount 服务自己去查会员状态？", "section": "商业化线索", "answer": "- 做法回顾：\n  - 704 mount-server 的请求参数新增 `member_info`（member_status、member_start_time、member_end_time）。\n  - q2c 构造请求时加上 from=q2c、business_ability 和 trans_data_list。\n  - 646 和 722 配合修改。\n  - 方案经过了 B server 和 agent server 的技术评审（会员通用对话模板技术方案）。\n- 透传的合理性：\n  - 会员信息由上游在请求入口获取一次后，沿链路传递，避免多个下游服务各自重复查询会员服务，减少调用次数和延迟。\n  - 同一个请求内，各服务看到的会员状态一致。\n  - mount 不需要新增对会员服务的依赖。\n- 代价：链路上每个服务都要改造；而且曾经出现过会员过期后仍然召回会员线索的 bug，说明传递的状态有时效问题。\n- 【文档未记录，需本人确认】评审中选择透传方案的具体原因，比如会员信息归属哪个服务、mount 是否有权限查询会员服务。\n- 【可补充的改进思路】透传的同时带上会员的有效期，由下游按当前时间判断是否过期；或者把会员状态做成统一的上下文字段，放进 trans_data 白名单，减少每次新增字段都要改造多个服务的成本。"}, {"no": 13, "title": "「最近使用」接口为什么选 Redis ZSET 加 MySQL 双写？只用 MySQL 行不行？", "section": "数字人", "answer": "- 方案回顾：\n  - 646 在 `/bot/conversation` 记录 QA 对时，通过 bigpipe（ai-agent-last-use）写出。\n  - 697 ai-agent-cserver 订阅后双写 Redis 和 MySQL。\n  - Redis 使用 ZSET `user:digital_human_recent_agents:{uid}`（member 为 appId，score 为时间戳），详情放在单独的 String 中。\n  - MySQL 表为 `digital_human_recent_agents`。\n- 为什么用 ZSET：天然按时间排序和去重，同一个数字人再次使用时只需更新分数；取最近 N 条是 O(log N)，首屏读取非常快。\n- 为什么还要 MySQL：\n  - Redis 只缓存 16 条，翻页需要更多的历史数据。\n  - 需要持久化保存 12 个月，Redis 中的数据丢失后可以恢复。\n- 只用 MySQL 行不行：从容量上看可以。预估 QPS 峰值约 5、耗时 150ms，按 uid 加时间建索引完全能支撑。\n- 用 Redis 的理由：这个接口用于 CNY 活动的精选 Tab 和广场页\"我聊过的\"，首屏的访问量和延迟要求更高，用 Redis 承接首屏可以降低数据库压力。\n- 【文档未记录，需本人确认】当时有没有评估过只用 MySQL 的方案，以及最终选择 Redis 的理由。如果被追问，可以坦诚地说按当时的 QPS，单用 MySQL 也能满足，Redis 主要是为活动的流量峰值和首屏延迟留出余量。"}, {"no": 14, "title": "双写时 Redis 写成功、MySQL 写失败，数据会不一致吗？", "section": "数字人", "answer": "- 会存在短暂的不一致，但有兜底：\n  - 读取首屏时先查 Redis，查不到再查 MySQL 并回写 Redis；非首屏直接查 MySQL。\n  - 所以 MySQL 写失败时，首屏可能能看到这条记录，但翻页时看不到，存在不一致的窗口。\n- 写入是通过订阅 bigpipe 消息完成的，消息可以重新消费，具备重试的基础。\n- 【文档未记录，需本人确认】\n  - 双写的顺序是先写 Redis 还是先写 MySQL。\n  - 写失败时消息是否会重新投递，是否有重试和告警。\n- 【可补充的改进思路】\n  - 以 MySQL 为准：先写 MySQL（upsert，保证幂等），成功后再写 Redis；Redis 写失败就删除对应的 key，下次读取时回源。\n  - 两边都成功后才确认消息；失败的消息重试，超过次数进入死信队列。\n  - 定期抽样对比两边的数据并修复。\n  - Redis 写入使用 `ZADD GT`，防止乱序时旧消息覆盖新数据。"}, {"no": 15, "title": "为什么只缓存最近 16 条？这个数是怎么定的？", "section": "数字人", "answer": "- 文档中的依据：缓存只存 16 条，当前的分页大小是每页 15 条。16 条可以完整覆盖首屏的 15 条，多出的 1 条用来判断是否还有下一页（hasMore）。\n- 容量：一条 ZSET 数据约 0.2KB，每个 uid 最多 0.2 × 16 = 3.2KB。按单日峰值 30 万 PV 估算，Redis 约 0.9GB，可以接受。\n- 首屏之后的数据走 MySQL 查询，所以 Redis 不需要保存更多。\n- 写入时用 `ZREMRANGEBYRANK` 删除多余的成员，只保留最新的 16 条，防止单个 key 无限增长。\n- 【文档未记录，需本人确认】接口参数 pageSize 的上限是 10，和\"每页 15 条\"的说法有出入，回答前要确认首屏实际展示的数量。"}, {"no": 16, "title": "多人调度的命中统计为什么最后选了 query 维度而不是 session 维度？", "section": "数字人", "answer": "- 统计口径：以 query 为维度，计算命中多人调度的比例，去掉了以 session 为维度的口径。\n- 理由：\n  - 统计的目的是评估调度策略。调度决策是针对每一条 query 做出的，按 query 统计才能直接反映策略的命中情况，也便于定位具体的 badcase。\n  - session 维度只能说明\"这个会话里出现过多人调度\"，看不出调度了几次、是否准确，作为策略评估的指标太粗。\n- 明细字段的映射：query → query、主智能体 ID → app_id、query 领域 → Ext、历史上下文 → history，另外包括 message 和 PrompterOut.Result，用于逐条分析。\n- 产出：在 baidu/agents/dev-tools 中新增了统计脚本，并做了 Sugar 报表（op_dialogue_dispatch_1）。\n- 【文档未记录，需本人确认】统计出来的命中比例（文档中标注为\"待定\"）。如果被问到具体数字，要以实际数据为准。"}, {"no": 17, "title": "端到端评估的 Worker 先改状态再处理，如果处理到一半进程挂了，任务会卡住吗？", "section": "平台与 PaaS", "answer": "- 流程回顾：VideoProduceWorker 查询 `produce_status=1`（待生产）的任务，先 `UPDATE produce_status=2`（生产中）防止重复处理，然后解析 BOS 上的 Excel，逐条调用 arch 创建视频。单个 case 失败会自动重试一次。\n- 风险：如果在改为生产中之后、处理完之前进程崩溃，这个任务会一直停留在\"生产中\"状态，不会被再次领取，确实可能卡住。\n- 【文档未记录，需本人确认】有没有处理这种情况的超时检测或重置机制。\n- 【可补充的改进思路】\n  - 记录开始处理的时间（或心跳），超时还处于生产中的任务，由巡检任务重置为待生产或标记为失败。\n  - 领取任务时用带条件的更新（`WHERE id=? AND produce_status=1`），影响行数为 1 才算领取成功，多实例部署时也不会重复领取。\n  - case 维度的状态独立记录，重新处理时跳过已经提交过的 case，避免重复调用 arch。\n  - 已经实现的 `origin_info`（记录重试前的原始任务 ID 和失败信息）可以用来追溯。"}, {"no": 18, "title": "交叉质检分数按分档合并，为什么不直接取平均？", "section": "平台与 PaaS", "answer": "- 规则：分数划分为四个档位，[0,0.8)、[0.8,1.5)、[1.5,2.5)、[2.5,3]。两个质检员的分数在同一档时取均值，不在同一档时取较低分。\n- 为什么不直接取平均：\n  - 两个人分歧很大时（如一个给 0.5 分、一个给 2.8 分），平均值落在中间的\"合格\"区间，会掩盖其中一个人发现的严重问题。\n  - 质检的目的是不放过问题，所以采取保守策略：分歧大时以较低的分数为准，宁可误判为不合格，再由人工复核。\n  - 分数接近时，取均值能平滑个人打分的误差。\n- 合格判定：final_score 是 6 个维度均分的算术平均。final_score 或多模态均分低于 0.8、声音均分低于 0.75，或者形象、表情、动作、背景任一维度均分低于 1.0，就判定为不合格。\n- 管理员抽检可以覆盖 final_score，作为最终的兜底。\n- 【可补充的改进思路】统计两个质检员之间的一致率；分歧特别大的 case 自动交给第三人复核；用这些数据培训质检员。"}, {"no": 19, "title": "可用率预先写到 figure 表，什么时候会和实际数据不一致？怎么修正？", "section": "平台与 PaaS", "answer": "- 设计回顾：\n  - figure 表新增了 `overall_availability_rate`（整包可用率）和 `first_pass_rate`（一次可用率）两个冗余字段。\n  - 计算的触发时机：qc_task 的 `qc_is_completed=1` 并且 `spot_is_completed=1` 时，以及手动调用 `/dh/figure/segment_data/refresh` 接口时。\n  - 列表页直接读取这两个字段，避免实时聚合 qc_evaluation_record 带来的性能问题（这一点在技术评审的风险表中已经列出）。\n- 可能不一致的情况：\n  - 计算完成后，评估记录又被修改了，比如管理员抽检覆盖了结果、舍弃了某个轮次、清理了数据。\n  - 计算触发失败，或者计算过程中出错。\n  - 存量数据在这次上线之前就已经存在（有存量刷新脚本）。\n- 修正手段：\n  - 页面上提供手动刷新按钮（refresh 接口）。\n  - 上线时执行存量数据刷新脚本。\n  - 用 figure_id=59 的数据验证过可用率 SQL 的正确性。\n- 【可补充的改进思路】\n  - 在所有会影响可用率的写操作之后都触发重新计算，比如抽检覆盖、舍弃配置。\n  - 增加定时校对任务，比对冗余字段和实时计算的结果，自动修正。"}, {"no": 20, "title": "PaaS 审核状态不落表、实时聚合，查询量大了会不会有性能问题？", "section": "平台与 PaaS", "answer": "- 设计回顾：审核状态不单独落表，按（delivery_id，material_key）取最新的一条 delivery_review 记录，实时聚合出待提交、审核中、驳回或通过。客户重新上传素材时，只更新 delivery.materials 这个 JSON 字段。\n- 这样设计的好处：\n  - 只有一个数据源，不会出现\"状态字段和审核记录不一致\"的问题。\n  - 写入逻辑简单。\n- 性能：\n  - 每个交付单的素材数量有限，查询有索引可以利用，单次聚合的成本很低。\n  - PaaS 是对客的 B 端场景，查询量远低于 C 端。\n  - 所以按当前的量级不会有问题。\n- 【文档未记录，需本人确认】delivery_review 表上对应的索引设计，以及 status_query 等高频查询的实际 QPS 和耗时。\n- 【可补充的改进思路】\n  - 在（delivery_id，material_key，id）上建联合索引，让\"取最新一条\"只需一次索引查找。\n  - 列表页批量查询多个交付单的审核状态时，用 IN 查询后在内存中聚合，避免 N+1。\n  - 量级上来后，可以增加一个冗余的状态字段作为缓存，以审核记录为准定期校对。"}, {"no": 21, "title": "交付 stage 只在三处推进，另外还有定时巡检兜底，巡检多久一次？发现不一致怎么处理？", "section": "平台与 PaaS", "answer": "- 设计回顾：\n  - stage 只在三处显式推进：status_query（PaaS 在开播前调用，按需触发部署）、bind_cmeta 回调、缩容。\n  - figure、voice 和审核状态由各自的源表负责。\n  - service 层提供了 RecomputeDelivery 兜底定时任务，用来巡检 stage 和实体真实状态不一致的情况。这一点写在技术评审的风险表中。\n- 部署是否完成以外部系统的实际状态为准：通过 agent/info 的 `warmup_num > 0` 确认部署成功。\n- 【文档未记录，需本人确认】\n  - RecomputeDelivery 的执行频率，pipeline 的其他定时脚本如一键抽检、消息通知、arch-deploy-polling 都是每分钟执行一次，可以作为参考。\n  - 发现不一致时，是自动修正 stage，还是只告警。\n- 回答时可以讲处理原则：\n  - 以源表的状态为准，重新计算 stage 并修正。\n  - 修正动作要幂等，并记录操作日志。\n  - 无法自动判断的情况告警，交给人工处理。"}, {"no": 22, "title": "公版从客户层级挪到模板层级，存量数据怎么迁移？", "section": "平台与 PaaS", "answer": "- 背景：按原来的 PPL 逻辑，创建公版 Agent 要先关联一个\"公共客户\"。客户购买公版 Agent 后，这个 Agent 又要关联到购买的客户，一个 Agent 归属两个客户，是矛盾的。\n- 解法：\n  - 新增 `public_template` 表，把公版放到模板层级，模板记录公共的形象包和声音的对应关系。\n  - 每一笔订单都基于模板创建独立的数字人：免费接入时随机选择一个模板，秒级创建数字人。\n- 存量数据：\n  - 公版模板本期在 O 端新建，创建后不支持修改。\n  - 文档中提到本期的公版形象包是线下生产的，不是用 PPL 生产的。\n  - 在 paas 优化中，给公共库的形象打了标，并录入了两套公版形象包：男公版\"小星\"、女公版\"小静-简约书房背景\"。\n- 【文档未记录，需本人确认】已经通过\"公共客户\"方式创建的存量公版 Agent 是怎么处理的：迁移、保持不变，还是逐步下线？如果被追问，要按实际情况回答。"}, {"no": 23, "title": "长底板方案复用状态枚举、不新增状态，以后要扩展新状态会不会很难？", "section": "平台与 PaaS", "answer": "- 设计回顾：\n  - figure 表新增 `figure_type` 字段（1 表示衔接视频，2 表示长底板循环）。\n  - 完全复用现有 `status` 枚举中的 1、4、5、6、7，不新增状态值；外显时先看 figure_type，再解释 status 的含义。\n  - 长底板跳过质检，状态由形象策略工程通过 `/figure/callback` 透传。\n  - 唇动训练并入\"打包中\"，超分合并到当前状态展示。\n  - 好处是对存量链路零影响，两种类型共用一套 DAO 和常量枚举，默认值兼容存量数据，不用回刷。\n- 扩展性的代价：\n  - 同一个状态值在不同类型下含义不同，所有读取状态的地方都要先判断类型，容易出错。\n  - 如果以后长底板需要更细的状态（比如单独展示唇动训练），复用的方式就不够用了。\n- 【可补充的改进思路】\n  - 把\"类型加状态\"到展示文案的映射集中在一处（一个函数或配置），各处统一调用。\n  - 真正需要新状态时，新增状态值并且只在新类型下使用，存量类型不受影响。\n  - 用 `pipeline_status`（PPL 制作阶段）字段承载更细粒度的制作进度，主状态保持粗粒度。"}, {"no": 24, "title": "「云渲染-长底板」要同步改三处筛选映射，漏改一处就查不到。有没有办法从结构上避免这种问题？", "section": "平台与 PaaS", "answer": "- 现状：新增 `biz_scene_detail=4`（云渲染-长底板）后，三处\"云渲染\"大类的筛选映射要同步纳入 4：service/figure/list.go、deliveryv2/mis_figure_list.go、deliveryreviewfather 的父列表。这在评审中已经被明确为风险点。\n- 根本原因：同一个\"大类包含哪些子类型\"的业务规则，在三个地方各自维护了一份。\n- 【可补充的改进思路】\n  - 收敛到一处：在 DAO 或常量层定义唯一的映射，比如 `CloudRenderSceneDetails = []int{...}`，或者一个 `IsCloudRender(detail)` 函数，三处都引用它。以后新增类型只需改一个地方。\n  - 用测试兜底：写表驱动的单元测试，遍历所有 biz_scene_detail 的取值，断言每个值都属于某个大类；新增枚举值时，如果忘了归类，测试会失败。\n  - 在代码评审的 checklist 中加入\"新增枚举值时检查所有映射\"。\n- 已有措施：S1 到 S7 的全链路联调用例，覆盖了列表筛选的验证。"}, {"no": 25, "title": "15GB 文件上传，为什么并发 18 比并发 12 还慢？", "section": "平台与 PaaS", "answer": "- 压测数据：分片 50MB、并发 12 用时 25 分钟（最优）；50MB、并发 18 用时 32 分钟；5MB、并发 12 用时 33 分钟；90MB、并发 12 超过 40 分钟。\n- 原因分析：\n  - 总带宽是有限的，并发 12 时可能已经接近带宽的上限，继续提高并发不会增加总吞吐。\n  - 并发更多时，TCP 连接之间互相争抢带宽，拥塞和重传增加。\n  - 服务端、网关或爱速搭侧可能有并发处理能力或限流的瓶颈，请求排队、超时重试的次数增加。\n  - 客户端（浏览器）对同一个域名的并发连接数也有限制。\n- 【文档未记录，需本人确认】当时是否定位到具体的瓶颈，是客户端带宽、网关，还是存储写入？上面的原因是根据数据的合理推断，回答时要说明这是推断。\n- 结论：并发和分片大小都存在最优点，要通过实测确定，不是越大越好。"}, {"no": 26, "title": "20T 对话数据冷备到 AFS，如果以后要恢复某个用户的数据，怎么查？", "section": "数据治理", "answer": "- 冷备的组织方式：\n  - 自研的 Go 备份任务 `chat_record_backup`，按分表导出 CSV 写入 AFS（shaolin 集群），参数包括 `-start/-end`（分表区间）、`-limit`、`-concurrency`。\n  - 文件按分表组织，例如 tablet_1339.csv 约 2.13GB，首行 id=1（2023-08-29），末行 id 约为 421000（2025-03-27）。\n  - 两类对话表都是 2048 张分表，按 uid 对 2048 取余路由。\n- 恢复某个用户的数据：\n  1. 用 `uid % 2048` 算出这个用户所在的分表编号，找到对应的 CSV 文件。\n  2. 在文件中按 uid（以及时间范围）过滤，取出这个用户的记录。\n  3. 按需导回数据库，或者导出给需求方。\n- 【文档未记录，需本人确认】是否有现成的恢复工具或流程，以及是否演练过恢复。\n- 【可补充的改进思路】\n  - 单个 CSV 文件有 GB 级，逐行扫描比较慢。可以把冷备数据导入 Hive 或数仓表（按分表编号或日期分区），用 SQL 查询。\n  - 也可以改用 Parquet 这类列式格式，减少存储并加快检索。\n  - 恢复流程写成 SOP，并定期演练。"}, {"no": 27, "title": "分批删除时如果删错了，怎么恢复？", "section": "数据治理", "answer": "- 删除之前已经做了冷备：数据先导出到 AFS，并通过抽样校验文件大小、首尾 id 和时间，确认数据和部署脚本都正常、AFS 的存储量正常，然后才删除。\n- 执行方式：\n  - 按 0-1023 和 1024-2047 两段分表生成删除 SQL，通过 DMS 的\"数据库原生变更\"方式分批执行，执行前已经和 DBA 确认。\n  - 厂内对话删除到 2024-01-01，第三方对话删除到 2025-01-01。\n  - 删除批次分别在 03-11、03-25、03-27 执行，这样某一批删错了，影响范围有限。\n- 恢复路径：从 AFS 的冷备文件中，按分表、时间范围找到被误删的数据，导回数据库。\n- 需要注意的一点：第三方对话的删除截止时间，文档标题写的是 2025-01-01，正文写的是 2024-01-01，两者不一致。回答前要确认实际执行的是哪个时间。\n- 【文档未记录，需本人确认】是否真正演练过从 AFS 恢复数据。\n- 【可补充的改进思路】删除 SQL 带上严格的时间条件，执行前先用相同条件的 SELECT COUNT 核对行数；每批执行完后抽样检查；保留每批的执行记录。"}, {"no": 28, "title": "删除后为什么还要单独做表空间释放？释放时对线上有什么影响？", "section": "数据治理", "answer": "- 原因：InnoDB 删除数据只是把记录标记为删除，空间留在数据页中供以后复用，不会还给操作系统，表文件不会变小。云数据库（GaiaDB）的存储按使用量计费，不释放表空间，存储占用和成本都不会下降。\n- 做法：2026-05-07 做了表空间释放，并再次清理了厂内的对话历史。\n- 对线上的影响（通用原理）：\n  - 释放空间要重建表（OPTIMIZE TABLE，或 ALTER TABLE ... ENGINE=InnoDB），需要拷贝全表数据，IO 和 CPU 的消耗很大，会影响其他查询。\n  - 需要额外的磁盘空间。\n  - 开始和结束时需要获取 MDL 锁，如果有长事务，可能会阻塞。\n  - 会导致主从延迟。\n- 应对：在低峰期执行，分表逐个执行，执行前检查有没有长事务，通过 DMS 执行并和 DBA 确认，同时监控延迟和业务指标。\n- 【文档未记录，需本人确认】具体使用的释放方式、执行时长，以及释放了多少空间。文档没有记录最终释放的容量，被问到时要以实际数据为准。"}, {"no": 29, "title": "这几年你做的工作里，哪一项最能体现你的专家能力？为什么？", "section": "综合", "answer": "- 建议选择对客 PaaS 平台（Pipeline 侧）作为主讲项目，再用 agent-mount 优化作为补充。下面是参考的回答思路。\n- 对客 PaaS 平台能体现专家能力，因为它满足了专家职级关注的几个点：\n  - 复杂度：打通 PaaS、MIS、Pipeline 和架构四方，实现\"选方案 → 上传素材 → 审核 → 制作 → 部署 → 拿到 AK/SK/AgentID\"的线上闭环。\n  - 关键设计决策：\n    - 把公版从客户层级移到模板层级，解决了一个 Agent 归属两个客户的矛盾。\n    - 审核状态不落表、实时聚合，保证只有一个数据源。\n    - stage 只在三处显式推进，加上 RecomputeDelivery 定时巡检兜底，保证状态一致。\n    - 一个形象包可以绑定多个 Agent，在部署层隔离，共享的形象包只读。\n  - 风险控制：明确了上线依赖，架构后端、pipeline 后端、pipeline 前端、paas 按顺序上线；输出了提测文档和上线文档。\n  - 持续演进：在这个架构上继续扩展了端渲染接入、云渲染长底板组件（biz_scene_detail=4，只命中新的链路）、公共资源池。\n- agent-mount 优化体现的是用数据驱动的问题定位和优化能力，以及严谨的灰度和回归：耗时降低约 30 倍，回归覆盖了 10 类组件。\n- 回答时要讲清楚自己在其中的角色和具体的贡献。文档中写的是和师晨瑞共同负责，所以要明确哪些部分是你主导的。"}, {"no": 30, "title": "如果让你重新设计你负责过的某个系统，你会改什么？", "section": "综合", "answer": "- 建议选一个系统，诚实地讲出问题和改进，这能体现你的反思能力。参考：\n- 以端到端评估和形象包生产平台为例：\n  - 问题一，任务状态的健壮性：Worker 先改状态再处理，进程崩溃后任务可能卡在\"生产中\"。重新设计时，会统一采用\"带心跳或超时的任务领取，加上 reconcile 巡检\"的模式，并把 case 维度的状态做到幂等，可以断点续跑。\n  - 问题二，业务规则分散：比如云渲染大类的映射有三处需要同步修改。会把这类规则收敛成一处，并用表驱动的测试兜底。\n  - 问题三，状态复用的可读性：长底板复用了 status 枚举，读取时必须先判断类型。会把展示映射集中管理，或者在设计初期就把\"类型\"和\"阶段\"拆成正交的两个维度。\n- 以 agent-mount 为例：一开始就会按批量查询加缓存来设计数据获取，并对 IN 列表设置分批上限，而不是按挂载项起协程。\n- 回答的结构：当时的约束（工期、需求不确定）→ 现在看到的问题和证据 → 改进方案 → 预期收益。不要否定当时的决策，而是说明随着认识加深，会怎么做得更好。"}]}];

const $ = id => document.getElementById(id);
const all = [];
DATA.forEach((f, fi) => f.questions.forEach(q => all.push({ ...q, fi, file: f.title })));
let list = [], idx = 0, shown = false;

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
// 简单 markdown 渲染：代码块、多级有序/无序列表、段落、加粗、行内代码
function md(src) {
  const lines = src.split('\n');
  let html = '', stack = [], inCode = false, code = [], codeIndent = 0;
  const closeTo = depth => { while (stack.length > depth) html += `</li></${stack.pop().type}>`; };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (inCode) { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = []; inCode = false; }
      else { inCode = true; codeIndent = raw.length - raw.trimStart().length; }
      continue;
    }
    if (inCode) { code.push(raw.slice(Math.min(codeIndent, raw.length - raw.trimStart().length))); continue; }
    const m = raw.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (m) {
      const depth = Math.floor(m[1].length / 2) + 1;
      const type = /\d/.test(m[2]) ? 'ol' : 'ul';
      if (stack.length < depth) {
        while (stack.length < depth) { html += `<${type}><li>`; stack.push({ type }); }
      } else {
        closeTo(depth);
        if (stack[depth - 1].type !== type) { closeTo(depth - 1); html += `<${type}><li>`; stack.push({ type }); }
        else html += '</li><li>';
      }
      html += inline(m[3]);
    } else if (raw.trim() === '') {
      continue;
    } else {
      closeTo(0);
      html += `<p>${inline(raw.trim())}</p>`;
    }
  }
  closeTo(0);
  if (inCode) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
  return html;
}
function titleHtml(t) {
  return esc(t)
    .replace('【高频】', '<span class="badge hot">高频</span>')
    .replace('【专家】', '<span class="badge exp">专家</span>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function applyFilter(keepCurrent) {
  const fi = $('fileSel').value, tag = $('tagSel').value, kw = $('kw').value.trim().toLowerCase();
  const cur = list[idx];
  list = all.filter(q => (fi === '' || q.fi == fi) && (!tag || q.title.includes(tag)) && (!kw || q.title.toLowerCase().includes(kw)));
  idx = 0;
  if (keepCurrent && cur) { const i = list.indexOf(cur); if (i >= 0) idx = i; }
  render();
}

function render() {
  const box = $('content');
  if (!list.length) {
    box.innerHTML = '<div class="empty">没有符合条件的题目</div>';
    ['prev', 'next', 'toggle', 'shuffle'].forEach(id => $(id).disabled = true);
    return;
  }
  ['toggle', 'shuffle'].forEach(id => $(id).disabled = false);
  const q = list[idx];
  shown = $('autoShow').checked;
  box.innerHTML = `
    <div class="meta">
      <span><span class="tag">${esc(q.file)}</span> ${q.section ? `<span class="tag sec">${esc(q.section)}</span>` : ''}</span>
      <span>第 ${idx + 1} / ${list.length} 题（原题号 ${q.no}）</span>
    </div>
    <h2>${q.no}. ${titleHtml(q.title)}</h2>
    <div class="answer ${shown ? '' : 'hidden'}" id="answer">${md(q.answer)}</div>`;
  $('toggle').textContent = shown ? '隐藏答案' : '显示答案';
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === list.length - 1;
  localStorage.setItem('qa_pos', JSON.stringify({ fi: q.fi, no: q.no }));
  window.scrollTo({ top: 0 });
}

function go(step) { const n = idx + step; if (n >= 0 && n < list.length) { idx = n; render(); } }
function toggle() {
  if (!list.length) return;
  shown = !shown;
  $('answer').classList.toggle('hidden', !shown);
  $('toggle').textContent = shown ? '隐藏答案' : '显示答案';
}

$('fileSel').innerHTML = '<option value="">全部分类（' + all.length + ' 题）</option>' +
  DATA.map((f, i) => `<option value="${i}">${esc(f.title)}（${f.questions.length} 题）</option>`).join('');
$('fileSel').onchange = () => applyFilter(false);
$('tagSel').onchange = () => applyFilter(true);
$('kw').oninput = () => applyFilter(true);
$('autoShow').onchange = () => { localStorage.setItem('qa_auto', $('autoShow').checked ? '1' : ''); render(); };
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('toggle').onclick = toggle;
$('shuffle').onclick = () => { if (list.length) { idx = Math.floor(Math.random() * list.length); render(); } };
$('jumpBtn').onclick = () => { const n = parseInt($('jump').value, 10); if (n >= 1 && n <= list.length) { idx = n - 1; render(); } };
document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') $('shuffle').click();
});

$('autoShow').checked = localStorage.getItem('qa_auto') === '1';
