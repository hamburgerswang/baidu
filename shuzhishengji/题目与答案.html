流（stream）并发传输多个请求和响应，帧可以交错发送，解决了 HTTP 层的队头阻塞。\n  - HPACK 头部压缩。\n  - 流的优先级、服务端推送（已基本废弃）。\n- 仍然存在 TCP 层的队头阻塞：所有的流共用一条 TCP 连接，一旦丢包，TCP 要等重传完成才能把后续数据交给上层，所有流都会被阻塞。在丢包率高的网络中，表现甚至可能不如 HTTP/1.1 的多连接。\n- HTTP/3 基于 QUIC（UDP），每个流独立处理丢包，彻底解决了队头阻塞，还支持 0-RTT 建连和连接迁移（切换网络时不断开）。"}, {"no": 8, "title": "【高频】服务间调用超时怎么设置？超时传递（deadline propagation）是什么？", "section": "微服务", "answer": "- 设置超时：\n  - 每个下游调用都必须设置超时，没有超时的调用一旦下游卡住，会耗尽调用方的资源（协程、连接）。\n  - 超时时间参考下游的 P99 延迟再加一些余量；不要一律设置成很大的值。\n  - 区分连接超时和读写超时。\n- 超时传递：\n  - 问题：入口的总预算是 1 秒，但每一层服务都各自设置了 1 秒超时，入口已经超时返回了，下游还在继续执行，白白浪费资源。\n  - 做法：把剩余的截止时间（deadline）随请求一起传递（gRPC 会自动在 metadata 中传递；Go 中用 context.WithTimeout 和 ctx 在调用链中传递）。下游根据剩余时间决定是否还要执行，或者设置更短的超时；剩余时间不够时直接放弃。\n- 重试和超时的配合：重试的总耗时也不能超过上游的预算。"}, {"no": 9, "title": "【专家】重试风暴是怎么产生的？怎么避免（重试预算、退避、只在一层重试）？", "section": "微服务", "answer": "- 产生原因：\n  - 下游变慢或出现故障时，调用方大量重试，请求量成倍增加，下游更加不堪重负，形成恶性循环。\n  - 多层服务都各自重试时，次数相乘：每层重试 3 次，一共 3 层，最底层的服务会收到 3 的 3 次方，即 27 倍的请求。\n- 避免方法：\n  - 只在一层重试：一般只在最靠近故障点的那一层，或者最上层重试，其他层不重试，直接把错误返回给上游。\n  - 重试预算：限制重试请求占总请求的比例（如不超过 10%），超过就不再重试（gRPC 有 retry throttling 机制）。\n  - 指数退避加随机抖动，避免大量请求同时重试。\n  - 只对可以重试的错误重试（超时、503），不对 4xx 重试。\n  - 配合熔断：下游持续失败时直接熔断，停止重试。\n  - 下游返回明确的信号（如 429 加 Retry-After），调用方遵照执行。\n  - 重试的请求必须是幂等的。"}, {"no": 10, "title": "服务网格（Service Mesh、Istio）是什么？Sidecar 有什么代价？", "section": "微服务", "answer": "- 服务网格：把服务间通信的治理能力（服务发现、负载均衡、熔断、重试、超时、mTLS 加密、可观测）从业务代码中剥离出来，放到基础设施层。\n- 架构：\n  - 数据面：每个服务实例旁边部署一个 Sidecar 代理（如 Envoy），拦截所有进出流量。\n  - 控制面：Istio 的 istiod，负责下发配置、证书。\n- 好处：业务代码不需要集成各种 SDK；多语言统一治理；策略可以集中配置和动态生效；默认开启 mTLS。\n- Sidecar 的代价：\n  - 每次调用多经过两跳代理，增加延迟（通常是毫秒级以内）。\n  - 每个 Pod 额外占用 CPU 和内存。\n  - 运维复杂度高，排查问题时多了一层。\n  - Sidecar 的升级和注入管理。\n- 演进：Ambient Mesh（没有 Sidecar，在节点级处理）、基于 eBPF 的方案，用来降低代价。"}, {"no": 11, "title": "API 网关的职责有哪些？", "section": "微服务", "answer": "- 统一入口：对外暴露统一的域名和接口，隐藏内部服务的拆分。\n- 路由：按路径、域名、header 转发到后端服务，支持灰度和 AB 分流。\n- 安全：鉴权（token、AK/SK、OAuth）、防重放、IP 黑白名单、WAF、防刷。\n- 流量治理：限流、熔断、超时、重试、负载均衡。\n- 协议转换：HTTP 转 gRPC，处理 WebSocket、SSE 这类长连接。\n- 请求和响应处理：参数校验、header 改写、跨域处理、压缩、响应聚合（BFF）。\n- 可观测：访问日志、监控指标、生成并透传 trace_id。\n- 注意：网关只做通用的横切功能，不要承载业务逻辑。"}, {"no": 12, "title": "【高频】接口版本管理和向后兼容怎么做？", "section": "微服务", "answer": "- 版本标识：在 URL 中（/v1/、/v2/）、header 中，或者参数中标明版本；不兼容的变更必须升级版本号。\n- 向后兼容的规则：\n  - 只新增，不删除、不修改：新增可选的请求参数，并设置合理的默认值；响应中只新增字段。\n  - 不改变已有字段的类型和含义；枚举值只增加，调用方要能处理不认识的枚举值。\n  - 错误码保持稳定。\n- 新老版本并存：新版本上线后，旧版本继续保留，给调用方留出迁移时间；统计旧版本的流量，推动调用方升级，到期后下线（下线前要先拒绝并通知）。\n- 契约测试：用接口契约（OpenAPI、Protobuf）做兼容性检查，CI 中自动检测是否有不兼容的变更。\n- 可举例：mount 接口新增 message_id、log_id、content_id 等可选参数，不传时保持原有行为；646 的老协议请求导致 panic 后，直接拒绝老协议流量。"}, {"no": 13, "title": "【专家】跨多个服务的需求，上线顺序怎么确定？怎么避免上线依赖导致故障？", "section": "微服务", "answer": "- 确定顺序：\n  - 画出依赖关系：谁调用谁、新字段由谁产生、由谁消费。\n  - 原则是被依赖的一方先上线（提供方先于调用方），新字段的消费方要能兼容\"字段不存在\"的情况。\n  - 数据库变更先于代码上线（先加字段，代码再读写），删除字段则反过来（代码先停止使用，再删除字段）。\n- 避免故障：\n  - 每个服务都要向前和向后兼容：新代码在依赖方还没上线时也能正常运行（新参数可选、新功能用开关控制）。\n  - 功能开关：所有服务的代码都上线后，再统一打开开关，把\"代码发布\"和\"功能生效\"分开。\n  - 每一步都可以单独回滚，回滚不会破坏其他服务。\n  - 写进上线文档：顺序、负责人、验证方法、回滚方案，按 checklist 逐步执行。\n- 可举例：\n  - RFQ 线索链路改动 5 个服务，按 704 → 676 → 722 → 646 的顺序发布，704 必须先上线，因为下游会开始传递新字段。\n  - 对客 PaaS 按架构后端 → pipeline 后端 → pipeline 前端 → paas 的顺序上线；pipeline 后端如果晚于 paas 上线，对外接口的调用会失败。"}, {"no": 14, "title": "配置中心怎么做到配置热更新？", "section": "微服务", "answer": "- 推送通知：客户端用长轮询（如 Apollo、Nacos）或长连接监听配置变更；服务端在配置变化时立即响应，客户端再拉取最新的配置。\n- 客户端更新：拉取到新配置后，原子地替换内存中的配置对象（Go 中可以用 atomic.Value 存储配置指针，读取时不加锁），并触发注册的回调（如重建连接池、更新限流阈值）。\n- 本地缓存：配置写入本地文件，配置中心不可用时用本地缓存启动，保证可用性。\n- 校验：新配置先校验格式和取值范围，校验失败就继续使用旧配置，并告警。\n- 灰度：先推送给部分实例，观察无误后再全量。\n- 注意：不是所有配置都能热更新（如监听端口），这类配置需要重启生效，要在文档中说明。"}, {"no": 15, "title": "服务的健康检查和优雅退出怎么做？", "section": "微服务", "answer": "- 健康检查：\n  - 存活检查（liveness）：进程是否还活着、是否卡死，失败则重启实例。\n  - 就绪检查（readiness）：是否可以接收流量（依赖是否就绪、缓存是否已经预热），失败则从负载均衡中摘除，但不重启。\n  - 检查逻辑要轻量；不要把下游依赖的状态放进存活检查中，否则下游一出故障，所有实例都会被重启。\n- 优雅退出：\n  1. 收到 SIGTERM 信号后，先把就绪检查标记为失败，或者从注册中心注销，停止接收新流量。\n  2. 等待负载均衡和注册中心生效（几秒钟）。\n  3. 调用 `http.Server.Shutdown(ctx)`，等待处理中的请求完成（设置最长等待时间）。\n  4. 停止后台的 Worker（停止拉取新任务，完成当前的任务，或者把任务放回队列）。\n  5. 关闭数据库、消息队列等连接，刷新日志。\n- 长连接（SSE、WebSocket）：要通知客户端重连，或者等待连接结束，设置强制关闭的时间。"}, {"no": 16, "title": "【高频】链路追踪的原理是什么？traceId 和 spanId 怎么生成和传递？", "section": "微服务", "answer": "- 原理（参考 Google Dapper）：\n  - 一次请求经过的所有服务共用一个 traceId。\n  - 每个操作单元是一个 span，有自己的 spanId，并记录父 spanId，由此组成一棵调用树。\n  - span 记录开始和结束时间、服务名、操作名、标签、错误信息，异步上报到收集端，再进行存储和展示。\n- 生成：\n  - traceId 在入口处生成（随机的 128 位，或者带时间和机器信息），全局唯一。\n  - spanId 在每个 span 创建时生成（随机 64 位）。\n  - 如果上游已经传来了 trace 上下文，就沿用上游的 traceId，把上游的 spanId 作为父 spanId。\n- 传递：\n  - 跨进程：通过 HTTP 头（W3C 的 traceparent，或 B3 格式）、RPC 的 metadata、消息队列的消息头。\n  - 进程内：通过 context 传递。\n  - 由框架和中间件自动注入和提取，不依赖业务代码手动传递。\n- 采样：通过控制采样率来平衡开销和覆盖度。"}, {"no": 17, "title": "【高频】CAP 定理是什么？BASE 理论是什么？", "section": "分布式理论", "answer": "- CAP：一个分布式系统不可能同时满足以下三点：\n  - 一致性（C）：所有节点在同一时刻看到的数据相同。\n  - 可用性（A）：每个请求都能在合理时间内得到非错误的响应。\n  - 分区容错性（P）：网络分区（节点之间无法通信）时，系统仍能继续运行。\n- 网络分区在分布式系统中无法避免，所以 P 必须保证，实际上是在发生分区时于 C 和 A 之间做选择：\n  - CP：发生分区时，拒绝部分请求以保证一致性（如 etcd、ZooKeeper、HBase）。\n  - AP：发生分区时，继续提供服务，允许数据暂时不一致（如 Cassandra、Eureka、DNS）。\n- BASE：AP 方向的实践原则。\n  - 基本可用（Basically Available）：出现故障时允许损失部分功能或性能。\n  - 软状态（Soft state）：允许存在中间状态。\n  - 最终一致（Eventually consistent）：经过一段时间后，数据最终会达成一致。\n- 互联网业务大多选择 BASE 加最终一致；涉及金额、库存的核心数据才追求强一致。"}, {"no": 18, "title": "【高频】Raft 协议的选主、日志复制流程是什么？", "section": "分布式理论", "answer": "- 角色：Leader（领导者）、Follower（跟随者）、Candidate（候选者）。时间被划分为任期（term），每个任期最多只有一个 Leader。\n- 选主：\n  - Follower 在选举超时时间（随机 150 到 300ms，随机是为了避免同时发起选举）内没有收到 Leader 的心跳，就把任期加一，变成 Candidate，投票给自己，并向其他节点请求投票。\n  - 其他节点在同一个任期内只投一票，并且只投给日志至少和自己一样新的候选者。\n  - 获得多数票的候选者成为 Leader，开始定期发送心跳。\n  - 选票被瓜分时，超时后重新发起选举。\n- 日志复制：\n  - 客户端的写请求只发给 Leader；Leader 追加日志条目，并行发送给 Follower（AppendEntries）。\n  - 多数节点写入成功后，这条日志就被提交，Leader 把它应用到状态机，然后返回给客户端。\n  - Leader 在后续的心跳中告诉 Follower 已提交的位置，Follower 再应用。\n  - 发现日志不一致时，Leader 从后往前找到一致的位置，用自己的日志覆盖 Follower 的日志。\n- 安全性：只有拥有全部已提交日志的节点才能当选为 Leader，所以已提交的数据不会丢失。"}, {"no": 19, "title": "【专家】Raft 和 Paxos 的区别是什么？脑裂怎么避免？", "section": "分布式理论", "answer": "- Paxos：\n  - Basic Paxos 只对单个值达成共识，分为 Prepare 和 Accept 两个阶段，由 Proposer、Acceptor、Learner 三种角色参与。\n  - Multi-Paxos 通过选出一个稳定的 Leader 来优化，但论文中对工程实现的描述较少，难以理解和实现，各家的实现差异很大。\n- Raft：\n  - 以可理解性为设计目标，把问题拆分成选主、日志复制、安全性三个子问题。\n  - 强 Leader（日志只从 Leader 流向 Follower）、日志连续（不允许空洞）。\n  - 工程实现成熟（etcd、TiKV、Consul）。\n  - 能力上和 Multi-Paxos 基本等价，但约束更多（日志必须按顺序提交），灵活性稍差。\n- 脑裂（同时出现两个 Leader）的避免：\n  - 多数派机制：成为 Leader 必须获得超过半数的票，网络分区后最多只有一个分区拥有多数节点，少数派的分区无法选出新 Leader，也无法提交写入。\n  - 任期号：旧 Leader 恢复后，发现更高的任期号会立即退位成 Follower，它的请求也会被拒绝。\n  - 读请求的一致性：用 ReadIndex 或租约（lease）机制，防止旧 Leader 返回过期的数据（使用租约机制时依赖时钟的准确性）。\n  - 节点数取奇数（3 或 5 个）。"}, {"no": 20, "title": "一致性哈希的原理是什么？虚拟节点有什么作用？", "section": "分布式理论", "answer": "- 普通哈希取模的问题：节点数量变化时（从 N 变成 N+1），几乎所有 key 的映射都会改变，导致大规模的数据迁移或缓存失效。\n- 一致性哈希：\n  - 把哈希值空间组织成一个环（0 到 2^32-1），节点按自身的哈希值放在环上。\n  - key 也按哈希值落在环上，顺时针找到的第一个节点就是它所属的节点。\n  - 增加或删除一个节点时，只影响它和相邻节点之间那一段的 key，迁移量约为 1/N。\n- 虚拟节点：\n  - 节点少的时候，在环上的分布不均匀，导致数据倾斜。\n  - 让每个物理节点在环上对应多个虚拟节点（如 100 到 200 个），分布就更均匀。\n  - 节点下线时，它的负载会分散到多个节点上，而不是全部压到相邻的一个节点。\n  - 还可以按机器的性能设置不同数量的虚拟节点，实现加权。\n- 应用：分布式缓存的分片、负载均衡的会话粘性、分布式存储。"}, {"no": 21, "title": "Gossip 协议的原理和适用场景是什么？", "section": "分布式理论", "answer": "- 原理：每个节点周期性地随机选择几个其他节点，交换自己知道的信息（节点状态、元数据），信息像流言一样在集群中扩散，经过 O(log N) 轮后传遍整个集群。\n- 方式：推（push）、拉（pull）、推拉结合；用版本号或时间戳解决冲突，旧信息不会覆盖新信息。\n- 特点：\n  - 去中心化，没有单点。\n  - 容错性好：部分节点故障或网络不稳定时仍然能够传播。\n  - 扩展性好：每个节点的通信开销固定。\n  - 缺点：最终一致，收敛需要时间；存在冗余消息。\n- 适用场景：集群成员管理和故障检测（Consul 使用的 Serf、Cassandra、Redis Cluster 节点之间的状态同步）、元数据传播。不适合强一致的场景。"}, {"no": 22, "title": "【专家】线性一致性、顺序一致性、最终一致性有什么区别？", "section": "分布式理论", "answer": "- 线性一致性（Linearizability，最强）：\n  - 所有操作看起来像在一个单一副本上按某个全局顺序依次执行，并且这个顺序符合真实时间：一个操作完成后，之后开始的所有操作都能看到它的结果。\n  - 实现代价高（需要共识协议，读写都要经过 Leader 确认），如 etcd 的线性一致读。\n- 顺序一致性（Sequential Consistency）：\n  - 所有进程看到的操作顺序相同，而且每个进程自己的操作顺序保持不变，但不要求符合真实时间（一个操作完成后，其他进程可能暂时还看不到它）。\n- 因果一致性：只保证有因果关系的操作按顺序被看到，并发的操作可以按不同顺序被看到。\n- 最终一致性（最弱）：没有新的写入时，经过一段时间后所有副本会达到一致；在这之前可能读到旧的值，不同客户端看到的顺序也可能不同。\n- 会话级的保证（介于两者之间，工程中常用）：读己之写（自己写入的数据自己一定能读到）、单调读（不会读到比之前更旧的数据）。\n- 选择：根据业务对一致性的需求，选择满足要求的最弱级别，以换取性能和可用性。"}, {"no": 23, "title": "【高频】分布式事务有哪些方案（2PC、3PC、TCC、Saga、本地消息表、事务消息）？", "section": "分布式事务", "answer": "- 强一致：\n  - 2PC（两阶段提交）：协调者先让所有参与者准备（prepare），全部成功后再统一提交（commit），否则统一回滚。如数据库的 XA 事务、Seata 的 AT 模式（基于类似 2PC 的思想）。\n  - 3PC：在 2PC 的基础上增加 CanCommit 阶段和超时机制，减少阻塞，但仍然无法完全解决一致性问题，实际使用很少。\n- 最终一致（业务中更常用）：\n  - TCC：业务层实现 Try（预留资源）、Confirm（确认）、Cancel（取消）三个接口。性能好、侵入性强。\n  - Saga：长事务拆成一系列本地事务，每一步都有对应的补偿操作，失败时按相反顺序执行补偿。适合流程长、跨多个服务的业务。\n  - 本地消息表：业务数据和消息在同一个本地事务中写入，再由后台任务投递消息，下游消费后执行自己的事务。\n  - 事务消息（如 RocketMQ）：先发送半消息，执行本地事务，再根据结果提交或回滚消息；MQ 会回查事务状态。\n  - 最大努力通知加对账：适合跨公司的场景（如支付回调）。\n- 选择：能避免分布式事务就避免（调整服务边界、让数据在同一个库）；需要时优先选择最终一致的方案。"}, {"no": 24, "title": "【高频】2PC 有什么问题？", "section": "分布式事务", "answer": "- 同步阻塞：在准备和提交阶段，所有参与者都持有锁、等待协调者的指令，资源被长时间锁住，性能差。\n- 协调者单点：协调者在发出准备请求后宕机，参与者会一直阻塞，不知道应该提交还是回滚。\n- 数据不一致：提交阶段，如果只有部分参与者收到了 commit（网络问题或协调者中途宕机），就会出现一部分提交、另一部分没有提交的情况。\n- 极端情况：协调者和某个参与者在提交阶段同时宕机，事务的最终状态无法确定。\n- 性能：多次网络往返，加上长时间持有锁，无法满足高并发的需求。\n- 所以在互联网高并发的场景中很少直接使用 XA 事务，多采用最终一致性方案。"}, {"no": 25, "title": "【专家】TCC 的空回滚、悬挂、幂等问题怎么处理？", "section": "分布式事务", "answer": "- 幂等：网络重试会导致 Confirm 或 Cancel 被重复调用。处理方式是用事务控制表记录每个分支事务的状态（全局事务 ID 加分支 ID），已经执行过的直接返回成功。\n- 空回滚：Try 请求因为网络原因没有到达参与者，但协调者超时后发起了 Cancel，参与者在没有执行过 Try 的情况下收到了 Cancel。处理方式：Cancel 执行时先查询事务控制表，发现没有 Try 的记录，就插入一条\"已回滚\"的记录，直接返回成功，不执行回滚逻辑。\n- 悬挂：Cancel（空回滚）先执行完，迟到的 Try 才到达，执行后预留了资源，但再也不会有 Confirm 或 Cancel，资源被永久占用。处理方式：Try 执行前检查事务控制表，如果已经有\"已回滚\"的记录，就拒绝执行 Try。\n- 实现：事务控制表以（全局事务 ID，分支 ID）为唯一键，状态包括已尝试、已确认、已取消，在业务操作的同一个本地事务中更新。Seata 的 TCC 模式已经内置了这套机制。"}, {"no": 26, "title": "Saga 模式的补偿怎么设计？", "section": "分布式事务", "answer": "- 每个正向操作 Ti 都设计一个对应的补偿操作 Ci，在语义上撤销 Ti 的效果（如创建订单对应取消订单，扣减库存对应回补库存，扣款对应退款）。\n- 补偿操作的要求：\n  - 幂等：可能被重复执行。\n  - 可交换：补偿可能比正向操作先到达，要能处理（类似 TCC 的空回滚）。\n  - 一定要能执行成功，失败时持续重试，最终交给人工处理。\n- 编排方式：\n  - 协同式（choreography）：各服务通过事件驱动，一个服务完成后发布事件，下一个服务订阅后执行。去中心化，但流程不直观，难以追踪。\n  - 编排式（orchestration）：由中心的编排器（状态机）依次调用各服务，失败时按相反顺序调用补偿。流程清晰，容易监控，更常用。\n- 注意隔离性：Saga 没有隔离性，中间状态对外可见（如订单已创建但还没有付款）。可以通过语义锁（状态字段标记为\"处理中\"）、业务上的约束来处理。\n- 无法补偿的操作（如已经发出的短信），要放在流程的最后执行。"}, {"no": 27, "title": "【高频】本地消息表方案的流程是什么？", "section": "分布式事务", "answer": "1. 业务服务在同一个本地事务中，同时写入业务数据和一条消息记录（状态为待发送），利用本地事务保证两者要么都成功，要么都失败。\n2. 事务提交后，立即尝试把消息投递到 MQ（或直接调用下游）；投递成功后，把消息状态改为已发送。\n3. 后台定时任务扫描超时仍未发送成功的消息，重新投递，有最大重试次数，超过后告警。\n4. 下游服务消费消息，执行自己的本地事务；必须保证幂等（按消息 ID 去重），因为消息可能被重复投递。\n5. 如果需要，下游处理完后回调或发送确认消息。\n- 优点：实现简单，不依赖 MQ 的事务特性，可靠性高。\n- 缺点：业务库中多了一张消息表；有定时扫描的开销；最终一致有一定延迟。"}, {"no": 28, "title": "【专家】跨系统的订单状态如何最终一致？对账和定时巡检怎么设计？", "section": "分布式事务", "answer": "- 设计原则：\n  - 每种状态都有唯一的权威数据源：订单系统拥有订单状态，支付系统拥有支付状态，制作系统拥有制作状态。其他系统只保存引用，或者保存一份可以重新计算的副本。\n  - 状态变更通过事件或回调通知相关方，处理过程要幂等，状态只能单向推进。\n- 实时链路：回调和消息（可能丢失、可能乱序）。乱序的处理方式：带上版本号或时间戳，只接受比当前状态更新的变更。\n- 兜底一，定时巡检（reconcile）：定期扫描处于中间状态时间过长的订单，主动查询各个子系统的最新状态，重新计算订单状态并修复；无法自动修复的告警交给人工处理。\n- 兜底二，对账：按天（或按小时）对比两个系统的数据（如订单数据和支付流水），比较数量、金额、状态，生成差异报告，再按规则自动修复或人工处理。\n- 可举例：对客 PaaS 交付中，审核状态实时聚合，形象和声音状态以各自的源表为准；交付 stage 只在三处显式推进，并有 RecomputeDelivery 定时巡检兜底；部署是否完成以 agent/info 的 warmup_num 为准。"}, {"no": 29, "title": "【高频】分布式锁有哪些实现方式？各有什么问题？", "section": "分布式锁与幂等", "answer": "- 数据库：\n  - 用唯一索引插入一条记录表示加锁，删除记录表示解锁；或者用 `SELECT ... FOR UPDATE` 行锁。\n  - 简单，不需要额外组件；但性能差，加锁的进程崩溃后没有自动释放的机制（需要额外设置过期时间并清理），不适合高并发。\n- Redis：\n  - `SET key value NX PX 过期时间`。\n  - 性能高，有过期时间自动释放。\n  - 问题：锁过期了但业务还没执行完；主从异步复制，主节点宕机时锁可能丢失；需要防止误删别人的锁。\n- ZooKeeper：\n  - 创建临时顺序节点，序号最小的获得锁，其他节点监听前一个节点。\n  - 客户端会话断开时临时节点自动删除，锁可靠，而且是公平锁。\n  - 性能比 Redis 低，需要维护 ZooKeeper 集群。\n- etcd：基于租约（lease）加事务（比较版本号），强一致，有自动续约，适合 Go 和 k8s 生态。\n- 选择：大多数业务（防止并发重复执行、轮询分配）用 Redis 就够了；对正确性要求极高时，用 etcd 或 ZooKeeper，再加上 fencing token。"}, {"no": 30, "title": "【高频】Redis 分布式锁怎么实现？锁过期但业务没执行完怎么办？", "section": "分布式锁与幂等", "answer": "- 加锁：`SET lock_key 唯一值 NX PX 30000`，唯一值使用请求 ID 或 UUID，用来标识锁的持有者。\n- 解锁：用 Lua 脚本原子地执行\"判断值是否等于自己的唯一值，相等才删除\"，防止误删其他持有者的锁（比如自己的锁已经过期，被别人获取了）：\n```lua\nif redis.call(\"get\", KEYS[1]) == ARGV[1] then return redis.call(\"del\", KEYS[1]) else return 0 end\n```\n- 锁过期但业务没执行完：\n  - 看门狗续期：加锁成功后，启动后台协程，定期（如每过期时间的三分之一）检查自己是否还持有锁，持有就延长过期时间；业务结束或进程退出后停止续期（Redisson 的 watchdog 就是这样实现的）。\n  - 根据业务的最长耗时设置足够长的过期时间。\n  - 在业务的关键写入步骤中再次校验（fencing token、乐观锁），防止锁失效后两个持有者同时写入。\n- 可重入：用 Hash 记录持有者和重入次数。\n- 获取锁失败：可以自旋重试（带退避），也可以直接返回失败。"}, {"no": 31, "title": "【专家】Redlock 的争议是什么？fencing token 是什么？", "section": "分布式锁与幂等", "answer": "- Redlock：\n  - 部署 N 个（如 5 个）独立的 Redis 主节点，客户端依次向它们申请加锁。\n  - 在锁的有效期内，在多数节点（大于等于 3 个）上加锁成功，才算获得锁。\n  - 目的是解决单个 Redis 主从切换时锁丢失的问题。\n- 争议（Martin Kleppmann 的批评）：\n  - 依赖时钟：如果某个节点的时钟发生跳变，锁会提前过期，从而出现两个客户端同时持有锁的情况。\n  - 进程停顿：客户端获得锁后发生长时间的 GC 停顿，停顿期间锁过期，被其他客户端获取；它恢复后仍然以为自己持有锁，继续写入。任何基于过期时间的锁都无法避免这个问题。\n  - 结论：如果是为了效率（避免重复执行，偶尔失败也可以接受），用单个 Redis 就够了；如果是为了正确性，Redlock 也不够，需要 fencing token。\n- fencing token：\n  - 每次获取锁时，锁服务返回一个单调递增的令牌号。\n  - 客户端写入存储时带上这个令牌号，存储服务只接受比已经见过的令牌号更大的写入，拒绝旧令牌的写入。\n  - 这样，即使旧的持有者在锁过期后恢复并继续写入，它的写入也会被拒绝。\n  - ZooKeeper 节点的 zxid、etcd 的 revision 可以作为 fencing token。"}, {"no": 32, "title": "基于 etcd/ZooKeeper 的分布式锁和 Redis 锁有什么区别？", "section": "分布式锁与幂等", "answer": "- 一致性：\n  - etcd 和 ZooKeeper 基于共识协议（Raft、ZAB），写入要经过多数节点确认，节点宕机也不会丢锁。\n  - Redis 主从是异步复制的，主节点宕机后切换到从节点，锁可能丢失。\n- 锁的释放：\n  - etcd 和 ZooKeeper 把锁和客户端的会话或租约绑定，客户端崩溃或网络断开后，锁会自动释放，并且有续约机制（etcd 的 KeepAlive）。\n  - Redis 依靠过期时间，需要自己实现续期。\n- 等待机制：\n  - etcd 和 ZooKeeper 可以监听（watch）前一个节点的删除事件，按顺序获取锁，是公平锁，不需要轮询。\n  - Redis 一般需要自旋重试。\n- 防护：etcd 和 ZooKeeper 天然提供单调递增的版本号，可以用作 fencing token。\n- 性能：Redis 的性能更高、延迟更低；etcd 和 ZooKeeper 写入要经过共识，吞吐较低，不适合高频的加锁场景。\n- 选择：对正确性要求高、加锁频率低（如选主、关键任务的互斥）用 etcd 或 ZooKeeper；高频、对少量重复可以容忍的场景用 Redis。"}, {"no": 33, "title": "【高频】接口幂等怎么设计？幂等 key 怎么选？", "section": "分布式锁与幂等", "answer": "- 幂等：同一个请求执行一次和执行多次的效果相同。网络重试、用户重复点击、消息重复投递都需要幂等保证。\n- 常见方案：\n  - 唯一索引：业务唯一键（如订单号，或者用户 ID 加活动 ID）建唯一索引，重复插入会失败，捕获这个错误后返回已有的结果。\n  - Token 机制：客户端先获取一个一次性 token，提交时带上，服务端用 Redis 的 `SET NX` 或 `DEL` 操作的返回值判断 token 是否已被使用。\n  - 状态机加条件更新：`UPDATE ... SET status=已支付 WHERE id=? AND status=待支付`，状态只能单向流转，重复请求影响的行数为 0。\n  - 乐观锁：使用版本号。\n  - 去重表：记录已经处理过的请求 ID。\n- 幂等 key 的选择：\n  - 要能唯一标识\"同一个业务操作\"：客户端生成的请求 ID，或者业务唯一键（订单号、支付流水号、消息 ID、回调事件 ID）。\n  - 不能用时间戳这类每次都不同的值。\n  - 要考虑 key 的作用范围（如同一个用户的同一个操作）和保留时间。\n- 返回结果：重复请求应该返回第一次请求的结果，而不是报错。"}, {"no": 34, "title": "消息重复消费怎么保证幂等？", "section": "分布式锁与幂等", "answer": "- 原因：MQ 一般只能保证\"至少一次\"投递。消费成功了但提交 offset（或 ACK）失败、消费者发生 rebalance、生产者重发，都会导致消息被重复消费。\n- 方法：\n  - 业务天然幂等：如\"把状态设置为 X\"、按主键覆盖写入。\n  - 唯一约束：用消息中的业务唯一键或消息 ID 作为唯一索引插入，重复插入会失败，直接跳过。\n  - 去重记录：在消费的本地事务中，同时写入\"已处理的消息 ID\"（数据库），或者处理前用 Redis 的 SET NX 判断（要注意 Redis 和数据库之间的一致性问题，最好放在数据库的同一个事务中）。\n  - 条件更新：状态机只能单向推进，旧消息不会覆盖新状态（带版本号）。\n- 注意：去重记录要设置保留时间，并且要比消息可能重复的时间窗口更长。"}, {"no": 35, "title": "【高频】为什么要用消息队列？会带来哪些问题？", "section": "消息队列", "answer": "- 作用：\n  - 异步：把非核心步骤（通知、打点、写入统计数据）移出主链路，降低响应时间。\n  - 解耦：生产者不需要知道有哪些消费者，新增消费者不用修改生产者。\n  - 削峰：突发流量先进入队列，消费者按自己的能力匀速处理。\n  - 广播：一条消息被多个系统消费。\n  - 顺序和缓冲：日志收集、数据同步（binlog 发送到 MQ 再分发到下游）。\n- 带来的问题：\n  - 系统复杂度增加：MQ 本身的高可用、运维。\n  - 消息丢失、重复消费、乱序。\n  - 消息积压。\n  - 一致性：异步带来数据延迟，需要最终一致性方案。\n  - 排查链路变长。\n- 可举例：数字人\"最近使用\"的写入链路，由 646 通过 bigpipe 发出事件，697 订阅后写入 Redis 和 MySQL，使用行为的记录不阻塞对话主流程。"}, {"no": 36, "title": "【高频】Kafka 为什么吞吐高？分区、副本、ISR 是什么？", "section": "消息队列", "answer": "- 吞吐高的原因：\n  - 顺序写磁盘（追加写日志），并利用操作系统的页缓存。\n  - 零拷贝（sendfile）发送数据给消费者。\n  - 批量发送和批量压缩。\n  - 分区并行：一个 topic 分成多个分区，分布在不同的 broker 上，并行读写。\n  - 消费者按 offset 拉取，broker 不需要维护每条消息的消费状态。\n- 分区（partition）：topic 的物理分片，每个分区是一个有序的、只能追加的日志。分区是并行和扩展的单位，消息只在分区内有序。\n- 副本（replica）：每个分区有多个副本，分布在不同的 broker 上，其中一个是 Leader，负责读写，其他是 Follower，从 Leader 同步数据。\n- ISR（In-Sync Replicas）：和 Leader 保持同步的副本集合。Follower 落后太多（超过 replica.lag.time.max.ms）就被移出 ISR。Leader 故障时，只从 ISR 中选举新的 Leader，以保证不丢失已提交的数据。\n- HW（高水位）：ISR 中所有副本都已经同步到的位置，消费者只能读取到 HW 之前的消息。"}, {"no": 37, "title": "【高频】Kafka 如何保证消息不丢失？", "section": "消息队列", "answer": "- 生产者端：\n  - acks=all（-1）：消息被 ISR 中所有副本写入后才算成功。\n  - 设置重试次数（retries），开启幂等（enable.idempotence=true）防止重试导致重复。\n  - 使用带回调的发送，处理发送失败的情况；不要发出去就不管了。\n- broker 端：\n  - replication.factor 大于等于 3。\n  - min.insync.replicas 大于等于 2：ISR 中的副本数不足时拒绝写入，防止只写入一个副本。\n  - unclean.leader.election.enable=false：禁止从不在 ISR 中的副本选出 Leader（否则会丢数据）。\n- 消费者端：\n  - 关闭自动提交 offset，处理成功之后再手动提交（先提交再处理，处理失败就会丢消息）。\n  - 处理失败时重试，或者发送到死信队列。\n- 代价：可靠性越高，延迟越高、吞吐越低，需要根据业务权衡（日志类数据可以使用 acks=1）。"}, {"no": 38, "title": "【高频】消息的顺序性怎么保证？", "section": "消息队列", "answer": "- Kafka 只保证分区内有序，所以需要顺序的消息要发送到同一个分区：用业务 key（订单 ID、用户 ID、会话 ID）作为消息的 key，按 key 哈希分区，同一个 key 的消息会进入同一个分区。\n- 生产者：\n  - 开启幂等，并且 max.in.flight.requests.per.connection 不超过 5，这样重试也不会打乱顺序（老版本的 Kafka 需要设置为 1）。\n  - 同一个 key 的消息由同一个生产者按顺序发送。\n- 消费者：\n  - 一个分区同时只被一个消费者消费。\n  - 消费者内部如果用多协程并行处理，要按 key 把消息分配到固定的协程（按 key 哈希到内存队列），否则会打乱顺序。\n- 全局有序：只能使用一个分区，吞吐很低，一般不推荐。\n- 业务层兜底：消息中带上版本号或序号，消费者丢弃旧版本的消息，或者检测到乱序时暂存，等待前面的消息。"}, {"no": 39, "title": "【高频】消息积压怎么处理？", "section": "消息队列", "answer": "- 先定位原因：\n  - 消费者变慢了：下游变慢、处理逻辑有问题、消费者报错后不断重试。\n  - 生产量突增。\n  - 消费者实例挂了，或者频繁 rebalance。\n- 应急处理：\n  - 修复消费者的问题（下游故障就先降级或熔断）。\n  - 扩容消费者：增加消费者实例数，但不能超过分区数（多出的消费者会空闲）。\n  - 分区数不够时，临时新建一个分区更多的 topic，写一个转发程序把积压的消息快速转发过去，再用大量消费者并行处理。\n  - 在消费者内部提高并发：批量拉取、批量写入下游、按 key 分配到多个协程并行处理（注意顺序要求）。\n  - 非核心的消息可以先跳过（记录 offset，之后再补处理）。\n- 预防：\n  - 监控消费延迟（lag）并告警。\n  - 根据峰值规划分区数和消费能力。\n  - 消费逻辑要轻量，耗时的操作异步处理。"}, {"no": 40, "title": "Kafka 的消费者组和 rebalance 是什么？rebalance 有什么问题？", "section": "消息队列", "answer": "- 消费者组：同一个组内的消费者共同消费一个 topic，每个分区只分配给组内的一个消费者，实现负载均衡；不同的组之间互不影响，各自消费全部消息（实现广播）。\n- rebalance：组内成员或分区发生变化时（消费者加入或离开、心跳超时、处理时间超过 max.poll.interval.ms、分区数增加），由协调者重新分配分区和消费者的对应关系。\n- 问题：\n  - 传统的 rebalance（eager 协议）期间，整个组都要停止消费（stop the world），造成消费中断和延迟抖动。\n  - rebalance 前已经处理但还没提交 offset 的消息，会被重复消费。\n  - 频繁的 rebalance（如处理耗时太长被误判为宕机）会形成恶性循环。\n- 优化：\n  - 合理设置 session.timeout.ms、heartbeat.interval.ms、max.poll.interval.ms；减小 max.poll.records，让单批的处理耗时可控。\n  - 使用增量协作式 rebalance（CooperativeStickyAssignor），只迁移需要变动的分区。\n  - 静态成员（group.instance.id），实例重启时不触发 rebalance。\n  - 消费逻辑要幂等，以应对重复消费。"}, {"no": 41, "title": "【专家】Kafka 的 Exactly-Once 语义是怎么实现的？", "section": "消息队列", "answer": "- 三个组成部分：\n  - 幂等生产者：每个生产者有一个 PID，每个分区的每条消息都带有递增的序列号；broker 按（PID，分区，序列号）去重，生产者重试时不会重复写入。但只能保证单个会话、单个分区内不重复。\n  - 事务：生产者设置 transactional.id，可以把\"写入多个分区的消息，加上提交消费者的 offset\"放进同一个原子事务中，要么全部可见，要么全部不可见。由事务协调者和事务日志实现两阶段提交，并在分区中写入事务标记。\n  - 消费者设置 isolation.level=read_committed：只读取已经提交的事务消息，跳过已中止的事务消息。\n- 适用范围：只在 Kafka 内部的\"读取、处理、写回 Kafka\"链路中（如 Kafka Streams、Flink 的 Kafka 连接器）实现端到端的 exactly-once。\n- 局限：消费消息后写入外部系统（数据库、调用接口）时，Kafka 的事务管不到外部系统。这种情况仍然需要\"至少一次加消费端幂等\"，或者把 offset 和业务数据放在同一个数据库事务中保存。\n- 代价：事务会增加延迟、降低吞吐。"}, {"no": 42, "title": "RocketMQ 和 Kafka 有什么区别？事务消息怎么用？", "section": "消息队列", "answer": "- 区别：\n  - 定位：Kafka 主要面向大数据和日志场景，吞吐量极高；RocketMQ 主要面向业务消息，功能更丰富。\n  - 功能：RocketMQ 原生支持事务消息、延迟消息（5.x 版本支持任意时间的延迟）、消息过滤（tag）、消息重试和死信队列、按 key 查询消息；Kafka 的这些功能大多需要自己实现。\n  - 存储：Kafka 每个分区一个文件，分区多时随机 IO 增加，性能下降；RocketMQ 所有消息写入同一个 CommitLog，再建立 ConsumeQueue 索引，topic 和队列很多时性能更稳定。\n  - 生态：Kafka 在流处理（Flink、Spark）生态中的集成更好。\n- 事务消息的流程：\n  1. 生产者发送半消息（对消费者不可见）。\n  2. 执行本地事务。\n  3. 根据本地事务的结果，向 broker 提交（消息变为可见）或回滚（删除消息）。\n  4. 如果第 3 步没有完成（生产者宕机），broker 会定期回查生产者的本地事务状态，再决定提交还是回滚。生产者要实现回查接口（根据业务 ID 查询本地事务是否成功）。\n- 适用：本地数据库操作和发送消息需要保持一致的场景（如下单后通知库存服务）。"}, {"no": 43, "title": "延迟消息怎么实现？", "section": "消息队列", "answer": "- MQ 原生支持：\n  - RocketMQ 4.x 提供固定的延迟级别（1s、5s、10s、30s、1m ...），5.x 支持任意时间的延迟。\n  - RabbitMQ 用消息 TTL 加死信交换机实现：消息在一个没有消费者的队列中过期后，被转发到死信队列，再被消费；也可以使用延迟插件。\n  - Kafka 原生不支持延迟消息。\n- 自己实现：\n  - Redis ZSET：score 为投递时间，定时任务取出到期的消息再投递到普通队列（用 Lua 保证取出并删除是原子的）。\n  - 时间轮：在内存中实现，精度高、效率高，但需要持久化和故障恢复。\n  - 数据库表加定时扫描：可靠，实现简单，适合量不大的场景。\n  - 分级延迟 topic：按延迟时长分成多个 topic，消费者检查到时间才处理，没到时间就等待或重新投递。\n- 典型场景：订单超时取消、延迟重试、定时提醒。"}, {"no": 44, "title": "死信队列的作用是什么？", "section": "消息队列", "answer": "- 定义：多次重试后仍然消费失败的消息（或者过期、被拒绝的消息），被转移到一个专门的队列，即死信队列。\n- 作用：\n  - 隔离\"毒消息\"：防止一条始终处理失败的消息无限重试，阻塞后续消息的消费（特别是在需要保证顺序的场景）。\n  - 保留问题数据：方便排查，修复问题后再重新投递处理，消息不会丢失。\n  - 用作延迟队列（RabbitMQ 的 TTL 加死信）。\n- 实践：\n  - 设置合理的最大重试次数和退避间隔。\n  - 消息进入死信队列时告警。\n  - 死信消息中保留失败原因和原始的元数据。\n  - 提供重新投递的工具。\n  - 定期清理或处理死信消息。"}, {"no": 45, "title": "【专家】用 MQ 做异步双写（Redis + MySQL）时，怎么保证两边数据一致？", "section": "消息队列", "answer": "- 明确以谁为准：通常以 MySQL 为权威数据源，Redis 是缓存或加速层；Redis 中的数据丢失或错误时，都可以从 MySQL 重建。\n- 写入顺序和失败处理：\n  - 消费者先写 MySQL（用唯一键加 upsert 保证幂等），成功后再写 Redis；Redis 写入失败时重试，重试后仍然失败就删除对应的 Redis key（下次读取时回源 MySQL 加载），而不是让 Redis 保留旧数据。\n  - 只有两边都处理成功后才提交 offset；失败的消息重试，超过次数进入死信队列。\n- 乱序：同一个用户的消息按 key 路由到同一个分区，保证顺序；数据带上时间戳，Redis 中用\"时间更新才覆盖\"的条件写入（例如 ZSET 的 ZADD GT 选项，只在分数更大时更新）。\n- 读取兜底：Redis 未命中时回源 MySQL 并回填，所以即使 Redis 数据丢失也能自动恢复。\n- 校准：定期抽样对比两边的数据，以 MySQL 为准修复 Redis；Redis 设置过期时间，避免错误数据长期存在。\n- 可举例：数字人\"最近使用\"由 697 订阅 bigpipe 后双写 Redis（ZSET 只保留 16 条，过期时间 12 个月）和 MySQL；首屏读取时 Redis 未命中就回源 MySQL 并回写。"}]}, {"title": "12 MySQL", "questions": [{"no": 1, "title": "【高频】InnoDB 为什么用 B+ 树做索引？和 B 树、哈希、红黑树相比有什么优势？", "section": "索引", "answer": "- 磁盘访问的特点：IO 以页（InnoDB 默认 16KB）为单位，随机 IO 的代价很高，所以索引结构要尽量减少磁盘访问的次数。\n- B+ 树：\n  - 非叶子节点只存键和指针，一个节点能存上千个键，树非常矮胖（三到四层就能存上千万行），一次查询只需要很少的 IO。\n  - 所有数据都在叶子节点，叶子节点之间用双向链表相连，范围查询和排序只需要顺序遍历。\n  - 每次查询都要走到叶子节点，查询性能稳定。\n- 对比：\n  - B 树：非叶子节点也存数据，单个节点能放的键更少，树更高；范围查询需要中序遍历，跨越多层。\n  - 哈希：等值查询是 O(1)，但不支持范围查询、排序、最左前缀匹配，还有哈希冲突。InnoDB 只有内部自动构建的自适应哈希索引。\n  - 红黑树和 AVL 树：每个节点只有两个分支，树太高（百万数据约 20 层），IO 次数过多。"}, {"no": 2, "title": "【高频】聚簇索引和二级索引的区别是什么？什么是回表？", "section": "索引", "answer": "- 聚簇索引（主键索引）：叶子节点存储的是整行数据，表数据本身就按主键组织成一棵 B+ 树，每张表只有一个。没有定义主键时，InnoDB 会选择第一个非空的唯一索引，再没有就使用隐藏的 row_id。\n- 二级索引（普通索引）：叶子节点存储的是索引列的值加主键值。\n- 回表：通过二级索引找到主键值后，再到聚簇索引中查出整行数据，多了一次 B+ 树的查找。\n- 影响：\n  - 回表的次数多时（命中的行很多），随机 IO 多，优化器可能放弃使用索引，改为全表扫描。\n  - 主键越长，每个二级索引占用的空间就越大，所以主键应该尽量短。"}, {"no": 3, "title": "【高频】覆盖索引、索引下推（ICP）是什么？", "section": "索引", "answer": "- 覆盖索引：查询需要的所有列都在某个二级索引中（索引列加主键），可以直接从索引中返回结果，不需要回表。EXPLAIN 的 Extra 列显示 `Using index`。常见的优化手段是为高频查询建立包含所需字段的联合索引。\n- 索引下推（Index Condition Pushdown，MySQL 5.6 引入）：\n  - 使用联合索引时，对于索引中包含但因为不满足最左前缀而无法用于定位的列，在存储引擎层先用这些列过滤，再回表。\n  - 例如索引 (name, age)，查询 `name LIKE '张%' AND age = 20`：没有 ICP 时，所有 name 匹配的记录都要回表，再由 Server 层判断 age；有了 ICP，在索引中就先过滤 age，减少回表次数。\n  - EXPLAIN 的 Extra 列显示 `Using index condition`。"}, {"no": 4, "title": "【高频】联合索引的最左前缀原则是什么？`a=1 and b>2 and c=3` 能用到哪些列？", "section": "索引", "answer": "- 最左前缀：联合索引 (a, b, c) 按 a 排序，a 相同的按 b 排序，再按 c 排序。查询只有从最左列开始、连续地使用索引列，才能用索引定位。\n  - 可以使用：a；a、b；a、b、c。\n  - 只用 b、c 时，无法用索引定位（可以使用 MySQL 8.0 的 index skip scan 特性，但有使用条件）。\n- `a=1 AND b>2 AND c=3`：\n  - a 是等值条件，可以使用；b 是范围条件，可以使用。\n  - 但在 b 的范围内，c 不是有序的，所以 c 无法用于定位，只能在索引中过滤（借助索引下推），这条查询的 key_len 只覆盖 a、b 两列。\n- 改进：如果这种查询很频繁，把索引建成 (a, c, b)，等值条件的列放在前面，范围条件的列放在最后。\n- 注意：\n  - WHERE 中条件的书写顺序不影响索引的使用，优化器会自动调整。\n  - `>=`、`BETWEEN`、`LIKE 'x%'` 在某些情况下后面的列还能继续使用，要以 EXPLAIN 的结果为准。"}, {"no": 5, "title": "【高频】哪些情况会导致索引失效？", "section": "索引", "answer": "- 对索引列做运算或使用函数：`WHERE DATE(create_time) = ...`、`WHERE id + 1 = 10`。应改写为范围条件，或者使用 MySQL 8.0 的函数索引。\n- 隐式类型转换：字符串类型的列用数字比较（`phone = 138...`），相当于对列使用了函数；字符集不同的列做关联也会出现这个问题。\n- 模糊查询以 % 开头：`LIKE '%abc'`。\n- 联合索引不满足最左前缀。\n- OR 两边的条件中有一个没有索引（可以把查询拆成 UNION）。\n- 使用 `!=`、`NOT IN`、`IS NOT NULL` 时，过滤性差，优化器往往会选择全表扫描。\n- 优化器判断全表扫描的代价更低：要回表的行太多（区分度低的列，如性别），或者统计信息不准确。\n- ORDER BY 的排序方向和索引不一致（MySQL 8.0 支持降序索引）。\n- 以 EXPLAIN 的结果为准，不要死记规则。"}, {"no": 6, "title": "主键用自增 ID 还是 UUID？为什么？", "section": "索引", "answer": "- 推荐使用自增 ID，或者趋势递增的分布式 ID（如雪花算法）。\n- 自增 ID 的优点：\n  - 新数据总是追加到 B+ 树的最右边，页的填充率高，很少发生页分裂。\n  - 占用空间小（BIGINT 是 8 字节），二级索引也更小。\n  - 插入性能好。\n- UUID 的问题：\n  - 无序，插入位置随机，导致频繁的页分裂、页面碎片和随机 IO，插入性能下降明显。\n  - 占 36 字节的字符串（或 16 字节的二进制），让主键和所有二级索引都变大。\n- 自增 ID 的注意点：\n  - 对外暴露会泄露业务量，也容易被遍历（对外使用另外一个业务 ID）。\n  - 分库分表时需要全局 ID。\n  - 高并发插入时，自增锁可能有竞争（innodb_autoinc_lock_mode=2 可以缓解）。\n- 必须使用 UUID 时，用有序的 UUID（UUIDv7，或者 MySQL 的 `UUID_TO_BIN(uuid, 1)` 交换时间位），并用二进制存储。"}, {"no": 7, "title": "【专家】一棵 B+ 树大概能存多少行数据？高度一般是几？", "section": "索引", "answer": "- 估算（页大小 16KB）：\n  - 非叶子节点：主键为 BIGINT（8 字节），加上页指针（6 字节），每个条目约 14 字节，一页大约能存 16384 / 14 ≈ 1170 个条目。\n  - 叶子节点：假设一行数据约 1KB，一页大约能存 16 行。\n  - 高度为 2：1170 × 16 ≈ 1.87 万行。\n  - 高度为 3：1170 × 1170 × 16 ≈ 2190 万行。\n  - 高度为 4：大约是 250 亿行的量级。\n- 结论：千万级数据的表，B+ 树的高度一般是 3 层；根节点和上层节点通常常驻在 Buffer Pool 中，一次查询实际只需要 1 到 2 次磁盘 IO。\n- 行越宽，叶子节点能存的行越少，高度就越高；这也是\"单表行数达到千万级时考虑拆分\"这条经验的来源，但不是硬性规定，还要看行宽、查询模式和硬件。"}, {"no": 8, "title": "前缀索引怎么用？有什么缺点？", "section": "索引", "answer": "- 用法：对长字符串列只索引前 N 个字符：`ALTER TABLE t ADD INDEX idx_email(email(10))`。减少索引占用的空间，提高单页能存放的键数。\n- 选择长度：计算区分度 `COUNT(DISTINCT LEFT(col, N)) / COUNT(*)`，选择区分度接近全列区分度的最小 N。\n- 缺点：\n  - 无法使用覆盖索引（索引中只有前缀，必须回表获取完整的值来判断）。\n  - 不能用于 ORDER BY 和 GROUP BY。\n  - 前缀区分度低时（如 URL 都以 https://www 开头），效果很差。可以把字符串反转后再建前缀索引，或者额外存一列哈希值并对它建索引。"}, {"no": 9, "title": "【高频】`WHERE IN` 里放多少个值比较合适？太多会怎样？", "section": "索引", "answer": "- 没有固定的标准，一般建议控制在几百到一千个以内，具体以压测和 EXPLAIN 的结果为准。\n- 值太多的问题：\n  - SQL 语句变得很长，解析和网络传输的开销增大，可能超过 max_allowed_packet 的限制。\n  - 优化器估算行数时，IN 的值数量超过 eq_range_index_dive_limit（默认 200）后，就从逐个精确估算（index dive）改为用统计信息粗略估算，可能选错执行计划。\n  - 一次返回大量数据，占用内存和网络，单次查询耗时变长。\n- 做法：\n  - 分批查询，每批几百个值，多批可以并发执行（控制并发数）。\n  - 对 IN 中的值先去重。\n  - 确认 IN 的列上有索引。\n- 和 N+1 查询相比：一次 IN 批量查询远好于循环逐条查询。\n- 可举例：agent-mount 把\"每个挂载项起一个协程查库\"改成 WHERE IN 批量查询后，平均耗时从 3.124s 降到 98ms。对于挂载数量特别多的智能体，还需要考虑分批查询。"}, {"no": 10, "title": "【专家】优化器为什么有时选错索引？怎么处理（analyze、force index）？", "section": "索引", "answer": "- 原因：\n  - 优化器基于代价模型做选择，代价依赖统计信息（索引的基数 cardinality、表的行数）。统计信息是通过采样估算的，大量增删数据后可能不准确。\n  - 估算回表的代价：认为回表的行数太多，于是选择了全表扫描或其他索引。\n  - ORDER BY 加 LIMIT 的场景：优化器倾向于选择排序字段上的索引来避免排序，但实际上需要扫描大量数据才能凑够 LIMIT 的行数。\n  - 数据分布不均匀（数据倾斜），统计信息中的平均值无法反映实际情况。\n- 处理：\n  - 用 `ANALYZE TABLE` 重新收集统计信息；调整采样的页数（innodb_stats_persistent_sample_pages）。\n  - 用 `FORCE INDEX` 或 `USE INDEX` 强制使用某个索引（会让代码和索引名耦合，要谨慎使用）。\n  - 改写 SQL，引导优化器（如调整 ORDER BY）。\n  - 新建更合适的索引，或删除容易误导优化器的索引。\n  - MySQL 8.0 可以使用直方图（`ANALYZE TABLE ... UPDATE HISTOGRAM`），为数据分布不均匀的列提供分布信息；也可以用优化器提示（hint）。\n- 用 EXPLAIN 和 optimizer_trace 查看优化器的估算和选择过程。"}, {"no": 11, "title": "【高频】事务的 ACID 分别靠什么实现？", "section": "事务与锁", "answer": "- 原子性（Atomicity）：靠 undo log。事务失败或回滚时，根据 undo log 撤销已经做出的修改。\n- 一致性（Consistency）：是事务的最终目标，由其他三个特性加上数据库约束（主键、外键、唯一键）和应用逻辑共同保证。\n- 隔离性（Isolation）：靠锁（行锁、间隙锁、临键锁）和 MVCC（ReadView 加 undo 版本链）。\n- 持久性（Durability）：靠 redo log。WAL（先写日志）机制，事务提交时 redo log 先落盘，即使宕机也能通过 redo log 恢复已提交的数据；配合 doublewrite buffer 防止页写入一半造成的损坏。"}, {"no": 12, "title": "【高频】四种隔离级别分别解决了什么问题？MySQL 默认是哪个？", "section": "事务与锁", "answer": "- 读未提交（Read Uncommitted）：可以读到其他事务还没有提交的修改，会出现脏读。\n- 读已提交（Read Committed，RC）：只能读到已经提交的数据，解决了脏读；但同一个事务中两次读取的结果可能不同（不可重复读）。Oracle、PostgreSQL 默认使用 RC。\n- 可重复读（Repeatable Read，RR）：同一个事务中多次读取的结果一致，解决了不可重复读。MySQL InnoDB 默认是 RR，并通过 MVCC 加临键锁在很大程度上避免了幻读。\n- 串行化（Serializable）：事务完全串行执行，读操作也要加锁，解决了所有问题，但并发性能最差。\n- 实践：很多互联网公司把 MySQL 改为 RC 级别，因为 RC 的间隙锁更少，死锁更少，并发性能更好；这时 binlog 要使用 row 格式。"}, {"no": 13, "title": "【高频】MVCC 的原理是什么？ReadView、undo log 怎么配合？", "section": "事务与锁", "answer": "- 目的：读写互不阻塞。普通的 SELECT（快照读）不加锁，读取数据的某个历史版本。\n- 实现：\n  - 每行数据有隐藏列：trx_id（最后修改这一行的事务 ID）、roll_pointer（指向 undo log 中的上一个版本）。多次修改形成一条版本链。\n  - ReadView：事务做快照读时生成的\"可见性视图\"，记录了当时的活跃事务列表（m_ids）、最小的活跃事务 ID（min_trx_id）、下一个将要分配的事务 ID（max_trx_id）、当前事务自己的 ID（creator_trx_id）。\n- 可见性判断（沿版本链从最新的版本往前找）：\n  - 版本的 trx_id 等于自己的事务 ID：可见。\n  - 小于 min_trx_id：说明生成 ReadView 时已经提交，可见。\n  - 大于等于 max_trx_id：说明是生成 ReadView 之后才开始的事务，不可见。\n  - 在两者之间：如果在 m_ids 中（生成 ReadView 时还没提交），不可见；否则可见。\n  - 不可见就沿着 roll_pointer 找上一个版本继续判断。\n- RC 和 RR 的区别：RC 每次 SELECT 都生成新的 ReadView；RR 只在事务中第一次 SELECT 时生成，之后一直复用，所以能保证可重复读。\n- undo log 的版本在没有任何 ReadView 还需要它时，由 purge 线程清理；长事务会让 undo log 无法清理而不断膨胀。"}, {"no": 14, "title": "【高频】RR 级别下怎么解决幻读？快照读和当前读有什么区别？", "section": "事务与锁", "answer": "- 快照读：普通的 SELECT，读取 MVCC 的历史版本，不加锁。在 RR 级别下，整个事务使用同一个 ReadView，其他事务新插入的行对它不可见，所以快照读不会出现幻读。\n- 当前读：`SELECT ... FOR UPDATE`、`SELECT ... LOCK IN SHARE MODE`（8.0 中是 FOR SHARE）、UPDATE、DELETE、INSERT，读取的是最新的已提交版本，并且要加锁。\n- 当前读用临键锁（Next-Key Lock，即行锁加间隙锁）锁住扫描到的记录和记录之间的间隙，阻止其他事务在这个范围内插入新的行，从而避免幻读。\n- 仍然可能出现幻读的情况：\n  - 事务先做快照读，期间其他事务插入了一行并提交，本事务再对这一行做当前读或更新（如 UPDATE 所有行），然后再快照读，就能看到这行新数据（因为这行的 trx_id 变成了自己的）。\n  - 所以说 RR 级别在很大程度上避免了幻读，但并不是完全杜绝。"}, {"no": 15, "title": "【高频】行锁、间隙锁、临键锁（Next-Key Lock）分别是什么？", "section": "事务与锁", "answer": "- 行锁（Record Lock）：锁住索引上的某一条记录。InnoDB 的行锁加在索引上；如果查询没有用到索引，会扫描并锁住所有扫描到的记录，效果接近锁表。\n- 间隙锁（Gap Lock）：锁住两条索引记录之间的间隙（开区间），防止其他事务往这个间隙中插入数据。间隙锁之间互不冲突（多个事务可以同时持有同一个间隙的间隙锁），只和插入意向锁冲突。只在 RR 级别下使用。\n- 临键锁（Next-Key Lock）：行锁加上它前面的间隙锁，是一个左开右闭的区间，是 RR 级别下加锁的基本单位。\n- 优化规则：\n  - 唯一索引的等值查询，命中记录时，临键锁退化为行锁。\n  - 等值查询没有命中记录时，退化为间隙锁。\n- 插入意向锁：插入数据前在间隙上加的锁，多个插入意向锁之间不冲突（插入的位置不同就可以并发插入），但会和间隙锁冲突。"}, {"no": 16, "title": "【专家】一条 `UPDATE ... WHERE` 语句会加哪些锁？没有索引时会怎样？", "section": "事务与锁", "answer": "- 先加表级的意向排他锁（IX），再在扫描到的索引记录上加行级的排他锁。具体加什么锁，取决于隔离级别、WHERE 条件使用的索引类型以及是否命中记录（以 RR 级别为例）：\n  - 主键或唯一索引的等值条件，并且命中记录：只对这一行加行锁（X）。\n  - 唯一索引的等值条件，没有命中记录：在对应的间隙上加间隙锁。\n  - 普通二级索引的等值条件：在二级索引上对命中的记录加临键锁，并且在下一条不满足条件的记录前的间隙上加间隙锁；同时对聚簇索引中对应的行加行锁。\n  - 范围条件：对扫描到的范围加临键锁。\n- 没有索引（全表扫描）时：\n  - RR 级别下，会对扫描到的每一条记录都加临键锁，相当于锁住了全表，其他事务的更新和插入都会被阻塞。\n  - RC 级别下，扫描过程中会对不满足条件的记录及时释放锁（semi-consistent read），影响较小，但扫描期间仍然会加锁。\n- 所以 UPDATE 和 DELETE 的 WHERE 条件必须使用索引；执行前用 EXPLAIN 确认；大批量更新要分批执行。\n- 排查锁的情况：查询 `performance_schema.data_locks`。"}, {"no": 17, "title": "【高频】死锁是怎么产生的？怎么排查和避免？", "section": "事务与锁", "answer": "- 产生原因：两个或多个事务互相持有对方需要的锁，形成循环等待。常见的情况：\n  - 两个事务以相反的顺序更新相同的两行数据。\n  - 间隙锁导致的死锁：两个事务都持有同一个间隙的间隙锁（间隙锁之间互不冲突），然后都要在这个间隙中插入数据（插入意向锁和对方的间隙锁冲突）。\n  - 唯一键冲突时会加共享锁，并发插入相同的值也可能导致死锁。\n- InnoDB 的处理：开启了死锁检测（innodb_deadlock_detect），发现死锁后回滚代价较小的事务，被回滚的事务收到 1213 错误；没有检测到的锁等待在 innodb_lock_wait_timeout 后超时。\n- 排查：\n  - `SHOW ENGINE INNODB STATUS` 查看最近一次死锁的详情（两个事务各自持有和等待的锁、对应的 SQL）。\n  - 开启 innodb_print_all_deadlocks，把所有死锁记录到错误日志。\n  - 结合 data_locks 表和业务代码分析。\n- 避免：\n  - 不同的事务以相同的顺序访问资源（如按主键排序后再更新）。\n  - 缩短事务，减少锁的持有时间；大事务拆分。\n  - WHERE 条件使用合适的索引，减少锁定的范围。\n  - 考虑使用 RC 隔离级别，减少间隙锁。\n  - 业务层捕获死锁错误后重试。"}, {"no": 18, "title": "意向锁的作用是什么？", "section": "事务与锁", "answer": "- 意向锁是表级锁，分为意向共享锁（IS）和意向排他锁（IX）。事务在给某一行加行锁之前，要先给这张表加上对应的意向锁。\n- 作用：让表级锁和行级锁能够快速判断是否冲突。\n  - 如果没有意向锁，一个事务想对整张表加表锁（如 `LOCK TABLES ... WRITE`，或者某些 DDL）时，必须逐行检查是否有行被锁住，效率极低。\n  - 有了意向锁，只需要检查表上是否存在意向锁就能判断是否冲突。\n- 兼容性：意向锁之间互相兼容（IS 和 IX 可以共存，多个事务可以同时锁定不同的行）；意向锁只和表级的共享锁、排他锁冲突，例如 IX 和表级的 S 锁冲突。\n- 意向锁由 InnoDB 自动添加，不需要用户手动操作。"}, {"no": 19, "title": "【高频】乐观锁和悲观锁怎么实现？各适合什么场景？", "section": "事务与锁", "answer": "- 悲观锁：认为冲突经常发生，操作数据之前先加锁。\n  - 实现：`SELECT ... FOR UPDATE` 锁住行，在同一个事务中处理完再提交。\n  - 适合：写冲突频繁、冲突的代价很高的场景（如热门数据的扣减、余额变更）。\n  - 缺点：锁会阻塞其他事务，并发度低，可能出现死锁，事务必须保持简短。\n- 乐观锁：认为冲突很少发生，不加锁，在更新时检查数据是否被别人修改过。\n  - 实现：用版本号字段，`UPDATE t SET ..., version = version + 1 WHERE id = ? AND version = ?`，影响行数为 0 说明有冲突，需要重试或报错；或者用条件更新，如 `UPDATE stock SET num = num - 1 WHERE id = ? AND num > 0`。\n  - 适合：读多写少、冲突概率低的场景。\n  - 缺点：冲突频繁时大量重试，浪费资源。\n- 状态机的条件更新（`WHERE status = 待处理`）本质上也是乐观锁，常用于防止重复处理任务（如 Worker 抢任务）。"}, {"no": 20, "title": "【专家】并发插入导致主键冲突或唯一键冲突，怎么处理？`INSERT ... ON DUPLICATE KEY UPDATE` 有什么坑？", "section": "事务与锁", "answer": "- 常见原因：\n  - 并发的\"先查询是否存在，不存在再插入\"，存在检查和插入之间的竞态（check-then-act）。\n  - 应用层自己生成的主键（如由时间戳、随机数拼接）发生碰撞。\n  - 重复的请求（没有做幂等）。\n- 处理方式：\n  - 依靠唯一索引兜底：直接插入，捕获 1062（重复键）错误后，按业务需要选择忽略、查询已有记录返回，或者更新。\n  - 使用 `INSERT ... ON DUPLICATE KEY UPDATE`（存在就更新）、`INSERT IGNORE`（存在就忽略）。\n  - 并发很高时，用分布式锁或队列把对同一个 key 的写入串行化。\n  - 主键使用可靠的分布式 ID，不要用时间戳之类的值拼接。\n- ON DUPLICATE KEY UPDATE 的坑：\n  - 加锁范围更大：冲突时会对相关记录加临键锁，在高并发下容易产生死锁。\n  - 表上有多个唯一索引时，可能和非预期的那条记录冲突，结果难以预测。\n  - 自增主键：即使最终执行的是更新，自增值也会被消耗，导致 ID 不连续、增长过快。\n  - 影响行数的含义：插入返回 1，更新返回 2，值没有变化返回 0，代码判断时要注意。\n  - binlog 为 statement 格式时，主从数据可能不一致（要使用 row 格式）。\n- 可举例：平台上部分质检任务无法显示，原因是并发插入时数据库主键冲突。"}, {"no": 21, "title": "【高频】redo log、undo log、binlog 分别是什么？有什么区别？", "section": "日志与存储", "answer": "- redo log（InnoDB 引擎层）：\n  - 物理日志，记录\"某个数据页的某个位置做了什么修改\"。\n  - 用于崩溃恢复，保证持久性。\n  - 采用 WAL（先写日志）：修改先写入 redo log，数据页的刷盘延后进行。\n  - 文件大小固定，循环写入；已经刷盘的数据页对应的日志空间可以被覆盖。\n- undo log（InnoDB 引擎层）：\n  - 逻辑日志，记录修改前的旧值（插入对应删除，更新记录旧值）。\n  - 用于事务回滚（原子性）和 MVCC（提供历史版本）。\n- binlog（Server 层，所有存储引擎都有）：\n  - 逻辑日志，记录 SQL 语句或行的变更。\n  - 追加写入，写满一个文件后切换到新文件，不会覆盖。\n  - 用于主从复制、按时间点恢复数据、数据订阅（如 Canal）。\n- 区别：redo log 用于崩溃恢复，不能用于复制和按时间点恢复；binlog 用于复制和恢复，但不能保证崩溃安全。两者通过两阶段提交保持一致。"}, {"no": 22, "title": "【高频】两阶段提交是什么？为什么需要？", "section": "日志与存储", "answer": "- 问题：redo log 和 binlog 是两个独立的日志，如果一个写成功、另一个没写成功时发生宕机，就会出现主库（按 redo log 恢复）和从库或备份（按 binlog 恢复）的数据不一致。\n- 流程：\n  1. prepare 阶段：写 redo log，并把状态标记为 prepare。\n  2. 写 binlog。\n  3. commit 阶段：把 redo log 的状态改为 commit。\n- 崩溃恢复时的判断：\n  - redo log 是 commit 状态：直接提交。\n  - redo log 是 prepare 状态：检查对应的 binlog 是否完整（通过 XID 关联）。binlog 完整就提交，不完整就回滚。\n  - 这样就保证了 redo log 和 binlog 的一致。\n- 性能：组提交（group commit）把多个事务的刷盘操作合并，减少 fsync 的次数。\n- 配置：sync_binlog=1 加 innodb_flush_log_at_trx_commit=1（俗称\"双 1\"）可以保证不丢数据。"}, {"no": 23, "title": "binlog 的三种格式（statement、row、mixed）有什么区别？", "section": "日志与存储", "answer": "- statement：记录原始的 SQL 语句。日志量小；但遇到不确定的函数（NOW()、UUID()、带 LIMIT 但没有 ORDER BY 的 UPDATE）时，在从库上执行的结果可能不同，造成主从不一致。\n- row：记录每一行修改前后的值。准确可靠，主从一致；可以用来做数据订阅（Canal）和闪回恢复。缺点是日志量大，例如一条 UPDATE 影响了一百万行，就会产生一百万条行记录。\n- mixed：默认使用 statement，遇到可能不安全的语句时自动切换为 row。\n- 推荐使用 row（MySQL 5.7.7 之后是默认值），可以配合 binlog_row_image=MINIMAL 减少日志量。\n- 大批量修改数据时要注意 binlog 的体积和主从延迟，应该分批执行。"}, {"no": 24, "title": "【专家】redo log 刷盘策略（innodb_flush_log_at_trx_commit）怎么配？", "section": "日志与存储", "answer": "- 取值：\n  - 1（默认，最安全）：每次事务提交时，把 redo log 写入操作系统并调用 fsync 刷到磁盘。宕机或断电都不会丢失已提交的事务；但每次提交都要 fsync，性能最低。\n  - 2：每次提交时写入操作系统的页缓存（不 fsync），后台线程每秒执行一次 fsync。MySQL 进程崩溃不会丢数据（数据已经在操作系统缓存中）；但操作系统崩溃或断电时，可能丢失约 1 秒的数据。\n  - 0：每秒写入并刷盘一次，提交时不做操作。MySQL 进程崩溃也可能丢失约 1 秒的数据。性能最高、最不安全。\n- 配合 sync_binlog：等于 1 时每次提交都刷盘 binlog；等于 N 时每 N 次提交刷盘一次。\n- 选择：\n  - 核心业务（交易、资金）：使用\"双 1\"配置。\n  - 可以容忍少量丢失的场景（日志类数据、可以重建的数据、批量导入）：可以设置为 2 或 0，提高写入性能。\n  - 组提交和 SSD 可以减小\"双 1\"对性能的影响。"}, {"no": 25, "title": "Buffer Pool 的作用是什么？LRU 怎么改进的？", "section": "日志与存储", "answer": "- 作用：InnoDB 在内存中缓存数据页和索引页，读写都先操作 Buffer Pool，减少磁盘 IO。被修改过的页（脏页）由后台线程异步刷回磁盘。一般把机器内存的 50% 到 80% 分配给 Buffer Pool。\n- 普通 LRU 的问题：\n  - 预读的页可能根本不会被访问，却挤掉了热数据。\n  - 全表扫描或大范围查询，一次性读入大量只会访问一次的页，把整个热数据区冲刷掉（缓存污染）。\n- InnoDB 的改进：\n  - 把 LRU 链表分为 young 区（热数据，约占 5/8）和 old 区（冷数据，约占 3/8）。\n  - 新读入的页先放到 old 区的头部，而不是整个链表的头部。\n  - 在 old 区中停留超过 innodb_old_blocks_time（默认 1 秒）之后再次被访问，才移到 young 区。全表扫描读入的页在短时间内被连续访问，不会进入 young 区，也就不会污染热数据。\n  - young 区前四分之一的页被访问时不移动位置，减少链表操作的开销。\n- 相关的结构：free 链表（空闲页）、flush 链表（待刷盘的脏页）。"}, {"no": 26, "title": "Change Buffer 是什么？", "section": "日志与存储", "answer": "- 作用：更新非唯一二级索引时，如果目标页不在 Buffer Pool 中，不立即从磁盘读入这个页，而是把修改操作记录在 Change Buffer 中；等以后这个页被读入内存时，再合并（merge）这些修改。也会在后台定期合并。\n- 好处：减少写操作带来的随机读 IO，提升写多读少场景下的性能。\n- 限制：\n  - 只适用于非唯一的二级索引。唯一索引在更新时必须读取页来判断是否冲突，既然已经读入了页，就没有必要缓冲。\n  - 写入后马上就读取的场景收益很小（马上就要合并）。\n- Change Buffer 本身也会持久化到系统表空间，并受 redo log 保护，宕机不会丢失。\n- 配置：innodb_change_buffer_max_size（占 Buffer Pool 的比例）。"}, {"no": 27, "title": "【高频】为什么删除大量数据后表文件没有变小？表空间怎么回收？", "section": "日志与存储", "answer": "- 原因：DELETE 只是把记录标记为删除，被删除的空间留在数据页中，以后插入数据时可以复用，但不会还给操作系统。删除整页的数据后，这个页也只是被标记为可以复用。所以表文件（.ibd 文件）的大小不会变小，还会产生大量的空洞（碎片）。\n- 回收方法：\n  - 重建表：`ALTER TABLE t ENGINE=InnoDB`，或者 `OPTIMIZE TABLE t`（InnoDB 中实际执行的就是重建表加更新统计信息）。会新建一个临时表，把数据重新紧凑地写入，然后替换原表。\n  - 使用 gh-ost 或 pt-online-schema-change 在线重建，影响更可控。\n  - 整张表都不需要时：TRUNCATE 或 DROP（会直接释放文件，前提是开启了独立表空间 innodb_file_per_table）。\n  - 分区表：直接 DROP PARTITION。\n- 注意：\n  - 重建时需要额外的磁盘空间（约等于表的大小），要提前确认空间足够。\n  - 重建会消耗大量 IO，导致主从延迟，要在低峰期执行。\n- 可举例：智能体对话数据分批删除后，在 20260507 单独做了表空间释放。"}, {"no": 28, "title": "【专家】OPTIMIZE TABLE、ALTER TABLE ENGINE=InnoDB 回收空间的原理是什么？对线上有什么影响？", "section": "日志与存储", "answer": "- 原理（MySQL 5.6 之后支持 Online DDL）：\n  1. 新建一个临时的表空间文件。\n  2. 按主键顺序扫描原表，把数据紧凑地写入新表（重建聚簇索引和所有二级索引）。\n  3. 拷贝期间，其他事务对原表的增删改记录在 row log 中。\n  4. 拷贝完成后回放 row log 中的增量修改。\n  5. 用新文件替换原表文件。\n  - 整个过程大部分时间允许读写（ALGORITHM=INPLACE，LOCK=NONE），只在开始和结束时短暂持有元数据锁（MDL）。\n- 对线上的影响：\n  - IO 和 CPU 的消耗很大，会影响其他查询的性能。\n  - 需要额外的、约等于原表大小的磁盘空间。\n  - 执行时间和表的大小成正比，大表可能要几个小时。\n  - 主从延迟：主库执行完后，DDL 才通过 binlog 发送到从库，从库再执行同样长的时间，期间从库的复制会被阻塞。\n  - MDL 的风险：开始或结束阶段需要获取 MDL 写锁，如果此时有长事务或慢查询持有 MDL 读锁，DDL 就会等待；而后续所有对这张表的查询都会排在 DDL 后面等待，可能造成整张表不可用。\n- 做法：\n  - 在低峰期执行；执行前确认没有长事务；设置 lock_wait_timeout，拿不到锁就快速放弃。\n  - 对大表使用 gh-ost（可以限速、暂停）。\n  - 通过 DBA 平台（DMS）执行。"}, {"no": 29, "title": "【高频】主从复制的原理是什么？", "section": "主从与高可用", "answer": "- 三个线程：\n  1. 主库的 dump 线程：从库连接后，主库把 binlog 的内容发送给从库。\n  2. 从库的 IO 线程：接收 binlog，写入本地的中继日志（relay log）。\n  3. 从库的 SQL 线程（或多个 worker 线程）：读取中继日志并回放，把修改应用到从库的数据上。\n- 复制模式：\n  - 异步复制（默认）：主库写完 binlog 就返回成功，不等待从库。性能最好，但主库宕机时可能丢失还没传到从库的数据。\n  - 半同步复制：至少一个从库确认收到 binlog 后，主库才返回成功。\n  - 组复制（MGR）：基于 Paxos 协议达成多数派一致。\n- GTID：每个事务有全局唯一的 ID，切换主库和搭建从库时，不需要再手动寻找 binlog 的文件名和位置，更方便可靠。\n- 并行复制：从库按组提交或按 writeset 判断哪些事务可以并行回放，降低复制延迟。"}, {"no": 30, "title": "【高频】主从延迟的原因有哪些？怎么解决？", "section": "主从与高可用", "answer": "- 原因：\n  - 大事务：一次删除或更新大量数据，从库回放需要同样长的时间。\n  - 从库回放的并发度不够（主库并发写入，从库单线程或并行度不足）。\n  - 从库的配置比主库差，或者从库还承担了大量的读查询，资源被抢占。\n  - 主库上的 DDL 操作（大表执行 DDL 时，从库要执行同样长的时间）。\n  - 没有主键的表：row 格式的 binlog 在从库回放时，每一行都要全表扫描来定位。\n  - 网络延迟。\n- 解决：\n  - 拆分大事务，分批执行（如分批删除数据）。\n  - 开启并行复制（slave_parallel_workers 加 writeset）。\n  - 从库的配置不低于主库。\n  - 每张表都要有主键。\n  - DDL 在低峰期执行，或者使用 gh-ost。\n  - 业务层：对一致性要求高的读请求走主库。\n  - 监控延迟（Seconds_Behind_Master，或者更准确的心跳表），延迟过大的从库摘除出读流量。"}, {"no": 31, "title": "半同步复制、组复制（MGR）是什么？", "section": "主从与高可用", "answer": "- 半同步复制：\n  - 主库提交事务时，至少等待一个从库确认已经把 binlog 写入中继日志，才返回成功。\n  - MySQL 5.7 的 after_sync（无损半同步）模式：在提交到存储引擎之前等待从库的确认，避免主库宕机时客户端已经看到了提交的数据，但从库上没有。\n  - 等待超时（rpl_semi_sync_master_timeout）后，退化为异步复制，以保证可用性，但这时就存在丢数据的风险。\n  - 代价是多了一次网络往返的延迟。\n- 组复制（MGR）：\n  - 多个节点组成一个复制组，基于 Paxos 的变种协议，事务要在多数节点上达成一致后才能提交。\n  - 内置冲突检测、自动故障检测和成员管理。\n  - 支持单主模式（推荐）和多主模式。\n  - 配合 MySQL Router 可以实现自动故障切换（InnoDB Cluster）。\n  - 写入延迟较高，对网络质量要求高，对大事务不友好。\n- 选择：普通业务使用\"半同步加高可用切换组件\"；对数据一致性要求很高、希望自动切换的，使用 MGR 或云数据库的高可用方案。"}, {"no": 32, "title": "【专家】主库宕机后，怎么切换并保证数据不丢？", "section": "主从与高可用", "answer": "- 故障检测：由高可用组件（MHA、Orchestrator、云数据库的高可用服务）检测到主库不可用，需要多点探测，防止误判。\n- 选出新主库：选择数据最新的从库（比较 GTID 的执行进度）；如果其他从库有比它更多的中继日志，先把差异部分补齐。\n- 补齐数据：如果原主库的机器还能访问（只是 MySQL 进程挂了），可以把它的 binlog 中还没有同步到从库的部分补到新主库上。\n- 切换：\n  - 把新主库设为可写（关闭 read_only），其他从库改为从新主库复制（GTID 模式下自动定位位置）。\n  - 修改流量入口（VIP、DNS、代理的配置）。\n  - 防止旧主库恢复后继续写入导致脑裂：通过 STONITH（强制隔离旧节点）或者设置 read_only 来隔离它。\n- 保证不丢数据：\n  - 使用无损半同步复制（after_sync）：已经提交的事务至少在一个从库上存在。\n  - 切换时优先选择收到了全部 binlog 的那个从库。\n  - 异步复制下无法保证不丢数据，只能尽量从旧主库补齐 binlog。\n- 演练：定期进行故障切换演练，确认 RTO 和 RPO 符合预期。"}, {"no": 33, "title": "【高频】慢 SQL 怎么排查？EXPLAIN 的关键字段（type、key、rows、Extra）分别看什么？", "section": "SQL 优化", "answer": "- 发现慢 SQL：\n  - 开启慢查询日志（long_query_time），用 pt-query-digest 汇总分析。\n  - 使用 DBA 平台的慢 SQL 分析功能。\n  - 查看 performance_schema 中的语句统计。\n  - 结合 APM 和 trace 定位到具体的接口。\n- EXPLAIN 的关键字段：\n  - type（访问类型，从好到差）：system、const（主键或唯一索引的等值查询）、eq_ref、ref（普通索引的等值查询）、range（范围扫描）、index（全索引扫描）、ALL（全表扫描）。一般至少要达到 range，最好是 ref 及以上。\n  - key：实际使用的索引；possible_keys 是可能使用的索引。key 为 NULL 表示没有使用索引。\n  - key_len：使用的索引长度，可以判断联合索引用到了哪几列。\n  - rows：估算需要扫描的行数（越小越好）；filtered 是按条件过滤后剩余行的比例。\n  - Extra：\n    - `Using index`：使用了覆盖索引，好。\n    - `Using where`：在 Server 层做过滤。\n    - `Using index condition`：使用了索引下推。\n    - `Using filesort`：需要额外排序，要注意。\n    - `Using temporary`：使用了临时表，要注意。\n- 进一步分析：`EXPLAIN ANALYZE`（MySQL 8.0.18 及以上）会实际执行查询，给出每一步的真实耗时和行数；optimizer_trace 可以查看优化器的选择过程。"}, {"no": 34, "title": "【高频】深分页（`LIMIT 1000000, 10`）为什么慢？怎么优化？", "section": "SQL 优化", "answer": "- 原因：MySQL 要先扫描并丢弃前 100 万行，才能取出后面的 10 行。如果没有覆盖索引，前面这 100 万行每一行都要回表，代价极大。\n- 优化方法：\n  - 游标分页（推荐）：记住上一页最后一条记录的排序值，`WHERE id > 上一页最后的 id ORDER BY id LIMIT 10`，每次都直接从索引中定位，耗时和翻页的深度无关。缺点是不能直接跳到任意一页，只能\"上一页、下一页\"。适合信息流、\"加载更多\"这类场景。\n  - 延迟关联：先在覆盖索引上查出这一页的主键，`SELECT id FROM t WHERE ... ORDER BY ... LIMIT 1000000, 10`，再用这些 ID 关联原表取出完整的行，减少回表次数。\n  - 业务限制：限制最大页码（如只允许查看前 100 页），超过的部分引导用户使用搜索。\n  - 大数据量的检索交给 ES（ES 中也要用 search_after）。\n- 可举例：\"最近使用\"接口使用 nextCursor 游标分页。"}, {"no": 35, "title": "COUNT(*)、COUNT(1)、COUNT(字段) 有什么区别？大表计数怎么做？", "section": "SQL 优化", "answer": "- 区别：\n  - COUNT(*) 和 COUNT(1)：统计行数，包括值为 NULL 的行。InnoDB 对两者的处理方式相同，性能没有差别，优化器会选择最小的二级索引来扫描。\n  - COUNT(字段)：只统计这个字段不为 NULL 的行，需要读取字段值并判断，如果字段可以为 NULL，就没法优化。\n  - 推荐使用 COUNT(*)。\n- InnoDB 没有保存总行数：因为有 MVCC，不同事务看到的行数可能不同，所以每次都要扫描（MyISAM 保存了总行数）。\n- 大表计数的方法：\n  - 维护一张计数表（在同一个事务中更新，或者异步更新），或者用 Redis 计数（需要处理一致性问题）。\n  - 只需要大致数量时，使用 EXPLAIN 的估算值，或者 information_schema 中的 table_rows（误差较大）。\n  - 按条件计数时，确保条件列有索引；定时统计后缓存结果。\n  - 列表接口不必每次都返回精确的总数（改为\"是否还有更多\"，配合游标分页）。"}, {"no": 36, "title": "JOIN 的执行算法有哪些？小表驱动大表是什么意思？", "section": "SQL 优化", "answer": "- 算法：\n  - Index Nested-Loop Join（NLJ）：遍历驱动表的每一行，用关联字段到被驱动表的索引上查找。被驱动表的关联字段有索引时使用，效率高。\n  - Block Nested-Loop Join（BNL，8.0.20 之前）：被驱动表没有可用的索引时，把驱动表的数据分块读入 join buffer，再全表扫描被驱动表，逐行和 buffer 中的数据比对，代价高。\n  - Hash Join（8.0.18 开始，8.0.20 之后取代了 BNL）：用驱动表（较小的那张表）构建哈希表，再扫描另一张表进行探测。适合没有索引的等值关联，效果比 BNL 好得多。\n- 小表驱动大表：\n  - 这里的\"小表\"指的是经过 WHERE 条件过滤后参与关联的数据量较小的那张表，而不是物理上的表大小。\n  - 在 NLJ 中，驱动表的每一行都要到被驱动表的索引上查找一次，代价约为\"驱动表行数 × 被驱动表索引的查找代价\"。驱动表越小，查找次数越少。\n  - 优化器一般会自动选择驱动表，必要时可以用 STRAIGHT_JOIN 指定。\n- 实践：被驱动表的关联字段一定要有索引；关联字段的类型和字符集要一致（否则发生隐式转换，索引失效）；高并发的业务中，尽量避免多表 JOIN，改为应用层分两次查询加批量 IN 查询。"}, {"no": 37, "title": "【高频】ORDER BY 和 GROUP BY 怎么优化？filesort 是什么？", "section": "SQL 优化", "answer": "- filesort：无法利用索引的顺序时，MySQL 要对结果额外排序。数据量小时在内存中排序（sort_buffer_size），超过时使用磁盘上的临时文件做归并排序。EXPLAIN 的 Extra 列显示 `Using filesort`。\n- ORDER BY 的优化：\n  - 让排序利用索引的有序性：WHERE 中的等值条件列加上排序列组成联合索引，如 `WHERE uid = ? ORDER BY create_time DESC` 对应索引 (uid, create_time)。\n  - 多个排序字段的方向要和索引一致（MySQL 8.0 支持降序索引）。\n  - 尽量使用覆盖索引，避免回表。\n  - 加 LIMIT，减少排序的数据量（优化器会对 LIMIT 使用堆排序）。\n- GROUP BY 的优化：\n  - 对分组字段建立索引，利用索引的有序性分组，避免创建临时表（`Using temporary`）。\n  - MySQL 8.0 中 GROUP BY 不再隐式排序，不需要再写 ORDER BY NULL。\n  - 能在 WHERE 中过滤的条件，不要放到 HAVING 中。\n- 调参：适当调大 sort_buffer_size（不要设得过大，它是按连接分配的）。"}, {"no": 38, "title": "子查询和 JOIN 怎么选？", "section": "SQL 优化", "answer": "- 早期版本（MySQL 5.5 及以前）：`IN (子查询)` 常被改写为相关子查询，对外层的每一行都执行一次子查询，性能很差，所以习惯上改写为 JOIN。\n- MySQL 5.6 及以后：优化器支持对子查询做半连接（semi-join）优化、物化等，很多 IN 和 EXISTS 子查询会被自动转换为 JOIN 执行，性能差距已经不大。\n- 选择原则：\n  - 以 EXPLAIN 的结果为准，看最终的执行计划。\n  - 语义上是\"判断是否存在\"时，用 EXISTS 或 IN 子查询更清晰；需要同时取出两张表的字段时，用 JOIN。\n  - 相关子查询在外层行数很多时仍然可能很慢，要特别注意。\n  - 复杂的子查询可以拆成多次简单的查询，在应用层处理（同时也便于做缓存和分库分表）。"}, {"no": 39, "title": "【高频】N+1 查询问题是什么？怎么避免？", "section": "SQL 优化", "answer": "- 定义：先执行 1 次查询得到 N 条记录，再对每条记录各执行 1 次查询去获取关联的数据，共执行 N+1 次查询。数据量大时，大量的网络往返和查询开销会让接口变得非常慢，并且对数据库造成很大压力。常见于 ORM 的懒加载，或者在循环中调用 DAO。\n- 避免方法：\n  - 批量查询：先收集所有关联的 ID，用 `WHERE id IN (...)` 一次查出，在内存中用 map 组装。\n  - JOIN 一次查出（注意 JOIN 的成本）。\n  - ORM 的预加载功能（如 GORM 的 Preload，它内部也是使用 IN 查询）。\n  - 对关联数据做缓存。\n  - 冗余字段：把常用的关联字段直接存到主表中。\n- 并发查询不能替代批量查询：每个关联项开一个协程并发查询，虽然看起来变快了，但查询次数和连接占用并没有减少，还会带来协程和连接池的压力。\n- 可举例：\n  - agent-mount 把\"每个挂载项起一个协程查库\"改成 WHERE IN 批量查询，平均耗时从 3.124s 降到 98ms。\n  - 删除衔接视频需求的列表接口中，对 qc_task 和 customer 使用批量 IN 查询，再在内存中聚合，避免了 JOIN 和 N+1 查询。"}, {"no": 40, "title": "JSON 字段适合存什么？JSON 字段上的查询怎么优化？", "section": "SQL 优化", "answer": "- 适合存放：\n  - 结构不固定、经常扩展的属性（扩展字段、配置项、第三方返回的原始数据）。\n  - 整体读写、很少按其中某个字段查询的数据（如 ui_data、打点日志的扩展信息、机器质检的 meta_info）。\n- 不适合：经常需要过滤、排序、关联、聚合的字段（应该拆成普通的列）；需要约束和强类型的核心业务数据。\n- 查询：使用 `col->'$.key'` 或 `col->>'$.key'`（取出不带引号的值）、JSON_EXTRACT、JSON_CONTAINS 等函数。\n- 优化：\n  - 对经常查询的 JSON 路径建立虚拟生成列（`GENERATED ALWAYS AS (col->>'$.key')`），再在这个列上建索引。\n  - MySQL 8.0.13 及以上可以直接建立函数索引；8.0.17 及以上支持对 JSON 数组建立多值索引（MEMBER OF）。\n  - 更新时使用 JSON_SET 局部修改（8.0 支持部分更新，减少日志量）。\n  - 控制 JSON 的大小，大的 JSON 会影响行的存储和查询性能。\n- 可举例：PaaS 公共资源池建设中，用 `package_result ->> '$.package_url'` 从 JSON 字段中查出形象包的地址。"}, {"no": 41, "title": "【高频】大表加字段、加索引怎么做才不锁表？Online DDL 的原理是什么？", "section": "运维与大表", "answer": "- MySQL 5.6 之后的 Online DDL：大部分 DDL 在执行期间允许并发的读写。\n  - 原理：先短暂获取 MDL 写锁做准备，然后降级为 MDL 读锁，允许 DML 操作；执行期间的 DML 变更记录到 row log 中；数据重建或索引构建完成后，回放 row log；最后再短暂获取 MDL 写锁，完成切换。\n- 语法：`ALTER TABLE t ADD COLUMN c INT, ALGORITHM=INPLACE, LOCK=NONE;` 明确指定算法和锁级别；如果不支持，语句会直接报错，而不是悄悄地锁表执行，更安全。\n- MySQL 8.0 的 INSTANT：在表的最后添加列（8.0.29 之后支持在任意位置添加）时，只修改元数据，瞬间完成。\n- 注意：\n  - 即使是 Online DDL，开始和结束时也需要 MDL 写锁。如果有长事务持有 MDL 读锁，DDL 会被阻塞，后续所有的查询都会排队，导致表不可用。执行前要检查长事务，设置 lock_wait_timeout。\n  - 重建表的操作消耗大量 IO，会导致主从延迟。\n  - 大表使用 gh-ost 或 pt-osc，可以控制速度。\n- 可举例：多次给 figure、e2e_eval_task 等表加字段，都使用了 `ALGORITHM=INPLACE, LOCK=NONE`；新增字段设置默认值，兼容存量数据，不需要回刷。"}, {"no": 42, "title": "【专家】`ALGORITHM=INPLACE` 和 `ALGORITHM=COPY`、`INSTANT` 有什么区别？哪些变更只能用 COPY？", "section": "运维与大表", "answer": "- INSTANT（MySQL 8.0）：只修改数据字典中的元数据，不触碰数据文件，瞬间完成。支持的操作有：添加列（8.0.12 起支持在末尾添加，8.0.29 起支持任意位置）、删除列（8.0.29 起）、修改列的默认值、修改 ENUM 和 SET 的定义（在末尾追加值）、修改索引类型等。\n- INPLACE：在存储引擎内部完成，不经过 Server 层创建临时表拷贝数据，期间一般允许并发的 DML（配合 LOCK=NONE）。分两种情况：\n  - 需要重建表：如添加主键、修改列的顺序、在 8.0.29 之前添加列、OPTIMIZE。\n  - 不需要重建表：如添加二级索引、修改列名、修改 varchar 的长度（不跨越 255 字节的边界时）。\n- COPY：创建一张新表，逐行拷贝数据，期间阻塞写入（只允许读），最慢、影响最大。\n- 只能使用 COPY 的变更（典型情况）：\n  - 修改列的数据类型（如 INT 改为 BIGINT、VARCHAR 改为 TEXT）。\n  - 修改字符集（转换数据）。\n  - 删除主键但不同时添加新的主键。\n  - varchar 的长度从 255 字节以内扩展到 255 字节以上（长度前缀从 1 字节变为 2 字节）。\n- 大表上需要 COPY 的变更，改用 gh-ost 或 pt-osc 在线执行，避免长时间阻塞写入。\n- 可举例：数字人主表的人设 prompt 字段改为 TEXT（支持的字数从 1500 扩到 3000）时使用了 ALGORITHM=COPY；新增 voice_info 字段时使用了 INPLACE。"}, {"no": 43, "title": "gh-ost、pt-online-schema-change 的原理是什么？", "section": "运维与大表", "answer": "- 两者的共同思路：新建一张结构已经修改好的影子表，把原表的数据分批拷贝过去，同时同步拷贝期间的增量变更，最后原子地重命名，用影子表替换原表。\n- pt-online-schema-change（Percona）：\n  - 在原表上创建 INSERT、UPDATE、DELETE 三个触发器，把增量的变更同步写入影子表。\n  - 分块拷贝存量数据。\n  - 缺点：触发器和业务写入在同一个事务中执行，会增加写入的开销和锁竞争；表上已经有触发器时无法使用。\n- gh-ost（GitHub）：\n  - 不使用触发器，而是伪装成从库，读取 binlog（需要 row 格式）来获取增量变更，异步应用到影子表。\n  - 对业务写入没有额外开销。\n  - 可以动态限速、暂停（根据负载和主从延迟自动节流），可以在从库上测试，切换的时机也可以控制。\n- 风险点：\n  - 切换时的重命名需要短暂的锁。\n  - 需要约等于原表大小的额外磁盘空间。\n  - 执行时间长，期间要监控延迟和负载。\n  - 外键会让流程变得复杂。"}, {"no": 44, "title": "【高频】大表历史数据怎么安全删除？一次删几百万行有什么问题？", "section": "运维与大表", "answer": "- 一次删除几百万行的问题：\n  - 大事务长时间持有大量的行锁和间隙锁，阻塞业务的写入。\n  - 产生大量的 undo log 和 binlog，主从延迟剧增。\n  - 中途失败时回滚的时间更长。\n  - IO 被打满，影响线上查询。\n  - 删除后表空间并不会释放。\n- 安全的做法：\n  1. 先备份或归档：导出到冷存储，校验行数和内容。\n  2. 分批删除：按主键范围分批，`DELETE FROM t WHERE id BETWEEN ? AND ? AND create_time < ?`，或者 `DELETE ... WHERE create_time < ? ORDER BY id LIMIT 5000`，每批之后休眠一段时间。\n  3. 在低峰期执行，监控主从延迟和负载，超过阈值就暂停。\n  4. 使用 DBA 平台（DMS）提交变更，经过审批，保留执行记录。\n  5. 删除完成后释放表空间（重建表）。\n- 更好的设计：按时间分区或分表，过期的数据直接 DROP PARTITION 或 DROP TABLE，几乎没有开销。\n- 可举例：对话数据冷备到 AFS 后，按 0-1023、1024-2047 两段分表生成删除 SQL，通过 DMS 的数据库原生变更方式分批执行，执行前和 DBA 确认过。"}, {"no": 45, "title": "【专家】千万级、亿级大表怎么做分库分表？分片键和分片数量怎么定？", "section": "运维与大表", "answer": "- 先评估是否真的需要：归档历史数据、冷热分离、优化索引、读写分离能不能解决问题。\n- 分片键：选择最核心的查询维度（如 uid），让大多数查询只落在一个分片上；分布要均匀；值不会改变。按 uid 分片时，同一个用户的数据会在同一个分片中，便于用户维度的查询和事务。\n- 分片数量：\n  - 按数据量和增长预期估算：如果预计 3 到 5 年后的数据量是 X，单表控制在千万行左右，那么表的数量约为 X 除以一千万，取 2 的幂（如 512、1024、2048）。\n  - 一次性规划得足够多，避免频繁扩容：分表的数量可以多，分库的数量按当前的容量需求设置，以后通过迁移整张表来扩展库的数量。\n  - 取 2 的幂，便于以后成倍扩容（采用一致性哈希或成倍分裂时，只需要迁移一半的数据）。\n- 实现方式：中间件（ShardingSphere、Vitess、云数据库的分布式版本，如 GaiaDB、DRDS），或者在应用层自己路由。\n- 配套：全局唯一 ID；非分片键的查询（映射表或同步到 ES）；分布式事务；数据迁移方案（全量加增量、校验、切流）。\n- 可举例：lgzx_app_chat_record 和 lgzx_app_third_chat_record 按 uid 对 2048 取模分表；646 init 表的方案是迁移到 GaiaDB，暂定按 uid 分成 512 张表。"}, {"no": 46, "title": "分表后（如按 uid 取模 2048 张表），按非分片键查询怎么办？", "section": "运维与大表", "answer": "- 映射表（索引表）：建立\"非分片键到分片键\"的映射，如 session_id 到 uid、订单号到 uid。先查映射表得到 uid，再定位到具体的分片。映射表本身也可能需要分片。\n- 基因法：在非分片键中嵌入分片键的信息，如生成订单号时把 uid 的后几位编码进去，从订单号就能直接算出分片，不需要再查映射表。\n- 同步到异构存储：把数据通过 binlog 同步到 ES 或数仓，复杂的查询、运营查询、统计分析都在异构存储中完成，在线库只服务分片键维度的查询。\n- 广播查询：并发查询所有分片后合并结果。只适合低频的后台查询，并且要控制并发数和超时。\n- 冗余存储：按另外一个维度再存一份数据（如同时按卖家和买家分片），写入时双写，用空间换取查询效率。\n- 可举例：对话数据导出和统计都走数仓表（search_dwd_pv_and_chat_log_hf），不直接查询 2048 张分表。"}, {"no": 47, "title": "【高频】线上批量改数据前要做哪些准备（备份、回滚 SQL、分批、DBA 确认）？", "section": "运维与大表", "answer": "- 评估影响：统计影响的行数（先用 SELECT COUNT 确认），确认 WHERE 条件准确、使用了索引；评估对线上业务的影响和执行时长。\n- 备份：把要修改或删除的数据先导出备份（按任务 ID 等条件拉取相关的几张表的数据）；或者复制整张表作为备份。\n- 准备回滚：提前写好回滚 SQL 或回滚脚本，或者确认可以从备份中恢复，并验证回滚方案确实可行。\n- 写变更 SOP：执行的顺序、每一步的验证方法、出现问题时的回滚顺序（按相反的顺序回滚）。\n- 分批执行：大批量的变更分批提交，每批之后检查结果和数据库的负载、主从延迟。\n- 审批和执行：通过 DMS 等平台提交，由 DBA 审核；在低峰期执行；先在测试环境演练。\n- 执行后验证：抽样检查数据是否正确，观察业务指标是否正常，记录执行情况。\n- 可举例：清理 20b 衔接视频数据时，制定了 SOP（按顺序执行，回滚时也按顺序回滚）；上线前分别备份了 qc_task、qc_assignment、qc_evaluation_record 三张表的对应数据；用脚本生成变更 SQL，在 DMS 上分批提交。"}, {"no": 48, "title": "字段类型怎么选（varchar 长度、text、datetime 和 timestamp）？", "section": "运维与大表", "answer": "- 整数：按取值范围选择最小的合适类型；ID 统一使用 BIGINT（UNSIGNED）；状态和枚举使用 TINYINT。\n- 字符串：\n  - varchar(n) 中 n 是字符数，按实际需要设置，不要一律设置成 255 或更大：排序和临时表会按最大长度分配内存，索引也有长度上限（utf8mb4 下单列最多 768 个字符）。\n  - 超长的内容使用 TEXT 或 JSON：不能有默认值，索引只能建前缀索引，查询时尽量不要 SELECT *，可以把大字段拆到单独的扩展表中。\n  - 字符集统一使用 utf8mb4（支持 emoji）。\n- 金额：使用 DECIMAL，或者以分为单位用 BIGINT 存储，不要用 FLOAT 或 DOUBLE（有精度问题）。\n- 时间：\n  - DATETIME：8 字节（5.6.4 之后为 5 字节，加上小数秒的额外字节），范围是 1000 年到 9999 年，和时区无关，存进去是什么就是什么。\n  - TIMESTAMP：4 字节，范围是 1970 年到 2038 年，存储时转换为 UTC，读取时按会话的时区转换。有 2038 年问题。\n  - 推荐使用 DATETIME，在应用层统一时区；也可以用 BIGINT 存储时间戳。\n- 字段尽量设置为 NOT NULL 并给出默认值（NULL 会让索引和统计变复杂）；新增字段的默认值要能兼容存量数据。"}, {"no": 49, "title": "【专家】GaiaDB、PolarDB 这类云原生数据库和传统 MySQL 架构有什么区别？", "section": "运维与大表", "answer": "- 传统 MySQL：每个实例有自己的本地存储；主从之间通过 binlog 复制完整的数据。每增加一个从库就多一份完整的数据，扩容时需要拷贝全量数据，速度很慢；存储容量受单机磁盘的限制。\n- 云原生数据库（计算和存储分离）：\n  - 计算节点（兼容 MySQL 协议）无状态，底层共享一个分布式存储（多副本、自动扩容，容量可以达到上百 TB）。\n  - 写节点把 redo log 发送给存储层，由存储层负责把日志应用到数据页（日志即数据），减少网络传输的数据量。\n  - 只读节点共享同一份存储，通过同步 redo 或者 LSN 来更新自己的缓存，增加只读节点时不需要拷贝数据，可以秒级扩容，主从延迟很低（毫秒级）。\n  - 备份基于存储快照，速度快；故障切换速度快。\n- 分布式版本（GaiaDB 的分布式形态、DRDS、PolarDB-X）：在此基础上增加了分库分表的能力，可以水平扩展写入能力。\n- 注意：\n  - 兼容 MySQL 协议，但部分特性（存储引擎、某些参数、DDL 的行为）会有差异，要参考对应产品的文档。\n  - 存储按使用量计费：删除数据后要释放表空间，才能真正降低成本。\n- 可举例：对话数据存储在 GaiaDB 集群中，单个集群的存储容量为 32159GB，治理时既要删除数据，也要释放表空间。"}, {"no": 50, "title": "【专家】数据库存储占用到 80%，你会怎么治理？", "section": "运维与大表", "answer": "- 先止血：\n  - 确认增长速度和预计写满的时间。\n  - 如果马上就要满，先扩容存储（云数据库可以在线扩容）。\n  - 暂停非必要的大批量写入。\n  - 清理明显无用的数据（临时表、备份表、过期的日志表）。\n- 分析构成：\n  - 按库和表统计数据大小和索引大小（information_schema.TABLES 中的 data_length、index_length、data_free），找出占用空间最大的表。\n  - 分析每张大表的数据：按时间的分布、无效数据的比例（如 uid=0 的数据）、是否有冗余的索引、碎片率（data_free）。\n- 治理措施：\n  - 删除无效数据：业务上不需要的数据，确认后清理（要先备份）。\n  - 冷热分离：历史数据冷备到低成本存储（AFS、对象存储），校验后从在线库删除。\n  - 释放空间：删除数据后重建表，回收碎片。\n  - 优化结构：删除冗余和无用的索引；大字段压缩或移到对象存储中；选择更合适的字段类型。\n  - 从源头治理：不再写入无效数据（如 uid=0 的请求不再入库）；定期清理的任务常态化（数据生命周期管理）。\n- 执行规范：备份、分批、和 DBA 确认、低峰期执行、监控主从延迟、可以回滚。\n- 长期：建立存储容量的监控和告警（如 70% 预警、80% 告警），做容量规划，定期复盘增长趋势。\n- 可举例：shendeng 库的存储占用约为 80%，清理 lgzx_app_thread_record 表的数据后降到约 61%。对话数据（约 20T）采用\"冷备到 AFS、抽样校验、DBA 确认后分批删除、释放表空间\"的流程完成治理。"}]}, {"title": "13 Redis", "questions": [{"no": 1, "title": "【高频】Redis 有哪些数据类型？各自的典型使用场景是什么？", "section": "数据结构", "answer": "- String：缓存对象（序列化后的 JSON）、计数器（INCR）、分布式锁（SET NX）、限流计数、Session。\n- Hash：存储对象的多个字段（用户信息、配置），可以单独读写某个字段。\n- List：消息队列（LPUSH 加 BRPOP）、最新消息列表、时间线（LRANGE 分页）。\n- Set：去重、标签、共同好友（求交集 SINTER）、抽奖（SRANDMEMBER、SPOP）。\n- ZSet（有序集合）：排行榜、按时间排序的列表（如最近使用、延迟队列）、滑动窗口限流。\n- 特殊类型：\n  - Bitmap：签到、在线状态、布隆过滤器的底层。\n  - HyperLogLog：大规模的基数统计（UV），误差约 0.81%，每个 key 最多占 12KB。\n  - GEO：附近的人、按距离计算。\n  - Stream：可持久化的消息队列，支持消费者组和 ACK。"}, {"no": 2, "title": "【高频】String、List、Hash、Set、ZSet 的底层编码分别是什么？", "section": "数据结构", "answer": "- String：\n  - int：整数值。\n  - embstr：长度不超过 44 字节的短字符串，对象头和 SDS 在一块连续的内存中。\n  - raw：较长的字符串，使用 SDS。\n- List：quicklist，即由多个 listpack 组成的双向链表（Redis 7 之前每个节点是 ziplist）。\n- Hash：\n  - 元素少、值短时使用 listpack（hash-max-listpack-entries 默认 128，hash-max-listpack-value 默认 64 字节）。\n  - 超过阈值后转为 hashtable。\n- Set：\n  - 全部是整数且数量少时使用 intset（set-max-intset-entries 默认 512）。\n  - Redis 7.2 起，元素少且不全是整数时使用 listpack。\n  - 否则使用 hashtable。\n- ZSet：\n  - 元素少时使用 listpack（zset-max-listpack-entries 默认 128，值长度默认 64 字节）。\n  - 否则使用跳表（skiplist）加 dict：dict 用于按 member 以 O(1) 查找分数，跳表用于按分数排序和范围查询。\n- 编码转换是单向的（从紧凑编码转为普通编码后不会再转回来）；可以用 `OBJECT ENCODING key` 查看编码。"}, {"no": 3, "title": "【高频】ZSet 为什么用跳表而不用红黑树？跳表的查询复杂度是多少？", "section": "数据结构", "answer": "- 跳表：在有序链表的基础上，增加多层\"快速通道\"索引。每个节点按概率（Redis 中为 1/4）随机决定层数，最高 32 层。查询时从最高层开始，向右前进，到达下一个节点比目标大的位置时下降一层，平均复杂度是 O(log N)。\n- 不用红黑树的原因（作者 antirez 的解释）：\n  - 范围查询更简单高效：找到起点后，沿着底层的链表顺序遍历即可，对应 ZRANGEBYSCORE、ZRANGE 等常用的操作；红黑树做范围查询需要中序遍历，实现更复杂。\n  - 实现简单，容易调试和修改：插入和删除只需要修改相邻节点的指针，不需要旋转。\n  - 可以灵活调整概率参数，在内存占用和性能之间权衡；平均每个节点的指针数比红黑树少。\n  - 支持按排名查询：每层的指针都记录了跨度（span），可以以 O(log N) 的复杂度计算出排名（ZRANK）。\n- 复杂度：查找、插入、删除平均都是 O(log N)，最坏情况是 O(N)（概率极低）。"}, {"no": 4, "title": "listpack 和 ziplist 有什么区别？ziplist 的连锁更新是什么？", "section": "数据结构", "answer": "- ziplist：一块连续的内存，每个元素记录前一个元素的长度（prevlen）用于从后往前遍历。prevlen 小于 254 字节时占 1 个字节，否则占 5 个字节。\n- 连锁更新：在 ziplist 中插入或修改一个元素，使它的长度从小于 254 字节变成大于等于 254 字节时，下一个元素的 prevlen 要从 1 字节扩展为 5 字节；如果下一个元素的长度也因此跨越了 254 字节的边界，就会继续影响再下一个元素……最坏情况下要重新分配 N 次内存，复杂度是 O(N²)。\n- listpack（Redis 5 引入，Redis 7 中全面替代了 ziplist）：\n  - 每个元素只记录自己的长度（编码加数据加本元素的总长度 backlen），不再记录前一个元素的长度。\n  - 从后往前遍历时，读取当前元素末尾的 backlen 就能知道这个元素的起始位置。\n  - 修改一个元素不会影响其他元素，彻底消除了连锁更新。\n- 共同点：都是为了节省内存而采用的紧凑结构，适合元素少、元素小的场景；元素多时，查找是 O(N)，所以超过阈值后会转换为其他编码。"}, {"no": 5, "title": "SDS 相比 C 字符串有什么优势？", "section": "数据结构", "answer": "- SDS（Simple Dynamic String）的结构：len（已使用的长度）、alloc（分配的总长度）、flags（类型）、buf（实际数据）。\n- 优势：\n  - O(1) 获取长度：直接读取 len 字段，C 字符串需要遍历到 '\\0'。\n  - 二进制安全：根据 len 判断结束位置，而不是 '\\0'，所以可以存储图片、序列化数据等任意的二进制内容。\n  - 防止缓冲区溢出：修改前检查空间是否足够，不够就自动扩容。\n  - 减少内存重新分配的次数：空间预分配（扩容时多分配一些空间：小于 1MB 时翻倍，大于 1MB 时每次多分配 1MB）；惰性释放（缩短字符串时不立即释放多余的空间）。\n  - 兼容部分 C 字符串函数（buf 末尾仍然保留 '\\0'）。\n- 根据字符串长度使用不同的头部类型（sdshdr8、16、32、64），节省头部占用的内存。"}, {"no": 6, "title": "【高频】用 ZSET 实现\"最近使用列表\"，member 和 score 怎么设计？怎么只保留最近 N 条？", "section": "数据结构", "answer": "- 设计：\n  - key：`user:recent:{uid}`，每个用户一个 ZSet。\n  - member：对象 ID（如 app_id），同一个对象再次被使用时，用 ZADD 更新它的分数，天然去重。\n  - score：最近使用的时间戳（毫秒或秒）。\n  - 详情（最近一条 query、会话 ID 等）存放在单独的 key 中（String 或 Hash，如 `app:recent:data:{uid}:{appId}`），ZSet 中只存 ID，保持 ZSet 轻量。\n- 写入（用 Pipeline 或 Lua 合并成一次请求）：\n  - `ZADD key ts appId`。\n  - `ZREMRANGEBYRANK key 0 -(N+1)`：按分数从低到高删除，只保留分数最高的 N 条。\n  - `EXPIRE key 过期时间`：设置过期时间，不活跃的用户自动清理。\n  - 被删除的成员对应的详情 key 也要设置过期时间或者删除。\n- 读取：`ZREVRANGE key 0 N-1 WITHSCORES` 按时间倒序获取，再批量获取详情（MGET 或 Pipeline）。\n- 乱序写入：可以用 `ZADD key GT ts appId`（Redis 6.2 起支持），只有新的时间戳比原来的大才更新，防止旧消息覆盖新数据。\n- 可举例：数字人\"最近使用\"的 ZSET `user:digital_human_recent_agents:{uid}`，member 为 appId，score 为时间戳，只缓存 16 条，过期时间 12 个月；详情存在 `app:digital_human_recent_agents:data:{uid}:{appId}` 中；Redis 未命中时回源 MySQL。"}, {"no": 7, "title": "Bitmap、HyperLogLog、GEO、Stream 分别适合什么场景？", "section": "数据结构", "answer": "- Bitmap：本质是 String，按位操作（SETBIT、GETBIT、BITCOUNT、BITOP）。适合\"大量 ID 的二值状态\"：用户签到（每天一位）、在线状态、活跃用户统计。ID 是连续整数时最省内存（1 亿个用户约占 12MB）；ID 稀疏时会浪费空间。\n- HyperLogLog：基数统计（去重计数），PFADD、PFCOUNT、PFMERGE。每个 key 固定最多占 12KB，标准误差约 0.81%。适合 UV 统计、搜索词去重计数这类大规模、允许一定误差、不需要知道具体有哪些元素的场景。\n- GEO：底层是 ZSet（用 geohash 编码作为 score），GEOADD、GEOSEARCH。适合附近的人、附近的门店、按距离排序。\n- Stream：可持久化的消息队列，支持消费者组（XGROUP、XREADGROUP）、ACK（XACK）、待处理消息列表（PEL）、消息回溯。适合轻量级的消息队列、事件流。"}, {"no": 8, "title": "【专家】用 Redis 实现排行榜，分数相同时怎么按时间排序？", "section": "数据结构", "answer": "- 问题：ZSet 中分数相同的成员按 member 的字典序排序，不能满足\"分数相同时，先达到的排在前面\"的需求。\n- 方案一，复合分数：`score = 分数 × 10^k + (MAX_TS - 达成时间)`。\n  - 分数作为高位，时间作为低位；用一个很大的常数减去时间戳，使先达成的时间值更大，在倒序排序中排在前面。\n  - 注意：ZSet 的 score 是 double 类型，精确表示的整数范围只到 2^53（约 9×10^15）。分数的取值范围乘以 10^k 不能超过这个上限，否则会丢失精度。时间可以用相对于活动开始的秒数，以减少占用的位数。\n- 方案二，小数部分表示时间：`score = 分数 + (1 - ts / 10^n)`，同样要注意精度。\n- 方案三：分数相同的成员数量不多时，取出这些成员后，再在应用层按时间（存在另一个 Hash 中）做二次排序。\n- 更新分数时，要重新计算整个复合分数（不能直接用 ZINCRBY 增加分数）。可以用 Lua 脚本原子地读取原分数、计算后写回。"}, {"no": 9, "title": "【高频】Redis 为什么快？单线程为什么还能支撑高 QPS？", "section": "线程模型与性能", "answer": "- 纯内存操作，数据结构高效（为不同场景设计了专门的编码，如 listpack、跳表、渐进式 rehash 的哈希表）。\n- 单线程执行命令：\n  - 没有锁竞争，没有线程切换的开销，实现简单。\n  - Redis 的瓶颈通常在网络和内存，而不是 CPU。\n  - 每个命令都是原子的。\n- I/O 多路复用（epoll）：一个线程同时处理成千上万个连接，只处理已经就绪的连接。\n- 高效的协议（RESP，简单、易解析）；支持 Pipeline，批量发送命令，减少网络往返。\n- 量级：单个实例在普通命令下可以达到 10 万级的 QPS。\n- 前提：避免慢命令。一个耗时的命令会阻塞所有的请求（这就是单线程的代价）。"}, {"no": 10, "title": "【高频】Redis 6.0 引入的多线程是做什么的？", "section": "线程模型与性能", "answer": "- 作用：用多个 I/O 线程并行处理网络读写（读取客户端请求、解析协议、把结果写回 socket）。在高并发、网络 I/O 成为瓶颈时，可以提升吞吐。\n- 命令的执行仍然是单线程的：所以不需要担心并发安全问题，命令的原子性不变。\n- 配置：io-threads（如 4，建议小于 CPU 核数）；io-threads-do-reads yes（是否也用多线程处理读，默认只处理写）。\n- 适用：大量的小请求、网络带宽和 CPU 有余量、单个实例的 QPS 已经达到瓶颈。\n- 补充：\n  - 在 6.0 之前，Redis 就已经用后台线程处理一些耗时操作（异步删除大 key 的 lazyfree、AOF 刷盘、关闭文件）。\n  - 持久化（RDB、AOF 重写）由 fork 出的子进程完成。"}, {"no": 11, "title": "【高频】哪些命令会阻塞 Redis（KEYS、大 key 删除、HGETALL）？怎么避免？", "section": "线程模型与性能", "answer": "- 会阻塞的命令（复杂度为 O(N)，N 很大时尤其明显）：\n  - `KEYS *`：遍历所有的 key。改用 SCAN 渐进式遍历。\n  - 对大集合执行全量操作：HGETALL、SMEMBERS、LRANGE 0 -1、ZRANGE 0 -1。改用 HSCAN、SSCAN、ZSCAN，或者分页获取。\n  - 删除大 key：DEL 一个包含几百万元素的 Hash，会同步释放内存。改用 UNLINK（异步删除），或者开启 lazyfree-lazy-* 系列配置。\n  - FLUSHALL 和 FLUSHDB：使用 ASYNC 参数。\n  - 集合运算：SUNION、SINTER、SDIFF 作用于大集合时。\n  - SORT。\n  - 执行时间长的 Lua 脚本或 MULTI 事务。\n  - 持久化相关：fork 大内存的实例时会阻塞主线程（时长和内存大小成正比）；AOF 使用 always 刷盘策略。\n- 避免：\n  - 在配置中禁用或重命名危险命令（rename-command KEYS \"\"）。\n  - 用慢查询日志（slowlog）监控。\n  - 拆分大 key。\n  - 批量操作控制每批的数量。"}, {"no": 12, "title": "【高频】大 key 有什么危害？怎么发现和拆分？", "section": "线程模型与性能", "answer": "- 标准（经验值）：String 类型的值超过 10KB；集合类型的元素个数超过 5000，或者总大小超过 10MB。\n- 危害：\n  - 读写大 key 耗时长，阻塞其他请求。\n  - 占用网络带宽。\n  - 删除时阻塞（同步释放大量内存）。\n  - 集群模式下，所在的分片内存和负载不均衡（数据倾斜）。\n  - 迁移（集群扩容）和主从同步时，传输缓慢或超时。\n  - 过期时如果是同步删除，也会阻塞。\n- 发现：\n  - `redis-cli --bigkeys`（抽样，只显示每种类型最大的 key）、`--memkeys`。\n  - `MEMORY USAGE key`。\n  - 离线分析 RDB 文件（redis-rdb-tools）。\n  - 云 Redis 的大 key 分析功能。\n- 拆分：\n  - String：按业务拆成多个 key，或者压缩；不需要整体读取时，拆成 Hash 的多个字段。\n  - 集合类型：按 ID 取模或哈希分成多个子 key（如 `key:{0..N}`），读取时只访问对应的子 key。\n  - 只保留需要的数据（如最近使用列表只保留 16 条）。\n  - 删除大 key 时用 UNLINK，或者分批删除（HSCAN 加 HDEL）。"}, {"no": 13, "title": "【高频】热 key 有什么危害？怎么发现和处理？", "section": "线程模型与性能", "answer": "- 危害：大量请求集中访问同一个 key，所在的实例或分片的 CPU 和网络被打满，成为瓶颈，影响这个分片上的其他 key；严重时这个实例宕机，流量转移到其他节点后继续打垮，引发雪崩。增加实例数量也无法解决（一个 key 只在一个分片上）。\n- 发现：\n  - `redis-cli --hotkeys`（需要设置 LFU 淘汰策略）。\n  - MONITOR 采样（对性能有影响，要短时间使用）。\n  - 在客户端或代理层统计 key 的访问频率（滑动窗口加 TopK）。\n  - 云 Redis 的热 key 分析功能。\n  - 业务上可以预知的热点（活动、热门内容）。\n- 处理：\n  - 本地缓存（最有效）：热 key 缓存在应用实例的本地，设置短的过期时间，大部分读请求不再访问 Redis。\n  - 拆分为多个副本：`key_1` 到 `key_N` 分散在不同的分片上，读取时随机选一个，写入时更新所有副本。\n  - 读写分离：增加只读副本。\n  - 限流：对热 key 单独限流。\n  - 热点写（计数器）：在本地合并后批量写入，或者拆分成多个子计数器。"}, {"no": 14, "title": "Pipeline、事务（MULTI）、Lua 脚本有什么区别？", "section": "线程模型与性能", "answer": "- Pipeline：客户端把多个命令一次性发送出去，再一次性接收结果，减少网络往返的次数（RTT）。\n  - 不保证原子性：命令之间可能穿插执行其他客户端的命令。\n  - 后面的命令不能依赖前面命令的结果。\n  - 适合批量写入、批量读取。\n- 事务（MULTI 和 EXEC）：\n  - MULTI 之后的命令进入队列，EXEC 时依次执行，执行过程中不会被其他客户端的命令打断（具有隔离性）。\n  - 但没有回滚：某个命令执行失败（如类型错误），其他命令照样执行。\n  - 可以用 WATCH 实现乐观锁：被监视的 key 在 EXEC 之前被修改，事务就会放弃执行。\n  - 后面的命令不能基于前面命令的结果做判断。\n- Lua 脚本（EVAL，或者 Redis 7 的 FUNCTION）：\n  - 整个脚本原子地执行，可以在脚本中读取数据、做逻辑判断，然后再写入（如\"检查库存后扣减\"、\"判断锁的值后再删除\"）。\n  - 也减少了网络往返。\n  - 注意：脚本执行期间会阻塞 Redis，必须短小；有 lua-time-limit 的超时保护。\n- 选择：批量处理用 Pipeline；需要原子性加条件判断时用 Lua；事务很少使用。"}, {"no": 15, "title": "【专家】Lua 脚本在集群模式下有什么限制？", "section": "线程模型与性能", "answer": "- 一个脚本访问的所有 key 必须在同一个 slot（哈希槽）中，否则会报 CROSSSLOT 错误。原因是脚本在一个节点上原子执行，无法跨节点操作数据。\n- 解决方法：使用哈希标签（hash tag），把需要一起操作的 key 中参与计算 slot 的部分用大括号括起来，如 `{user:123}:cart`、`{user:123}:stock`，只有大括号中的内容参与 slot 计算，这样它们会落在同一个 slot。\n  - 注意：哈希标签设计不当（如所有 key 都使用同一个标签）会导致数据和流量集中到一个分片，形成热点。\n- 所有用到的 key 必须通过 KEYS 参数传入，不要在脚本内部动态拼接 key 名（代理和集群需要根据 KEYS 参数来路由；动态生成的 key 可能落在别的节点上）。\n- 脚本的缓存：使用 EVALSHA 时，每个节点都要加载过脚本；节点上没有时会返回 NOSCRIPT 错误，客户端要降级为 EVAL 重新加载。\n- 执行时间：长时间运行的脚本会阻塞整个节点；脚本中执行了写操作之后，就不能再被 SCRIPT KILL 中止，只能 SHUTDOWN NOSAVE。"}, {"no": 16, "title": "【高频】RDB 和 AOF 的原理和优缺点是什么？", "section": "持久化", "answer": "- RDB（快照）：\n  - 在某个时刻把内存中的全部数据写成一个压缩的二进制文件。\n  - 触发方式：BGSAVE（fork 子进程，在后台生成）、按配置的规则自动触发（save 900 1 表示 900 秒内至少有 1 次修改就触发）、主从全量同步时。\n  - 优点：文件紧凑，适合备份和全量复制；恢复速度快。\n  - 缺点：两次快照之间的数据可能丢失（分钟级）；fork 大内存的实例时有短暂的阻塞，写时复制还会带来额外的内存占用。\n- AOF（追加日志）：\n  - 把每个写命令以追加的方式记录到日志文件，重启时重新执行这些命令来恢复数据。\n  - 刷盘策略（appendfsync）：always（每个命令都刷盘，最安全但最慢）、everysec（每秒刷盘一次，最多丢失 1 秒的数据，推荐使用）、no（由操作系统决定）。\n  - 优点：数据更完整；文件是可以阅读的命令，误操作后可以手动修复（如删掉误执行的 FLUSHALL）。\n  - 缺点：文件大、恢复慢，需要定期重写来压缩。\n- Redis 7 的 Multi-Part AOF：拆分为基础文件加增量文件，由 manifest 文件管理。"}, {"no": 17, "title": "AOF 重写的过程是什么？", "section": "持久化", "answer": "- 目的：AOF 文件会不断变大（对同一个 key 修改多次会产生多条记录）。重写时根据当前内存中的数据，为每个 key 生成最少的命令，得到一个新的、更小的 AOF 文件。不需要读取旧的 AOF 文件。\n- 过程（BGREWRITEAOF，或者按 auto-aof-rewrite-percentage 和 auto-aof-rewrite-min-size 自动触发）：\n  1. 主进程 fork 出子进程，子进程根据内存快照（写时复制）把数据写入新的文件。\n  2. 重写期间，主进程继续处理写命令，并把新的写命令同时写入旧的 AOF 和重写缓冲区。在 Redis 7 中，改为写入一个新的增量 AOF 文件，不再需要重写缓冲区。\n  3. 子进程完成后，主进程把增量部分追加到新文件（Redis 7 中更新 manifest 文件），然后原子地替换旧文件。\n- 注意：fork 和写时复制带来的内存与阻塞问题；重写期间磁盘 IO 增大。"}, {"no": 18, "title": "【高频】fork 子进程做 RDB 时，写时复制（COW）对内存有什么影响？", "section": "持久化", "answer": "- fork：创建子进程时，复制父进程的页表（不复制实际的内存数据），父子进程共享同一份物理内存页。复制页表的过程会阻塞主线程，内存越大页表越大，阻塞时间越长（每 GB 内存大约需要十几毫秒）。\n- 写时复制：子进程在写快照期间，如果主进程修改了某个内存页，内核会把这个页复制一份给主进程修改，子进程继续读取原来的页。\n- 对内存的影响：\n  - 写入越频繁，被复制的页就越多，内存占用最多可能接近翻倍。\n  - 所以 Redis 机器要预留足够的内存（如最大内存只设置为物理内存的 50% 到 70%），否则可能因为内存不足触发 OOM 被杀掉，或者使用 swap 导致性能急剧下降。\n- 透明大页（THP）：开启后，内存页的大小变为 2MB，修改一个字节也要复制 2MB，写时复制的开销会大幅增加，还会导致延迟升高。官方建议关闭 THP。\n- 其他建议：单个实例的内存不要太大（如控制在 10 到 20GB 以内）；在低峰期执行持久化；从库负责持久化，主库不做持久化（需要权衡数据安全）。"}, {"no": 19, "title": "混合持久化是什么？", "section": "持久化", "answer": "- 配置：`aof-use-rdb-preamble yes`（Redis 4.0 引入，5.0 之后默认开启）。\n- 原理：AOF 重写时，先把当前的全量数据以 RDB 格式写入新 AOF 文件的开头，之后重写期间产生的增量命令再以 AOF 格式追加在后面。\n- 优点：\n  - 恢复速度快：大部分数据是 RDB 格式，直接加载，不需要逐条执行命令。\n  - 数据完整：增量部分是 AOF 格式，最多只丢失约 1 秒的数据（everysec 策略下）。\n  - 兼具 RDB 和 AOF 的优点。\n- 缺点：AOF 文件中的 RDB 部分不可阅读，不能手动编辑；和很老的 Redis 版本不兼容。\n- 生产推荐：开启 AOF（everysec），加上混合持久化，再定期把 RDB 备份到远程存储。"}, {"no": 20, "title": "【高频】Redis 的过期删除策略是什么（惰性删除、定期删除）？", "section": "过期与淘汰", "answer": "- 过期时间保存在一个单独的过期字典中。\n- 惰性删除：访问某个 key 时，先检查它是否过期，过期了就删除并返回空。对 CPU 友好；但没有被访问的过期 key 会一直占用内存。\n- 定期删除：后台的定时任务（每秒执行 hz 次，默认 10 次）每次从过期字典中随机抽取一部分 key，删除其中已经过期的；如果过期的比例超过 25%，就继续抽取，同时限制每次执行的最长时间，避免阻塞。\n- 两者结合：在 CPU 消耗和内存回收之间取得平衡。\n- 仍然可能有大量过期的 key 没有被及时删除，这时依靠内存淘汰策略兜底。\n- 主从：从库不会主动删除过期的 key，而是等待主库同步过来的 DEL 命令（Redis 3.2 之后，从库读取过期的 key 时会返回空）。\n- 注意：大量 key 在同一时间过期，会让定期删除的任务占用较多的 CPU。"}, {"no": 21, "title": "【高频】内存淘汰策略有哪些？LRU 和 LFU 在 Redis 中怎么近似实现？", "section": "过期与淘汰", "answer": "- 在内存达到 maxmemory 时触发：\n  - noeviction（默认）：不淘汰，写命令返回错误。\n  - allkeys-lru：在所有 key 中淘汰最近最少使用的。\n  - allkeys-lfu：在所有 key 中淘汰访问频率最低的（Redis 4.0 引入）。\n  - allkeys-random：随机淘汰。\n  - volatile-lru、volatile-lfu、volatile-random：只在设置了过期时间的 key 中淘汰。\n  - volatile-ttl：淘汰剩余过期时间最短的。\n- 选择：用作缓存时一般选择 allkeys-lru 或 allkeys-lfu（有明显的热点数据时选 LFU）；既有缓存又有不能丢失的数据时，选择 volatile-* 系列（不能丢的数据不设置过期时间）。\n- 近似 LRU：\n  - 每个对象记录最后访问的时间（24 位的时钟）。\n  - 淘汰时随机抽取 maxmemory-samples 个 key（默认 5 个），淘汰其中最久没有被访问的。\n  - Redis 3.0 之后维护一个候选池（大小为 16），提高近似的效果。\n  - 不使用精确的 LRU 链表，是为了节省内存和开销。\n- 近似 LFU：\n  - 复用同一个 24 位字段：16 位记录上次的递减时间，8 位记录对数计数器（访问次数越多，计数器增长得越慢，最大为 255）。\n  - 计数器随时间衰减（lfu-decay-time），防止很久以前的热点一直占用内存。\n  - 用 lfu-log-factor 控制计数器的增长速度。"}, {"no": 22, "title": "大量 key 同时过期会有什么问题？", "section": "过期与淘汰", "answer": "- 缓存雪崩：大量缓存同时失效，请求全部打到数据库，可能把数据库打垮。\n- Redis 自身：定期删除时，如果过期 key 的比例超过 25% 就会持续循环删除，占用主线程的 CPU，导致请求延迟出现毛刺（虽然每次执行有时间上限，但会频繁触发）。\n- 删除大 key 时：如果过期的是大 key，同步删除会阻塞（可以开启 lazyfree-lazy-expire 改为异步删除）。\n- 解决：\n  - 过期时间加随机值（如基础 TTL 再加上 0 到 300 秒的随机数），把过期时间打散。\n  - 热点数据设置为不过期，或者使用逻辑过期，后台主动刷新。\n  - 开启 lazyfree 相关的配置。\n  - 应对缓存雪崩的其他手段：多级缓存、限流和降级、互斥地回源。"}, {"no": 23, "title": "【高频】缓存穿透、缓存击穿、缓存雪崩分别是什么？怎么解决？", "section": "缓存问题", "answer": "- 缓存穿透：查询的数据在缓存和数据库中都不存在（恶意请求不存在的 ID），每次请求都会穿过缓存打到数据库。\n  - 缓存空值：把不存在的结果也缓存起来，设置较短的过期时间。\n  - 布隆过滤器：预先存入所有合法的 ID，不在过滤器中的请求直接拒绝。\n  - 参数校验：拦截格式不合法的 ID。\n- 缓存击穿：某一个热点 key 过期的瞬间，大量并发请求同时回源数据库。\n  - 互斥锁或 singleflight：只允许一个请求回源，其他请求等待或者返回旧值。\n  - 逻辑过期：不设置真实的过期时间，在值中记录逻辑过期时间，过期后由一个线程异步刷新，其他请求继续返回旧值。\n  - 热点 key 永不过期，由后台主动更新。\n- 缓存雪崩：大量 key 在同一时间过期，或者 Redis 宕机，导致大量请求同时打到数据库。\n  - 过期时间加随机值。\n  - Redis 高可用（哨兵或集群）。\n  - 多级缓存（本地缓存加 Redis）。\n  - 限流、降级、熔断，保护数据库。\n  - 提前预热缓存。"}, {"no": 24, "title": "【高频】布隆过滤器的原理是什么？有什么缺点？", "section": "缓存问题", "answer": "- 原理：\n  - 一个长度为 m 的位数组，加上 k 个哈希函数。\n  - 添加元素时，用 k 个哈希函数分别计算出 k 个位置，把这些位置设置为 1。\n  - 查询时，检查这 k 个位置：只要有一个是 0，元素就一定不存在；全部是 1，元素可能存在。\n- 特点：空间效率极高（1 亿个元素、1% 的误判率，大约只需要 114MB）；查询是 O(k)。\n- 缺点：\n  - 存在误判：会把不存在的元素判断为可能存在（假阳性）；但不会把存在的元素判断为不存在。误判率由 m、n（元素个数）、k 决定，可以根据期望的误判率计算出需要的大小。\n  - 不支持删除：一个位可能被多个元素共享。需要删除时，可以使用计数布隆过滤器或布谷鸟过滤器（Cuckoo Filter）。\n  - 需要预估元素的数量：元素数量超过预估值时，误判率会急剧上升，只能重建。\n  - 需要先把全部数据加载进去，新增数据时也要同步添加。\n- 实现：RedisBloom 模块（BF.ADD、BF.EXISTS），或者用 Bitmap 自己实现，或者使用本地的布隆过滤器。"}, {"no": 25, "title": "【高频】缓存击穿时用互斥锁还是逻辑过期？", "section": "缓存问题", "answer": "- 互斥锁（或 singleflight）：\n  - 缓存未命中时，获取锁成功的那个请求负责回源并重建缓存，其他请求等待一段时间后重试读取缓存，或者通过 singleflight 共享同一次回源的结果。\n  - 优点：数据一致性好，总是返回最新的数据；实现简单。\n  - 缺点：等待期间请求的延迟增加；如果回源很慢，大量请求会被阻塞；需要处理锁超时的问题。\n- 逻辑过期：\n  - 缓存永不真正过期，值中带有逻辑过期时间。\n  - 读取时发现逻辑上已经过期，就尝试获取锁，由一个线程异步回源更新，当前请求以及其他请求直接返回旧值。\n  - 优点：不阻塞，性能好，延迟稳定。\n  - 缺点：在刷新完成之前会返回旧数据；需要提前预热（缓存中没有数据时无法使用）；占用的内存不会被自动回收。\n- 选择：对一致性要求高的数据（如价格、库存）用互斥锁；对性能和可用性要求高、可以接受短暂旧数据的热点数据（配置、热门内容）用逻辑过期。"}, {"no": 26, "title": "【高频】缓存未命中时回源数据库并回填，怎么防止并发回源？singleflight 是什么？", "section": "缓存问题", "answer": "- 问题：一个 key 未命中时，如果有大量并发请求同时到达，每个请求都会去查数据库，数据库瞬间承受多倍的压力（属于缓存击穿的一种）。\n- singleflight（Go 的 golang.org/x/sync/singleflight）：在同一个进程内，对同一个 key 的并发调用，只有第一个调用真正执行函数，其他调用等待这次执行的结果并共享它。\n```go\nv, err, _ := sf.Do(\"conf:\"+appID, func() (any, error) {\n    c, err := loadFromDB(appID)\n    if err == nil { cache.Set(appID, c, ttl) }\n    return c, err\n})\n```\n- 注意：\n  - singleflight 只在单个进程内合并请求；多实例部署时，每个实例仍然会各自回源一次，对数据库的压力从\"并发数\"量级降为\"实例数\"量级。需要全局只回源一次的，使用分布式锁。\n  - 回源函数如果卡住，所有等待的请求都会被阻塞，要设置超时（可以使用 DoChan 配合 select 超时）。\n  - 出错时所有等待的请求都会收到同一个错误，可以考虑用 Forget 让后续请求重新尝试。\n- 再配合空值缓存，防止缓存穿透。"}, {"no": 27, "title": "缓存的过期时间怎么设置？要不要加随机值？", "section": "缓存问题", "answer": "- 按数据的特点设置：\n  - 变化频繁、对一致性要求高的数据：设置短的过期时间（秒级到分钟级），或者在数据变更时主动删除缓存。\n  - 很少变化的数据（配置、字典）：设置较长的过期时间（小时级），加上主动删除缓存。\n  - 业务上有明确保留期限的数据，按期限设置（如\"最近使用\"列表保留 12 个月）。\n- 必须加随机值：批量写入的 key（如缓存预热、批量导入）如果设置了相同的过期时间，会在同一时刻集中失效，造成缓存雪崩，并让 Redis 在定期删除时消耗大量 CPU。做法是过期时间等于基础 TTL 加上一个随机数（如基础 TTL 的 10% 以内）。\n- 空值缓存：过期时间要短（如 30 秒到几分钟），防止数据已经写入数据库后，缓存中还长期保留着空值。\n- 不建议把缓存设置为永不过期（除非由后台主动维护），过期时间是保证最终一致的兜底手段。"}, {"no": 28, "title": "【专家】Redis 和 MySQL 双写时，一边失败怎么办？", "section": "缓存问题", "answer": "- 先明确以谁为准：一般以 MySQL 为准，Redis 是派生数据，可以从 MySQL 重建。\n- 先写 MySQL：\n  - MySQL 写入失败：直接返回失败（或者重试），不写 Redis，两边保持一致。\n  - MySQL 成功、Redis 失败：不要回滚 MySQL。删除 Redis 中对应的 key（下次读取时回源加载）；删除也失败时，把重试任务放进消息队列，或者依靠 binlog 订阅来补偿；最后由过期时间兜底。\n- 异步双写（通过 MQ 消费写入两边）：只有两边都成功后才提交 offset；失败的消息重试，超过次数进入死信队列；写入操作必须幂等。\n- Redis 作为主要存储、MySQL 作为持久化备份的场景（如计数）：先写 Redis，再异步批量写入 MySQL；Redis 数据丢失后，用 MySQL 中的数据恢复，接受少量的误差，并定期校准。\n- 读取兜底：Redis 未命中或数据异常时回源 MySQL，所以即使 Redis 写失败，最终也能恢复正确的数据。\n- 对账：定期抽样对比两边的数据并修复。\n- 可举例：\"最近使用\"接口由 697 订阅 pipe 后双写 Redis 和 MySQL；读取时 Redis 未命中就查 MySQL 并回写 Redis。"}, {"no": 29, "title": "【高频】主从复制的流程是什么？全量同步和增量同步有什么区别？", "section": "高可用与集群", "answer": "- 建立连接：从库执行 REPLICAOF，向主库发送 PSYNC 命令，带上自己记录的 replication ID 和复制偏移量（offset）。\n- 全量同步（第一次同步，或者无法进行增量同步时）：\n  1. 主库执行 BGSAVE 生成 RDB 文件（也可以使用无盘复制，直接通过网络发送）。\n  2. 生成 RDB 期间的新写命令，主库记录到这个从库的复制缓冲区中。\n  3. 把 RDB 发送给从库，从库清空自己的数据后加载 RDB。\n  4. 主库再把缓冲区中的命令发送给从库。\n  - 代价高：fork、磁盘 IO、网络传输、从库加载期间不可用。\n- 增量同步（断线重连后）：\n  - 主库有一个环形的复制积压缓冲区（repl-backlog-buffer，默认 1MB）。\n  - 从库重连后发送自己的 offset，如果这个 offset 之后的数据仍然在积压缓冲区中，主库只发送缺失的那部分命令。\n  - 如果数据已经被覆盖了（断线时间太长，或者缓冲区太小），就退化为全量同步。\n  - 建议根据写入速度和可能的断线时长，调大 repl-backlog-size。\n- 之后，主库持续把写命令异步发送给从库，属于异步复制，主库宕机时可能丢失少量数据。"}, {"no": 30, "title": "【高频】哨兵（Sentinel）的工作原理是什么？怎么选主？", "section": "高可用与集群", "answer": "- 作用：监控主从节点、主库故障时自动切换、通知客户端新的主库地址（客户端连接哨兵来获取主库地址）。\n- 部署：至少 3 个哨兵节点（取奇数），部署在不同的机器上。\n- 故障判定：\n  - 主观下线：某一个哨兵在 down-after-milliseconds 时间内都没有收到主库的有效回复，就认为主库下线了。\n  - 客观下线：认为主库下线的哨兵数量达到 quorum 配置的值，才判定为客观下线。\n- 选举领头哨兵：用类似 Raft 的投票机制，获得多数票的哨兵负责执行故障切换。\n- 选出新主库（按以下顺序筛选）：\n  1. 排除不健康的从库（已下线、和主库断开连接太久）。\n  2. 按 replica-priority 的优先级（值越小越优先，为 0 表示不参与选举）。\n  3. 复制偏移量最大的（数据最新）。\n  4. 运行 ID 最小的。\n- 切换：让新主库执行 REPLICAOF NO ONE，其他从库改为复制新主库，旧主库恢复后变为从库；通过发布订阅通知客户端。\n- 防止脑裂导致的数据丢失：配置 min-replicas-to-write 和 min-replicas-max-lag，主库连接的健康从库数量不足时，拒绝写入。"}, {"no": 31, "title": "【高频】Redis Cluster 的数据分片原理是什么？为什么是 16384 个槽？", "section": "高可用与集群", "answer": "- 分片：\n  - 一共有 16384 个哈希槽（slot），`slot = CRC16(key) % 16384`。\n  - 每个主节点负责一部分槽，每个主节点可以有自己的从节点。\n  - 客户端缓存\"槽到节点\"的映射，直接把请求发给对应的节点；如果映射过期了，节点返回 MOVED 重定向。\n- 去中心化：节点之间通过 Gossip 协议交换状态和槽的信息；节点故障后，由它的从节点自动提升为主节点（由其他主节点投票）。\n- 为什么是 16384 个槽（作者的解释）：\n  - 节点之间的心跳包中要携带一个槽位图，16384 个槽占 2KB；如果是 65536 个槽就要 8KB，心跳的开销太大。\n  - 集群的主节点数量一般不会超过 1000 个，16384 个槽足够分配，每个节点也能分到足够多的槽，保证分布均匀。\n  - 槽位图在节点数量少时可以被压缩，槽太多时压缩率会变低。\n- 限制：\n  - 多个 key 的操作（MGET、事务、Lua 脚本）要求这些 key 在同一个槽，需要使用哈希标签 `{}`。\n  - 只能使用 0 号数据库。"}, {"no": 32, "title": "Cluster 模式下 MOVED 和 ASK 重定向有什么区别？", "section": "高可用与集群", "answer": "- MOVED：表示这个槽已经永久迁移到了另一个节点（或者客户端的映射本来就是错的）。客户端除了把这次请求转发到新节点之外，还要更新本地的\"槽到节点\"映射，之后的请求都直接发给新节点。\n- ASK：发生在槽的迁移过程中（这个槽正在从节点 A 迁移到节点 B，处于 MIGRATING 或 IMPORTING 状态）。客户端请求节点 A 时，如果这个 key 已经被迁移到了 B，A 会返回 ASK。客户端要先向 B 发送 ASKING 命令，然后在 B 上执行这一次请求，但不更新本地的映射（因为迁移还没有完成，这个槽的其他 key 可能还在 A 上）。\n- 总结：MOVED 是永久的、需要更新映射；ASK 是临时的，只对这一次请求有效。\n- 智能客户端（如 go-redis 的 ClusterClient）会自动处理这两种重定向。"}, {"no": 33, "title": "【专家】Redis 集群扩容时数据怎么迁移？对业务有什么影响？", "section": "高可用与集群", "answer": "- 流程：\n  1. 加入新节点（CLUSTER MEET），此时它还没有分配到槽。\n  2. 规划要迁移的槽（如从每个旧节点各迁移一部分），逐个迁移。\n  3. 对每个槽：把目标节点设置为 IMPORTING 状态，源节点设置为 MIGRATING 状态；循环执行 CLUSTER GETKEYSINSLOT 获取一批 key，用 MIGRATE 命令迁移到目标节点；全部迁移完后，在所有节点上执行 CLUSTER SETSLOT NODE，宣布这个槽的新归属。\n  4. 可以使用 redis-cli --cluster reshard 或 rebalance 自动完成。\n- 对业务的影响：\n  - MIGRATE 命令对每个 key 是同步阻塞的（序列化、发送、在目标节点写入、再从源节点删除）。迁移大 key 时会长时间阻塞源节点和目标节点，可能导致超时，甚至被判定为节点故障，引发主从切换。\n  - 迁移期间会出现 ASK 重定向，延迟略有增加。\n  - 网络和 CPU 的消耗增加。\n- 建议：\n  - 先清理和拆分大 key。\n  - 在低峰期迁移，控制每批的 key 数量和迁移速度。\n  - 监控延迟。\n  - 提前扩容，不要等到内存快满时才扩容。\n  - 云 Redis 通常提供在线扩容的能力（基于代理，或者先复制再切换），对业务的影响更小。"}, {"no": 34, "title": "主从切换时会丢数据吗？怎么减少丢失？", "section": "高可用与集群", "answer": "- 会丢失：\n  - 异步复制：主库已经向客户端返回成功的写入，还没来得及同步到从库，主库就宕机了。从库被提升为新主库后，这部分数据就丢失了。\n  - 脑裂：主库和哨兵、从库之间发生网络分区，但客户端仍然能连接到旧主库并继续写入；哨兵选出了新的主库，网络恢复后旧主库降级为从库，会清空自己的数据，重新从新主库同步，分区期间写入旧主库的数据全部丢失。\n- 减少丢失：\n  - `min-replicas-to-write 1` 加 `min-replicas-max-lag 10`：主库在与它保持同步的从库数量少于 1 个，或者复制延迟超过 10 秒时，拒绝写入。以牺牲部分可用性为代价，限制了丢失数据的时间窗口，也能缓解脑裂的问题。\n  - WAIT 命令：等待指定数量的从库确认收到了数据（半同步效果），用于关键的写入。\n  - 业务层：Redis 不作为唯一的数据源，重要的数据以数据库为准，Redis 中的数据可以重建。\n- 结论：Redis 的高可用方案无法保证完全不丢数据，对强一致的数据不应该只存在 Redis 中。"}, {"no": 35, "title": "【专家】Codis、Twemproxy 这类代理方案和 Redis Cluster 有什么区别？", "section": "高可用与集群", "answer": "- 代理方案的架构：客户端连接代理，代理按 key 计算分片后，转发到后端普通的 Redis 实例。\n  - Twemproxy（Twitter）：轻量的代理，用一致性哈希分片；不支持在线扩容（增减节点需要重启或者数据会重新分布），已经基本停止维护。\n  - Codis（豌豆荚）：代理加 1024 个槽，由 Dashboard 管理，用 ZooKeeper 或 etcd 存储元数据；支持在线迁移槽和扩容（使用修改过的 Redis，codis-server）；Redis 的版本跟进较慢，目前也很少维护。\n- Redis Cluster：官方方案，没有代理，去中心化，由客户端直接连接各个节点（需要使用支持集群的客户端）。\n- 对比：\n  - 客户端：代理方案对客户端透明，任何客户端都可以使用，就像连接一个单机 Redis；Cluster 需要智能客户端，并且对多 key 操作有限制。\n  - 性能：代理方案多了一跳网络，延迟略高，代理本身也要做高可用；Cluster 直接连接节点，性能更好。\n  - 运维：代理方案有中心化的管理界面，运维直观；Cluster 依赖 Gossip，大集群中有一定的元数据同步开销，排查问题相对复杂。\n  - 功能：代理层可以统一实现读写分离、热 key 缓存、命令过滤、多租户等能力（很多云 Redis 和公司内部的方案都采用\"代理加集群\"的架构）。"}, {"no": 36, "title": "【高频】Redis 分布式锁怎么实现？SET NX PX 加 Lua 解锁为什么是必要的？", "section": "应用", "answer": "- 加锁：`SET lock:{resource} {唯一值} NX PX 30000`。\n  - NX：key 不存在时才设置成功，保证互斥。\n  - PX：设置过期时间，防止持有锁的进程崩溃后锁永远不释放（死锁）。\n  - 一条命令同时完成\"设置值\"和\"设置过期时间\"，保证原子性。早期的写法是 SETNX 加 EXPIRE 两条命令，如果在两条命令之间进程崩溃，锁就永远不会过期。\n  - 唯一值（UUID 或请求 ID）用来标识锁的持有者。\n- 解锁必须用 Lua 脚本：\n  - 如果直接执行 DEL，可能删掉别人的锁。例如：A 的锁已经过期了，B 获得了锁；A 执行完业务后执行 DEL，删掉的是 B 的锁。\n  - 如果先 GET 判断是不是自己的值，再 DEL，这两步之间锁可能刚好过期并被别人获取，仍然会误删。\n  - 所以\"判断是不是自己的值，是才删除\"必须原子执行，用 Lua 脚本实现：\n```lua\nif redis.call(\"GET\", KEYS[1]) == ARGV[1] then return redis.call(\"DEL\", KEYS[1]) end\nreturn 0\n```\n- 其他问题：锁的续期（看门狗）、可重入（用 Hash 记录重入次数）、主从切换时锁丢失（使用 Redlock 有争议，对正确性要求高时使用 fencing token 或 etcd）。"}, {"no": 37, "title": "看门狗（Redisson watchdog）机制是什么？", "section": "应用", "answer": "- 问题：锁的过期时间很难设置得刚好。设置短了，业务还没执行完锁就过期了；设置长了，持有锁的进程崩溃后，锁要很久才能释放。\n- 看门狗：\n  - 加锁时如果没有指定过期时间，Redisson 默认设置 30 秒的过期时间，并启动一个后台定时任务。\n  - 每隔过期时间的三分之一（10 秒），检查当前线程是否仍然持有锁，持有就把过期时间重置为 30 秒。\n  - 业务执行完毕，主动解锁后，停止续期。\n  - 进程崩溃时，续期任务也随之停止，锁在最多 30 秒后自动过期，不会永远锁住。\n- 在 Go 中实现：加锁成功后，启动一个 goroutine 定期执行续期（用 Lua 脚本，判断值是自己的才执行 PEXPIRE），通过 context 控制它在解锁时退出。\n- 注意：\n  - 续期失败（网络问题、锁已经被别人获取）时，要通知业务方停止操作。\n  - 业务代码卡住（死循环）时，看门狗会一直续期，锁永远不会释放，所以仍然需要设置一个业务层面的最长持有时间。\n  - 长时间的 GC 停顿仍然可能导致锁过期，对正确性要求高时需要 fencing token。"}, {"no": 38, "title": "【高频】用 Redis 实现滑动窗口限流、令牌桶限流。", "section": "应用", "answer": "- 滑动窗口（ZSET，用 Lua 保证原子性）：\n```lua\n-- KEYS[1]=限流key ARGV: now(ms) window(ms) limit member(唯一请求id)\nredis.call('ZREMRANGEBYSCORE', KEYS[1], 0, ARGV[1] - ARGV[2])\nif redis.call('ZCARD', KEYS[1]) < tonumber(ARGV[3]) then\n  redis.call('ZADD', KEYS[1], ARGV[1], ARGV[4])\n  redis.call('PEXPIRE', KEYS[1], ARGV[2])\n  return 1\nend\nreturn 0\n```\n  - 精确，但每个请求都要在 ZSET 中保存一条记录，请求量大时内存开销大。\n  - 可以改为\"分格计数\"：把窗口切成若干个小格，每个小格用一个 INCR 计数，统计时把最近几个小格的计数加起来，更节省内存。\n- 令牌桶（Hash 中存储 tokens 和 last_ts，用 Lua 实现）：\n  1. 读取当前的令牌数和上次补充令牌的时间。\n  2. 计算这段时间内应该补充的令牌：`新令牌数 = min(桶容量, tokens + (now - last_ts) × 每毫秒生成的令牌数)`。\n  3. 令牌数大于等于 1 就扣减一个并允许通过，否则拒绝。\n  4. 写回令牌数和当前时间，并设置过期时间。\n  - 时间最好由服务端统一传入（多台机器的时钟可能不一致），或者在 Lua 中用 `redis.call('TIME')` 获取 Redis 服务器的时间（Redis 5 起支持脚本效果复制，可以在脚本中使用 TIME）。\n- 现成的库：go-redis/redis_rate（基于 GCRA 算法，效果类似令牌桶）。"}, {"no": 39, "title": "用 Redis 实现延迟队列。", "section": "应用", "answer": "- ZSET 方案：\n  - 添加任务：`ZADD delay_queue {执行时间戳} {任务ID或任务内容}`。\n  - 消费：Worker 定期（如每 100 毫秒）用 Lua 原子地取出到期的任务并从 ZSET 中删除，防止多个 Worker 取到同一个任务：\n```lua\nlocal items = redis.call('ZRANGEBYSCORE', KEYS[1], 0, ARGV[1], 'LIMIT', 0, ARGV[2])\nif #items > 0 then redis.call('ZREM', KEYS[1], unpack(items)) end\nreturn items\n```\n  - 取出的任务放入一个\"处理中\"的列表（或者再推送到普通队列，如 List 或 Stream），处理成功后再删除；处理失败或超时没有确认的任务要重新放回，防止任务丢失。\n  - 任务内容较大时，ZSET 中只存任务 ID，内容存在 Hash 中。\n- 局限：\n  - 轮询会带来延迟和空转的开销。\n  - 任务量巨大时，ZSET 会成为大 key（可以按时间分片成多个 ZSET）。\n  - 数据的可靠性依赖 Redis 的持久化。\n  - 对可靠性要求高的场景，使用 MQ 的延迟消息，或者数据库加定时扫描。\n- Redisson 提供了现成的 RDelayedQueue。"}, {"no": 40, "title": "【高频】用 Redis 做轮询分配（round-robin），怎么保证并发下分配均匀？", "section": "应用", "answer": "- 用 INCR 原子计数：`n = INCR rr:{池名}`，再用 `idx = (n - 1) % 人员数量` 选出被分配的人。INCR 是原子操作，多个实例并发调用时，每次得到的值都不同，分配结果天然均匀，不会重复。\n- 人员列表的变化：\n  - 人员列表存放在 Redis 的 List 或数据库中，读取后取模。\n  - 人员数量变化时，分配的顺序会改变，但仍然是均匀的；如果要求严格按顺序轮询，可以使用\"List 加 RPOPLPUSH\"实现循环队列：`RPOPLPUSH rr_list rr_list`，每次把队尾的人员移到队头并返回，是原子操作。\n- 交叉分配（一个任务分给两个人）：`idx = (n / 2) % 人员数量`，分配给 idx 和 idx+1 这两个人，保证是两个不同的人。\n- 考虑负载：如果每个人的处理能力不同，可以使用加权轮询，或者选择\"当前未完成任务最少的人\"（用 ZSET 记录每个人的任务数，取分数最小的，并用 Lua 原子地加一）。\n- 可举例：质检员的轮询分配，单人模式下 `idx = 已分配总数 % 人数`，交叉模式下 `idx = (已分配总数 / 2) % 人数`；抽检员通过 Redis 轮询分配（assignQCUserRoundRobin）。"}, {"no": 41, "title": "Redis Stream 能替代 Kafka 吗？", "section": "应用", "answer": "- Stream 的能力：\n  - 只能追加的消息日志，每条消息有唯一的 ID（时间戳加序号）。\n  - 支持消费者组（XREADGROUP）：组内的多个消费者分担消息。\n  - 支持 ACK（XACK）和待处理消息列表（PEL）：没有确认的消息可以被重新获取或转移给其他消费者（XCLAIM、XAUTOCLAIM）。\n  - 支持阻塞读取、按 ID 回溯消费、用 MAXLEN 限制长度。\n- 和 Kafka 相比：\n  - 存储：Stream 的数据在内存中，容量受内存限制，成本高；不适合保存海量消息或长时间保留。Kafka 存在磁盘上，可以保存 TB 级的数据，保留数天甚至更久。\n  - 可靠性：Stream 依赖 Redis 的持久化（AOF everysec 可能丢失约 1 秒的数据）和异步复制（主从切换时可能丢失数据）。Kafka 有多副本和 ISR 的保证。\n  - 扩展：一个 Stream 就是一个 key，只能在一个分片上，无法像 Kafka 的分区那样水平扩展，吞吐上限就是单个节点的能力。\n  - 生态：Kafka 和流处理（Flink、Connect）的生态成熟。\n- 结论：消息量不大、对延迟要求低、可以接受少量丢失、已经在使用 Redis 的轻量场景（内部的异步任务、通知），可以使用 Stream；大规模、高可靠的数据管道和日志收集，仍然使用 Kafka。"}, {"no": 42, "title": "Session 共享用 Redis 怎么做？", "section": "应用", "answer": "- 问题：多个实例部署时，Session 存在某一台机器的内存中，用户的请求被转发到其他实例后就找不到登录状态。\n- 方案：\n  - 把 Session 集中存储到 Redis 中：key 为 `session:{sessionId}`，值用 Hash 或序列化后的 String，设置过期时间（如 30 分钟），用户每次访问时刷新过期时间（滑动过期）。\n  - sessionId 通过 Cookie（设置 HttpOnly、Secure、SameSite 属性）或请求头传递。\n  - 各个实例都从 Redis 读取，服务就变成了无状态的，可以水平扩展。\n- 注意：\n  - 安全：sessionId 要足够随机（不可预测）；登录后重新生成 sessionId，防止会话固定攻击；退出登录时主动删除。\n  - 高可用：Redis 故障会导致所有用户的登录状态失效，要部署哨兵或集群。\n  - 性能：每个请求都要访问一次 Redis，可以在网关层统一处理；Session 中只存放必要的信息。\n- 另一种方案：使用 JWT 这类无状态的 token，服务端不存储 Session；但 token 难以主动注销（需要维护黑名单），而且 token 体积较大。"}, {"no": 43, "title": "【专家】Redis 内存容量怎么预估？一个 key 的实际内存开销是多少？", "section": "应用", "answer": "- 单个 key 的开销远大于数据本身：\n  - 全局哈希表中的条目 dictEntry（约 24 字节，加上内存分配器 jemalloc 的对齐，实际约 32 字节）。\n  - key 本身的 SDS（有头部的开销）。\n  - 值的 redisObject（16 字节）加上数据部分（SDS 或具体的数据结构）。\n  - 设置了过期时间的 key，在过期字典中还有一个条目。\n  - jemalloc 按固定的规格（8、16、32、48、64……字节）分配内存，会产生内部碎片。\n  - 粗略估计：一个很小的 String 类型的 key-value，实际占用约 50 到 100 字节。\n- 估算方法：\n  - 不要只按\"数据大小乘以数量\"计算，最好的方法是实测：写入一批（如 10 万个）真实格式的数据，用 INFO memory 中 used_memory 的变化量计算出每条的平均开销，再乘以数量。\n  - 也可以用 `MEMORY USAGE key` 查看单个 key 的大小。\n- 再乘以系数：\n  - 内存碎片率（mem_fragmentation_ratio，一般在 1.0 到 1.5 之间）。\n  - fork 时写时复制需要的预留（maxmemory 建议设置为物理内存的 50% 到 70%）。\n  - 复制缓冲区、客户端缓冲区。\n  - 未来的增长余量。\n- 节省内存：使用紧凑编码（把小对象放进 Hash，利用 listpack，例如 Instagram 用 Hash 存储海量的小 key）；缩短 key 名；控制集合的大小（如只保留最近 16 条）；压缩值；设置合理的过期时间。\n- 可举例：数字人\"最近使用\"按每条 0.2KB、每个用户最多 16 条估算，单日峰值 30 万 PV 时，Redis 约需要 0.9GB。"}, {"no": 44, "title": "【专家】Redis 在线上出现延迟毛刺，你会怎么排查？", "section": "应用", "answer": "- 先区分是 Redis 本身慢，还是网络或客户端的问题：\n  - 用 `redis-cli --latency` 或 `--intrinsic-latency` 测试基础延迟。\n  - 对比客户端看到的耗时和 Redis 慢查询日志中的耗时。\n- Redis 侧常见的原因：\n  - 慢命令：`SLOWLOG GET` 查看慢查询（KEYS、HGETALL 大 key、大集合运算、耗时的 Lua 脚本）。\n  - 大 key 的读写和删除：`--bigkeys`；改用 UNLINK。\n  - fork 导致的阻塞：查看 INFO stats 中的 latest_fork_usec，看是否和 RDB 或 AOF 重写的时间点吻合；关闭透明大页（THP）。\n  - AOF 刷盘阻塞：磁盘 IO 繁忙时，fsync 会阻塞写入（INFO persistence 中的 aof_delayed_fsync）。\n  - 内存使用达到上限，频繁淘汰数据；或者发生了 swap（检查进程的 swap 使用量）。\n  - 大量 key 同时过期，导致定期删除的任务占用 CPU。\n  - CPU 争用：和其他进程抢占 CPU、绑核的问题。\n  - 用 `LATENCY DOCTOR` 和 `LATENCY HISTORY` 查看延迟事件。\n- 网络和客户端侧的原因：\n  - 连接池不足，请求在客户端排队。\n  - 网络抖动、带宽被打满（大 value）。\n  - 客户端的 GC 停顿。\n  - 连接数过多。\n- 处理：根据原因优化（拆分大 key、禁用危险命令、调整持久化策略、扩容或增加分片、使用本地缓存承接热 key）。"}, {"no": 45, "title": "【专家】什么场景不应该用 Redis？", "section": "应用", "answer": "- 需要强一致、不能丢失的核心数据（资金、订单状态）只存放在 Redis 中：Redis 是异步复制，持久化也可能丢失数据，应该以数据库为准，Redis 只作为缓存或辅助。\n- 数据量远超内存、访问频率低的冷数据：存放在内存中成本太高，应该使用数据库或对象存储。\n- 需要复杂查询的场景（多条件组合筛选、关联查询、聚合统计）：Redis 只能按 key 访问，不适合，应该使用数据库、ES 或数仓。\n- 需要事务回滚、跨多个 key 的强事务：Redis 的事务没有回滚。\n- 大规模、高可靠的消息队列：使用 Kafka 等专业的 MQ。\n- 存储大的值（文件、大段 JSON 达到 MB 级）：会阻塞 Redis、占用网络带宽，应该使用对象存储，Redis 中只存放引用。\n- 对正确性要求极高的分布式锁：使用 etcd 或 ZooKeeper 加 fencing token。\n- 结论：Redis 适合作为高性能的缓存、计数、排行、限流、临时状态的存储，不应该作为唯一的、权威的数据源。"}]}, {"title": "14 Go 语言", "questions": [{"no": 1, "title": "【高频】GMP 调度模型是什么？G、M、P 分别是什么？", "section": "并发", "answer": "- G（goroutine）：用户态的协程，包含栈（初始约 2KB，可以动态扩缩）、程序计数器、状态等信息。\n- M（machine）：操作系统线程，真正执行代码的实体。\n- P（processor）：逻辑处理器，持有本地的可运行 G 队列（最多 256 个）、内存分配缓存（mcache）等资源。M 必须绑定一个 P 才能执行 G。P 的数量由 GOMAXPROCS 决定（默认等于 CPU 核数）。\n- 调度过程：\n  - 新创建的 G 优先放入当前 P 的本地队列；本地队列满了，就把一半移到全局队列。\n  - M 从绑定的 P 的本地队列中取 G 执行。本地队列为空时，依次从全局队列获取、从网络轮询器（netpoller）获取就绪的 G、从其他 P 的队列中偷取一半（work stealing）。\n  - 为了防止全局队列中的 G 饿死，P 每调度 61 次就会检查一次全局队列。\n- 阻塞的处理：\n  - G 执行阻塞的系统调用时，M 和 P 解绑，P 交给其他 M（空闲的或新建的）继续执行别的 G；系统调用返回后，这个 G 再尝试获取 P。\n  - 网络 IO 不会阻塞 M：G 被挂起到 netpoller 上，等待数据就绪后再重新放回可运行队列。\n- 优势：用少量的线程运行大量的 goroutine，切换在用户态完成，开销小。"}, {"no": 2, "title": "【高频】goroutine 和线程有什么区别？为什么 goroutine 轻量？", "section": "并发", "answer": "- 内存：线程的栈一般是固定大小（如 1 到 8MB）；goroutine 的初始栈约 2KB，按需扩容（复制到更大的栈上）和缩容。所以一台机器可以轻松创建几十万个 goroutine。\n- 创建和销毁：线程需要系统调用，开销是微秒级；goroutine 由运行时在用户态创建，开销是纳秒到微秒级，还可以复用。\n- 切换：线程切换需要陷入内核，保存大量的寄存器，是微秒级；goroutine 的切换由 Go 调度器在用户态完成，只需要保存少量寄存器，是百纳秒级。\n- 调度：线程由操作系统抢占式调度；goroutine 由 Go 运行时调度（协作式加基于信号的抢占），M:N 地映射到线程上。\n- 阻塞：goroutine 遇到网络 IO 阻塞时，不会阻塞底层的线程。\n- 代价：goroutine 也不是免费的。大量泄漏的 goroutine 会占用内存，还会影响 GC 扫描的效率，所以要控制数量和生命周期。"}, {"no": 3, "title": "【专家】Go 的抢占式调度是怎么实现的（协作式、基于信号的异步抢占）？", "section": "并发", "answer": "- 协作式抢占（Go 1.14 之前）：\n  - 编译器在函数的开头插入栈检查的代码（morestack）。\n  - 后台的 sysmon 线程发现某个 G 运行超过 10ms 时，就把它的抢占标记（stackguard0）设为一个特殊值，下次这个 G 调用函数、执行栈检查时，就会进入调度器，让出 CPU。\n  - 问题：没有函数调用的死循环（如 `for {}`）无法被抢占，会一直占用 P，导致其他 G 饿死，GC 也无法进入 STW 阶段。\n- 基于信号的异步抢占（Go 1.14 及以后）：\n  - sysmon 发现 G 运行超过 10ms，就向它所在的 M（线程）发送 SIGURG 信号。\n  - 信号处理函数检查当前位置是否是安全点（能否安全地挂起）；如果可以，就修改上下文，注入一次对 asyncPreempt 的调用，保存寄存器后进入调度器，让出 CPU。\n  - 这样即使是没有函数调用的循环也能被抢占。\n- sysmon：一个不需要绑定 P 的后台监控线程，负责检测长时间运行的 G 并发起抢占、在系统调用时剥夺 P、轮询网络、在必要时触发 GC。"}, {"no": 4, "title": "【高频】channel 的底层结构是什么？有缓冲和无缓冲 channel 的区别是什么？", "section": "并发", "answer": "- 底层结构 hchan：\n  - 环形缓冲区：buf、qcount（当前元素个数）、dataqsiz（容量）、sendx 和 recvx（发送和接收的位置下标）。\n  - 等待队列：sendq（阻塞的发送者）、recvq（阻塞的接收者），队列中的元素是 sudog（包装了等待的 G）。\n  - 一把互斥锁 lock，以及 closed 标志。\n- 发送的流程：\n  1. 有等待的接收者：直接把数据拷贝给它，并唤醒它（不经过缓冲区）。\n  2. 缓冲区没满：放入缓冲区。\n  3. 否则，当前 G 包装成 sudog 加入 sendq 并挂起。\n- 接收的流程与之对称。\n- 无缓冲 channel（容量为 0）：发送和接收必须同时就绪才能完成，是同步通信，可以用来保证两个 G 之间的执行顺序（happens-before 关系）。\n- 有缓冲 channel：缓冲区没满时发送不阻塞，缓冲区不空时接收不阻塞，是异步通信，可以用来削峰、限制并发（作为信号量）。"}, {"no": 5, "title": "【高频】向已关闭的 channel 读写会怎样？关闭 nil channel 会怎样？", "section": "并发", "answer": "- 已关闭的 channel：\n  - 写入：panic（send on closed channel）。\n  - 读取：如果缓冲区中还有数据，先读出这些数据；读完后，再读取会立即返回元素类型的零值，可以用 `v, ok := <-ch` 判断，ok 为 false 表示已经关闭并且没有数据了。\n  - for range 会在 channel 关闭并且读完所有数据后自动退出。\n  - 再次关闭：panic（close of closed channel）。\n- nil channel（声明了但没有 make）：\n  - 读写都会永久阻塞（在 select 中，nil channel 对应的 case 永远不会被选中，可以利用这一点动态禁用某个 case）。\n  - 关闭：panic（close of nil channel）。\n- 原则：\n  - 由发送方关闭 channel，接收方不要关闭。\n  - 有多个发送方时，不要直接关闭数据 channel，可以用一个额外的信号 channel 或 context 通知它们停止，或者用 sync.Once 保证只关闭一次。"}, {"no": 6, "title": "select 的执行逻辑是什么？多个 case 同时就绪怎么选？", "section": "并发", "answer": "- 执行逻辑：\n  1. 先求值所有 case 中的 channel 表达式和要发送的值（只求值一次）。\n  2. 按随机的顺序检查各个 case 是否就绪。如果有就绪的 case，执行它；如果多个 case 同时就绪，随机选择一个（伪随机），避免某个 case 一直得不到执行（饿死）
