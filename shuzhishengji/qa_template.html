<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晋升考核题库（题目与答案）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #1f2329; }
  .wrap { max-width: 960px; margin: 24px auto 60px; padding: 0 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  select, input, button { font-size: 14px; padding: 7px 12px; border-radius: 6px; border: 1px solid #dee0e3; background: #fff; }
  input[type=number] { width: 80px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3370ff; color: #3370ff; }
  button:disabled { color: #bbbfc4; cursor: not-allowed; }
  button.primary { background: #3370ff; color: #fff; border-color: #3370ff; }
  button.primary:hover { background: #4e83fd; color: #fff; }
  .card { background: #fff; border-radius: 10px; padding: 26px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .meta { display: flex; justify-content: space-between; color: #8f959e; font-size: 13px; gap: 12px; flex-wrap: wrap; }
  .tag { background: #e8f0fe; color: #3370ff; padding: 2px 10px; border-radius: 12px; }
  .tag.sec { background: #f2f3f5; color: #646a73; }
  .badge { padding: 1px 8px; border-radius: 4px; font-size: 13px; margin-right: 6px; vertical-align: middle; }
  .badge.hot { background: #fff1e8; color: #e26912; }
  .badge.exp { background: #f0e8ff; color: #7f3bf5; }
  h2 { font-size: 21px; line-height: 1.6; margin: 16px 0 20px; }
  .answer { line-height: 1.85; font-size: 15px; border-top: 1px dashed #dee0e3; padding-top: 16px; margin-top: 16px; }
  .answer ul, .answer ol { padding-left: 22px; margin: 4px 0; }
  .answer li { margin: 2px 0; }
  .answer p { margin: 6px 0; }
  .answer code { background: #f2f3f5; padding: 1px 5px; border-radius: 4px; font-family: Menlo, Consolas, monospace; font-size: 13px; }
  .answer pre { background: #1f2329; color: #e8e8e8; padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; font-size: 13px; }
  .answer pre code { background: none; padding: 0; color: inherit; }
  .hidden { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  .hint { color: #8f959e; font-size: 13px; text-align: center; margin-top: 12px; }
  .empty { text-align: center; color: #8f959e; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <select id="fileSel"></select>
    <select id="tagSel">
      <option value="">全部难度</option>
      <option value="【高频】">只看【高频】</option>
      <option value="【专家】">只看【专家】</option>
    </select>
    <input id="kw" placeholder="搜索题目关键词">
    <label><input type="checkbox" id="autoShow"> 默认展开答案</label>
    <span style="flex:1"></span>
    <input type="number" id="jump" min="1" placeholder="第几题">
    <button id="jumpBtn">跳转</button>
  </div>

  <div class="card">
    <div id="content"></div>
  </div>

  <div class="bar">
    <button id="prev">上一题</button>
    <button id="shuffle">随机抽题</button>
    <button class="primary" id="toggle">显示答案</button>
    <button id="next">下一题</button>
  </div>
  <div class="hint">快捷键：← 上一题　→ 下一题　空格 显示/隐藏答案　R 随机抽题。当前位置会自动记住。</div>
</div>

<script>
const DATA = /*__DATA__*/null;

const $ = id => document.getElementById(id);
const all = [];
DATA.forEach((f, fi) => f.questions.forEach(q => all.push({ ...q, fi, file: f.title })));
let list = [], idx = 0, shown = false;

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
// 简单 markdown 渲染：代码块、多级有序/无序列表、段落、加粗、行内代码
function md(src) {
  const lines = src.split('\n');
  let html = '', stack = [], inCode = false, code = [], codeIndent = 0;
  const closeTo = depth => { while (stack.length > depth) html += `</li></${stack.pop().type}>`; };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      if (inCode) { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = []; inCode = false; }
      else { inCode = true; codeIndent = raw.length - raw.trimStart().length; }
      continue;
    }
    if (inCode) { code.push(raw.slice(Math.min(codeIndent, raw.length - raw.trimStart().length))); continue; }
    const m = raw.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (m) {
      const depth = Math.floor(m[1].length / 2) + 1;
      const type = /\d/.test(m[2]) ? 'ol' : 'ul';
      if (stack.length < depth) {
        while (stack.length < depth) { html += `<${type}><li>`; stack.push({ type }); }
      } else {
        closeTo(depth);
        if (stack[depth - 1].type !== type) { closeTo(depth - 1); html += `<${type}><li>`; stack.push({ type }); }
        else html += '</li><li>';
      }
      html += inline(m[3]);
    } else if (raw.trim() === '') {
      continue;
    } else {
      closeTo(0);
      html += `<p>${inline(raw.trim())}</p>`;
    }
  }
  closeTo(0);
  if (inCode) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
  return html;
}
function titleHtml(t) {
  return esc(t)
    .replace('【高频】', '<span class="badge hot">高频</span>')
    .replace('【专家】', '<span class="badge exp">专家</span>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function applyFilter(keepCurrent) {
  const fi = $('fileSel').value, tag = $('tagSel').value, kw = $('kw').value.trim().toLowerCase();
  const cur = list[idx];
  list = all.filter(q => (fi === '' || q.fi == fi) && (!tag || q.title.includes(tag)) && (!kw || q.title.toLowerCase().includes(kw)));
  idx = 0;
  if (keepCurrent && cur) { const i = list.indexOf(cur); if (i >= 0) idx = i; }
  render();
}

function render() {
  const box = $('content');
  if (!list.length) {
    box.innerHTML = '<div class="empty">没有符合条件的题目</div>';
    ['prev', 'next', 'toggle', 'shuffle'].forEach(id => $(id).disabled = true);
    return;
  }
  ['toggle', 'shuffle'].forEach(id => $(id).disabled = false);
  const q = list[idx];
  shown = $('autoShow').checked;
  box.innerHTML = `
    <div class="meta">
      <span><span class="tag">${esc(q.file)}</span> ${q.section ? `<span class="tag sec">${esc(q.section)}</span>` : ''}</span>
      <span>第 ${idx + 1} / ${list.length} 题（原题号 ${q.no}）</span>
    </div>
    <h2>${q.no}. ${titleHtml(q.title)}</h2>
    <div class="answer ${shown ? '' : 'hidden'}" id="answer">${md(q.answer)}</div>`;
  $('toggle').textContent = shown ? '隐藏答案' : '显示答案';
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === list.length - 1;
  localStorage.setItem('qa_pos', JSON.stringify({ fi: q.fi, no: q.no }));
  window.scrollTo({ top: 0 });
}

function go(step) { const n = idx + step; if (n >= 0 && n < list.length) { idx = n; render(); } }
function toggle() {
  if (!list.length) return;
  shown = !shown;
  $('answer').classList.toggle('hidden', !shown);
  $('toggle').textContent = shown ? '隐藏答案' : '显示答案';
}

$('fileSel').innerHTML = '<option value="">全部分类（' + all.length + ' 题）</option>' +
  DATA.map((f, i) => `<option value="${i}">${esc(f.title)}（${f.questions.length} 题）</option>`).join('');
$('fileSel').onchange = () => applyFilter(false);
$('tagSel').onchange = () => applyFilter(true);
$('kw').oninput = () => applyFilter(true);
$('autoShow').onchange = () => { localStorage.setItem('qa_auto', $('autoShow').checked ? '1' : ''); render(); };
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('toggle').onclick = toggle;
$('shuffle').onclick = () => { if (list.length) { idx = Math.floor(Math.random() * list.length); render(); } };
$('jumpBtn').onclick = () => { const n = parseInt($('jump').value, 10); if (n >= 1 && n <= list.length) { idx = n - 1; render(); } };
document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') $('shuffle').click();
});

$('autoShow').checked = localStorage.getItem('qa_auto') === '1';
list = all.slice();
try {
  const p = JSON.parse(localStorage.getItem('qa_pos') || 'null');
  if (p) { const i = list.findIndex(q => q.fi === p.fi && q.no === p.no); if (i >= 0) idx = i; }
} catch (e) {}
render();
</script>
</body>
</html>
